          ]),
        ]
      );
    });

    var menu = h(
      "div",
      {
        class: "menu is-latemenu" + (isDoing ? " is-progress" : ""),
        style:
          "top:" +
          (r.bottom + 6) +
          "px;right:" +
          Math.max(8, window.innerWidth - r.right) +
          "px",
      },
      [
        h("div", { class: "menu-head" }, [
          h("b", {
            text: isDelayed
              ? list.length + (list.length === 1 ? " task is delayed" : " tasks are delayed")
              : isDoing
              ? list.length + (list.length === 1 ? " task is in progress" : " tasks are in progress")
              : list.length +
                (list.length === 1 ? " task is past its deadline" : " tasks are past their deadline"),
          }),
          h("span", {
            text: isDelayed || isDoing
              ? "Click a task to open it."
              : "A deadline only flags work. Nothing here has been moved for it.",
          }),
        ]),
      ].concat(rows)
    );
    root.appendChild(menu);
  }

  function openMenu(anchorEl) {
    var existing = $("#menuRoot .menu");
    var root = $("#menuRoot");
    root.textContent = "";
    if (existing) return;
    var r = anchorEl.getBoundingClientRect();
    var items = [
      {
        label: "Work Schedule",
        hint: "Working days, hours, breaks and scheduling intervals",
        fn: openSettings,
      },
      {
        label: "Leaves & Working Days",
        hint: "Book a holiday for the team, or leave for one person",
        fn: openTimeOff,
      },
      {
        label: "Change History",
        hint: "Every change you have made, and a way back to any of them",
        fn: openHistory,
      },
      {
        label: "Data and Backup",
        hint: "Download a backup, restore one, or start over",
        fn: openData,
      },
    ];
    var menu = h(
      "div",
      {
        class: "menu",
        style: "top:" + (r.bottom + 5) + "px;right:" + (window.innerWidth - r.right) + "px",
      },
      items.map(function (it) {
        return h(
          "button",
          {
            class: "menu-item",
            onclick: function () {
              root.textContent = "";
              it.fn();
            },
          },
          [
            h("b", {
              text: it.label,
            }),
            h("span", { text: it.hint }),
          ]
        );
      })
    );
    root.appendChild(menu);
  }

  /* ------------------------------------------------------- render: sidebar */

  /**
   * A collapsible sidebar section. The whole header strip is the toggle, so a
   * long Unscheduled or Scheduled list can be folded away, and the open or
   * closed state is remembered. Sections fold independently: you usually want
   * to see what is queued and what is booked at the same time.
   */
  function section(key, title, count, headBtn, bodyKids, scrollable) {
    var collapsed = !!state.ui.collapsed[key];
    var head = h("div", {
      class: "sec-head" + (collapsed ? " is-collapsed" : ""),
      role: "button",
      tabindex: "0",
      "aria-expanded": collapsed ? "false" : "true",
      title: (collapsed ? "Show " : "Hide ") + title,
      onclick: function (ev) {
        if (ev.target.closest(".btn")) return;
        state.ui.collapsed[key] = !collapsed;
        save();
        renderSide();
      },
      onkeydown: function (ev) {
        if (ev.key === "Enter" || ev.key === " ") {
          ev.preventDefault();
          state.ui.collapsed[key] = !collapsed;
          save();
          renderSide();
        }
      },
    });
    head.appendChild(h("span", { class: "sec-chev", text: collapsed ? "▸" : "▾" }));
    head.appendChild(h("span", { class: "sec-title", text: title }));
    if (count != null) head.appendChild(h("span", { class: "sec-count", text: String(count) }));
    if (headBtn) head.appendChild(headBtn);

    var sec = h("div", { class: "sec" + (collapsed ? " is-collapsed" : "") }, [head]);
    if (!collapsed) {
      var wrap = scrollable ? h("div", { class: "sec-scroll" }) : sec;
      (Array.isArray(bodyKids) ? bodyKids : [bodyKids]).forEach(function (k) {
        if (k) wrap.appendChild(k);
      });
      if (scrollable) sec.appendChild(wrap);
    }
    return sec;
  }

  function renderSide() {
    var side = $("#side");
    side.textContent = "";

    /* ---- projects */
    var projMins = loadBy(function (t) {
      return t.projectId;
    });
    var plist = h("div", { class: "list" });
    sortedProjects().forEach(function (p) {
      var active = state.ui.projectFilter === p.id;
      plist.appendChild(
        h(
          "div",
          {
            class: "proj",
            style: projVars(p),
            role: "button",
            tabindex: "0",
            "aria-pressed": active ? "true" : "false",
            onclick: function (ev) {
              if (ev.target.classList.contains("proj-x")) return;
              state.ui.projectFilter = active ? null : p.id;
              save();
              render();
            },
            onkeydown: function (ev) {
              if (ev.key === "Enter" || ev.key === " ") {
                ev.preventDefault();
                state.ui.projectFilter = active ? null : p.id;
                save();
                render();
              }
            },
          },
          [
            h("span", { class: "proj-dot" }),
            h("span", { class: "proj-name", text: p.name }),
            h("span", {
              class: "proj-hours",
              text: projMins[p.id] ? E.fmtDuration(projMins[p.id]) : "–",
            }),
            h("button", {
              class: "proj-x",
              text: "⋯",
              title: "Edit project",
              "aria-label": "Edit " + p.name,
              onclick: function (ev) {
                ev.stopPropagation();
                openProject(p.id);
              },
            }),
          ]
        )
      );
    });
    side.appendChild(
      section(
        "projects",
        "Projects",
        state.projects.length,
        h("button", {
          class: "btn is-quiet",
          text: "+ Add",
          onclick: function () {
            openProject(null);
          },
        }),
        plist,
        true
      )
    );

    /* ---- people */
    var peopleMins = loadBy(function (t) {
      var ids = taskAssigneeIds(t);
      return ids.length ? ids : ["_none"];
    });
    /* Total availability uses the same day range Booked already sums over
       (visibleDays for Day/Week, monthDays().days for Month), so the two
       numbers in "Booked / Total Availability" are always comparable. Each
       person's own clock (time off, breaks, working days) comes straight
       from the scheduler that already produced peopleMins - no separate
       availability calculation. */
    var availRangeDays = state.ui.view === "month" ? monthDays().days : visibleDays();
    function personAvailability(personId) {
      if (!sched || !sched.usable || !sched.clockFor) return 0;
      var clock = sched.clockFor(personId);
      if (!clock) return 0;
      var mins = 0;
      availRangeDays.forEach(function (d) {
        mins += clock.capacityOf(d);
      });
      return mins;
    }
    var pplist = h("div", { class: "list" });
    sortedPeople().forEach(function (p) {
      var active = state.ui.personFilter === p.id;
      pplist.appendChild(
        h(
          "div",
          {
            class: "proj",
            role: "button",
            tabindex: "0",
            "aria-pressed": active ? "true" : "false",
            onclick: function (ev) {
              if (ev.target.classList.contains("proj-x")) return;
              state.ui.personFilter = active ? null : p.id;
              save();
              render();
            },
            onkeydown: function (ev) {
              if (ev.key === "Enter" || ev.key === " ") {
                ev.preventDefault();
                state.ui.personFilter = active ? null : p.id;
                save();
                render();
              }
            },
          },
          [
            h("span", { class: "avatar", text: initials(p.name) }),
            h("span", { class: "proj-name", text: p.name }),
            h("span", {
              class: "proj-hours",
              text: E.fmtDuration(peopleMins[p.id] || 0) + " / " + E.fmtDuration(personAvailability(p.id)),
            }),
            h("button", {
              class: "proj-x",
              text: "⋯",
              title: "Edit team member",
              "aria-label": "Edit " + p.name,
              onclick: function (ev) {
                ev.stopPropagation();
                openPerson(p.id);
              },
            }),
          ]
        )
      );
    });
    if (peopleMins._none) {
      pplist.appendChild(
        h("div", { class: "proj" }, [
          h("span", { class: "avatar is-empty", text: "–" }),
          h("span", { class: "proj-name", text: "Unassigned" }),
          h("span", { class: "proj-hours", text: E.fmtDuration(peopleMins._none) }),
        ])
      );
    }
    side.appendChild(
      section(
        "people",
        "Team Members",
        state.people.length,
        h("button", {
          class: "btn is-quiet",
          text: "+ Add",
          onclick: function () {
            openPerson(null);
          },
        }),
        pplist,
        true
      )
    );

    /* ---- unscheduled */
    var unsched = visibleTasks().filter(function (t) {
      return !t.startDate && t.status !== "done";
    });
    var ulist = h("div", { class: "list" });
    if (!unsched.length) {
      ulist.appendChild(
        h("div", { class: "empty", text: "Nothing waiting. New tasks without a date land here." })
      );
    }
    unsched.forEach(function (t) {
      ulist.appendChild(taskChip(t, true));
    });
    side.appendChild(
      section(
        "unscheduled",
        "Unscheduled",
        unsched.length,
        null,
        ulist,
        true
      )
    );

    /* ---- scheduled */
    var scheduled = visibleTasks()
      .filter(function (t) {
        return t.startDate && t.status !== "done";
      })
      .sort(function (a, b) {
        var pa = sched.placements[a.id];
        var pb = sched.placements[b.id];
        return (pa ? pa.w : 0) - (pb ? pb.w : 0);
      });
    var slist = h("div", { class: "list" });
    if (!scheduled.length) {
      slist.appendChild(
        h("div", { class: "empty", text: "Drag a task onto the calendar to schedule it." })
      );
    }
    scheduled.forEach(function (t) {
      slist.appendChild(taskChip(t, false));
    });
    side.appendChild(section("scheduled", "Scheduled", scheduled.length, null, slist, true));

    /* ---- on hold */
    var onHold = visibleTasks().filter(function (t) { return t.status === "hold"; });
    var oplist = h("div", { class: "list" });
    if (!onHold.length) oplist.appendChild(h("div", { class: "empty", text: "Nothing on hold." }));
    onHold.forEach(function (t) { oplist.appendChild(taskChip(t, !t.startDate)); });
    side.appendChild(section("onhold", "On Hold", onHold.length, null, oplist, true));

    /* ---- booked time breakdown */
    var byProject = Object.keys(projMins).map(function (k) {
      return { name: projectById(k).name, mins: projMins[k], style: projVars(projectById(k)) };
    });
    var byPerson = Object.keys(peopleMins).map(function (k) {
      return {
        name: k === "_none" ? "Unassigned" : personById(k).name,
        mins: peopleMins[k],
        style: "--pc:var(--ink-3)",
      };
    });
    var maxMins = 0;
    byProject.concat(byPerson).forEach(function (r) {
      maxMins = Math.max(maxMins, r.mins);
    });
    function barGroup(title, rows) {
      if (!rows.length) return null;
      rows.sort(function (a, b) {
        return b.mins - a.mins;
      });
      return h("div", { class: "bargroup" }, [
        h("div", { class: "bargroup-title", text: title }),
      ].concat(
        rows.map(function (r) {
          return h("div", { class: "bar", style: r.style }, [
            h("span", { class: "bar-name", text: r.name }),
            h("span", { class: "bar-track" }, h("i", {
              style: "width:" + (maxMins ? (r.mins / maxMins) * 100 : 0) + "%",
            })),
            h("span", { class: "bar-val", text: E.fmtDuration(r.mins) }),
          ]);
        })
      ));
    }
    var rangeName =
      state.ui.view === "day" ? "this day" : state.ui.view === "month" ? "this month" : "this week";
    side.appendChild(
      section("load", "Booked Time", null, null, [
        byProject.length || byPerson.length
          ? h("div", { class: "hint", style: "margin-bottom:8px", text: "Across " + rangeName + "." })
          : h("div", { class: "empty", text: "Nothing booked in " + rangeName + " yet." }),
        barGroup("By project", byProject),
        barGroup("By team member", byPerson),
      ])
    );

  }

  function taskChip(t, draggable) {
    var p = projectById(t.projectId);
    var late = isLate(t);
    var pl = sched.placements[t.id];
    var meta = [h("span", { text: E.fmtDuration(t.durationMin) })];
    if (pl) {
      meta.push(
        h("span", {
          text:
            DOW[E.weekdayFromDayIndex(E.dayIndexFromKey(pl.startDate))] +
            " " +
            E.fmtClock(pl.startMin),
        })
      );
      if (pl.blocks.length > 1) meta.push(h("span", { text: pl.blocks.length + " blocks" }));
    }
    if (t.deadline) {
      meta.push(
        h("span", {
          class: late ? "late" : "",
          text: "due " + t.deadline.slice(5).replace("-", "/"),
        })
      );
    }
    return h(
      "div",
      {
        class:
          "chip" +
          (t.status === "done" ? " is-done" : "") +
          (t.status === "hold" ? " is-hold" : "") +
          (state.ui.selectedId === t.id ? " is-selected" : ""),
        style: projVars(p),
        "data-id": t.id,
        "data-drag": draggable ? "new" : "select",
        role: "button",
        tabindex: "0",
        title: draggable ? "Drag onto the calendar to schedule" : t.name,
        onkeydown: function (ev) {
          if (ev.key === "Enter") {
            ev.preventDefault();
            openTask(t.id, {});
          }
        },
      },
      [
        h("div", { class: "chip-body" }, [
          h("div", { class: "chip-name", text: t.name }),
          h("div", { class: "chip-meta" }, meta),
        ]),
        taskAssigneeIds(t).length && !state.ui.personFilter
          ? h("span", { class: "assignee-pills" }, taskAssigneeIds(t).map(function (personId) {
              return h("span", {
                class: "avatar is-sm",
                title: personById(personId).name,
                text: initials(personById(personId).name),
              });
            }))
          : null,
      ]
    );
  }

  /* ------------------------------------------------------ render: calendar */

  function renderCalendar() {
    /* Rebuilding the calendar tears out and replaces every task element.
       If a hover tip is showing (or about to show) on one of them, that
       element is destroyed before its `mouseleave` ever fires, so the
       tip would otherwise be orphaned in the DOM with nothing left alive
       to remove it. renderCalendar() is called directly by the resize
       handler and the 60s auto-refresh interval (not just via the
       top-level render()), so the cleanup has to live here to cover
       every caller. */
    hideHoverTip();
    var head = $("#calHead");
    var body = $("#calBody");
    head.textContent = "";
    body.textContent = "";
    body.className = "cal-body" + (state.ui.view === "month" ? " is-month" : "");

    if (!sched.usable) {
      body.appendChild(
        h(
          "div",
          { style: "padding:28px;grid-column:1/-1" },
          h("div", { class: "empty" }, [
            "Every day is switched off, so nothing can be scheduled. ",
            h("a", {
              href: "#",
              text: "Open settings",
              onclick: function (ev) {
                ev.preventDefault();
                openSettings();
              },
            }),
            " and turn on at least one working day.",
          ])
        )
      );
      return;
    }

    if (state.ui.view === "month") renderMonth(head, body);
    else renderGrid(head, body);
  }

  function renderGrid(head, body) {
    var days = visibleDays();
    var range = gridRange();
    var span = range.end - range.start;
    var cols = "repeat(" + days.length + ", minmax(0,1fr))";
    var today = todayKey();
    var clock = viewClock();

    /* column headers */
    var headDays = h("div", { class: "cal-head-days", style: "grid-template-columns:" + cols });
    days.forEach(function (d) {
      var key = E.keyFromDayIndex(d);
      var win = clock.window(d);
      var cap = clock.capacityOf(d) * lanesOnDay(d);
      var used = bookedMinutes(d);
      var pct = cap ? Math.min(100, (used / cap) * 100) : 0;
      var dayOff = !!win && clock.isDayOff(d);
      var offToday = timeOffOnDay(d);
      headDays.appendChild(
        h(
          "div",
          {
            class:
              "dayhead" +
              (key === today ? " is-today" : "") +
              (win ? "" : " is-off") +
              (dayOff ? " is-dayoff" : ""),
            role: "button",
            tabindex: "0",
            title: "Show " + DOW_FULL[E.weekdayFromDayIndex(d)] + " on its own",
            onclick: function () {
              state.ui.anchor = key;
              state.ui.view = "day";
              save();
              render();
            },
          },
          [
            h("div", { class: "dayhead-top" }, [
              h("span", { class: "dayhead-dow", text: DOW[E.weekdayFromDayIndex(d)] }),
              h("span", { class: "dayhead-num", text: String(+key.split("-")[2]) }),
              h("span", {
                class: "dayhead-load",
                text: !win
                  ? "Non-Working"
                  : dayOff
                  ? "Off"
                  : E.fmtDuration(used) + " / " + E.fmtDuration(cap),
              }),
            ]),
            win && !dayOff
              ? h(
                  "div",
                  { class: "dayhead-bar" + (used >= cap ? " is-full" : "") },
                  h("i", { style: "width:" + pct + "%" })
                )
              : null,
            win && offToday.length
              ? h("div", {
                  class: "dayhead-off",
                  text: offToday
                    .map(function (e) {
                      return e.name + (e.people && e.people.length ? " · " + whoLabel(e) : "");
                    })
                    .join("  |  "),
                  title: offToday
                    .map(function (e) {
                      return e.name + ": " + offSummary(e) + " — " + whoLabel(e);
                    })
                    .join("\n"),
                })
              : null,
          ]
        )
      );
    });
    head.appendChild(h("div", { class: "gutter-head" }));
    head.appendChild(headDays);

    /* Scale the hour height so a normal working day fills the window without
       scrolling, and a long one still scrolls at a readable density. Measured
       only now the header is in place, or the header's height is counted twice
       and the last hour falls off the bottom. */
    var avail = body.clientHeight;
    if (avail > 120) {
      HOUR = Math.max(46, Math.min(104, (avail - 38) / (span / 60)));
    }
    var gridH = (span / 60) * HOUR;

    /* hour gutter and grid lines */
    var gutter = h("div", { class: "gutter", style: "--grid-h:" + gridH + "px" });
    var lines = h("div", { class: "gridlines" });
    for (var m = range.start; m <= range.end; m += 30) {
      lines.appendChild(
        h("div", {
          class: m % 60 === 0 ? "" : "half",
          style: "top:" + ((m - range.start) / 60) * HOUR + "px",
        })
      );
    }
    for (var hh = Math.ceil(range.start / 60); hh <= Math.floor(range.end / 60); hh++) {
      gutter.appendChild(
        h("div", {
          class: "hourlabel",
          style: "top:" + ((hh * 60 - range.start) / 60) * HOUR + "px",
          text: E.fmtClock(hh * 60),
        })
      );
    }
    body.appendChild(gutter);

    /* day columns */
    var colsEl = h("div", {
      class: "cols",
      id: "cols",
      style: "grid-template-columns:" + cols + ";--grid-h:" + gridH + "px",
    });
    colsEl.appendChild(lines);
    var byDate = {};

    days.forEach(function (d) {
      var key = E.keyFromDayIndex(d);
      var win = clock.window(d);
      var dayIsOff = !!win && clock.isDayOff(d);
      var offList = timeOffOnDay(d);
      var col = h("div", {
        class: "col" + (win && !dayIsOff ? "" : " is-off") + (dayIsOff ? " is-dayoff" : ""),
        "data-date": key,
        "data-day": String(d),
        "data-off": win && !dayIsOff ? null : "1",
      });
      if (!win || dayIsOff) {
        col.appendChild(
          h("div", { class: "col-off-label" }, [
            h("span", {
              text: dayIsOff
                ? offList
                    .map(function (e) {
                      return e.name;
                    })
                    .join(" · ") || "Day off"
                : DOW_FULL[E.weekdayFromDayIndex(d)] + " off",
            }),
          ])
        );
      } else {
        /* shade the stretches this day does not work */
        if (win.start > range.start) {
          col.appendChild(
            h("div", {
              class: "col-dead",
              style: "top:0;height:" + ((win.start - range.start) / 60) * HOUR + "px",
            })
          );
        }
        if (win.end < range.end) {
          col.appendChild(
            h("div", {
              class: "col-dead",
              style:
                "top:" +
                ((win.end - range.start) / 60) * HOUR +
                "px;height:" +
                ((range.end - win.end) / 60) * HOUR +
                "px",
            })
          );
        }
        /* time off: a hole in the ruler, drawn so you can see why */
        clock.timeOffOf(d).forEach(function (off) {
          var ohgt = ((off.end - off.start) / 60) * HOUR;
          col.appendChild(
            h(
              "div",
              {
                class: "col-timeoff",
                style:
                  "top:" + ((off.start - range.start) / 60) * HOUR + "px;height:" + ohgt + "px",
                title:
                  off.name +
                  ", " +
                  E.fmtClock(off.start) +
                  " to " +
                  E.fmtClock(off.end) +
                  ". Not bookable.",
              },
              ohgt >= 20 ? h("span", { text: off.name }) : null
            )
          );
        });

        /* breaks: the same idea, on a weekly repeat */
        clock.breaksOf(d).forEach(function (br) {
          var hgt = ((br.end - br.start) / 60) * HOUR;
          col.appendChild(
            h(
              "div",
              {
                class: "col-break",
                style:
                  "top:" + ((br.start - range.start) / 60) * HOUR + "px;height:" + hgt + "px",
                title:
                  br.name + ", " + E.fmtClock(br.start) + " to " + E.fmtClock(br.end) + ". Not bookable.",
              },
              hgt >= 22 ? h("span", { text: br.name }) : null
            )
          );
        });
      }
      colsEl.appendChild(col);
      byDate[key] = col;
    });

    /* gather blocks per day, then lay overlapping ones out side by side */
    var perDay = {};
    visibleTasks().forEach(function (t) {
      var p = sched.placements[t.id];
      if (!p) return;
      p.blocks.forEach(function (b, i) {
        if (!byDate[b.dateKey]) return;
        if (!perDay[b.dateKey]) perDay[b.dateKey] = [];
        perDay[b.dateKey].push({ task: t, placement: p, block: b, index: i });
      });
    });
    /* How wide one column is, so a card can tell in advance whether the full
       status name and the full time range will actually fit inside it. */
    var colW = Math.max(40, (body.clientWidth - 62) / days.length);

    Object.keys(perDay).forEach(function (key) {
      var items = perDay[key];
      layoutLanes(items);
      items.forEach(function (it) {
        byDate[key].appendChild(blockEl(it, range, colW));
      });
    });

    /* now line */
    var now = new Date();
    var nowKey = todayKey();
    var nowMin = now.getHours() * 60 + now.getMinutes();
    if (byDate[nowKey] && nowMin >= range.start && nowMin <= range.end) {
      byDate[nowKey].appendChild(
        h("div", {
          class: "nowline",
          style: "top:" + ((nowMin - range.start) / 60) * HOUR + "px",
          title: "Now",
        })
      );
    }

    body.appendChild(colsEl);
  }

  /**
   * Two people can legitimately hold the same hour, so overlapping blocks are
   * placed in side-by-side lanes rather than on top of one another.
   */
  function layoutLanes(items) {
    items.sort(function (a, b) {
      if (a.block.startMin !== b.block.startMin) return a.block.startMin - b.block.startMin;
      return a.block.endMin - b.block.endMin;
    });
    var cluster = [];
    var clusterEnd = -1;
    var clusters = [];
    items.forEach(function (it) {
      if (cluster.length && it.block.startMin >= clusterEnd) {
        clusters.push(cluster);
        cluster = [];
        clusterEnd = -1;
      }
      cluster.push(it);
      clusterEnd = Math.max(clusterEnd, it.block.endMin);
    });
    if (cluster.length) clusters.push(cluster);

    clusters.forEach(function (cl) {
      var laneEnds = [];
      cl.forEach(function (it) {
        var lane = 0;
        while (lane < laneEnds.length && laneEnds[lane] > it.block.startMin) lane++;
        laneEnds[lane] = it.block.endMin;
        it.lane = lane;
      });
      cl.forEach(function (it) {
        it.lanes = laneEnds.length;
      });
    });
  }

  function blockEl(item, range, colW) {
    var t = item.task;
    var placement = item.placement;
    var b = item.block;
    var index = item.index;
    var p = projectById(t.projectId);
    var top = ((b.startMin - range.start) / 60) * HOUR;
    var height = Math.max(15, (b.minutes / 60) * HOUR - 2);
    var multi = placement.blocks.length > 1;
    var last = index === placement.blocks.length - 1;
    var late = isLate(t);
    var lanes = item.lanes || 1;
    var lane = item.lane || 0;

    var geom =
      "top:" +
      top +
      "px;height:" +
      height +
      "px;left:calc(3px + (100% - 7px) * " +
      lane +
      " / " +
      lanes +
      ");width:calc((100% - 7px) / " +
      lanes +
      " - 2px)";

    var meta = E.fmtClock(b.startMin) + " to " + E.fmtClock(b.endMin);
    var assigned = taskAssigneeIds(t);
    var showWho = !!assigned.length && !state.ui.personFilter;

    /**
     * A card is read in one fixed order, whatever its size: who it belongs
     * to and what state it is in on the top row, then the work, then the
     * hours it takes, always last. The tiers below only decide how many of
     * those get a row of their own; the order never changes, so the times
     * sit along the bottom edge of every card in a column and can be read
     * down as a single list.
     *
     *   3  who + status / name / part and total / time
     *   2  who + status / name / time
     *   1  the same three rows, set tighter
     *   0  everything on one row, for a fifteen minute sliver
     */
    var tier = height >= 68 ? 3 : height >= 54 ? 2 : height >= 42 ? 1 : 0;

    /* The width the card will actually get, so the full status name and the
       full time range are only used when there is room to print them. A
       narrow card gets a status dot and the start time instead, and the full
       words stay on the card's tooltip. */
    var cardW = (colW || 300) / lanes - 9;
    var dotOnly = tier === 0 || cardW < 96;
    var timeText = tier === 0 || meta.length * 5.9 + 6 > cardW ? E.fmtClock(b.startMin) : meta;

    var topRow = h("div", { class: "block-top" }, [
      showWho
        ? h("span", {
            class: "namebadge",
            title: assigneeLabel(t),
            text: assigned.map(function (id) { return initials(personById(id).name); }).join("+")
          })
        : null,
      t.locked ? h("span", { class: "lock-mark", text: "🔒", title: "Locked" }) : null,
      h("span", {
        class: "spill is-" + t.status + (dotOnly ? " is-dot" : ""),
        text: dotOnly ? "" : STATUS[t.status].pill,
        title: STATUS[t.status].label,
        "aria-label": STATUS[t.status].label,
      }),
    ]);

    var titleEl = h("div", { class: "block-title", text: t.name });
    var timeEl = h("div", { class: "block-time", text: timeText, title: meta });

    var kids = [topRow];
    if (tier === 0) {
      kids.push(titleEl, timeEl);
    } else {
      kids.push(titleEl);
      if (tier === 3) {
        kids.push(
          h("div", {
            class: "block-meta",
            text: multi
              ? "Part " +
                (index + 1) +
                " of " +
                placement.blocks.length +
                "  ·  " +
                E.fmtDuration(placement.dur) +
                " total"
              : E.fmtDuration(placement.dur),
          })
        );
      }
      kids.push(timeEl);
    }

    var el = h(
      "div",
      {
        class:
          "block" +
          (t.status === "done" ? " is-done" : "") +
          (t.status === "doing" ? " is-doing" : "") +
          (t.status === "delayed" ? " is-delayed" : "") +
          (t.locked ? " is-locked" : "") +
          (state.ui.selectedId === t.id ? " is-selected" : "") +
          (late ? " is-late" : "") +
          (index > 0 ? " is-cont" : "") +
          (!last ? " is-split-open" : "") +
          (tier === 0 ? " is-short" : "") +
          (tier === 1 ? " is-compact" : "") +
          (height >= 96 ? " is-tall" : "") +
          (lanes > 1 ? " is-laned" : ""),
        style: projVars(p) + ";" + geom,
        "data-id": t.id,
        "data-drag": t.status === "done" || t.locked ? "select" : "move",
        "data-part": String(index),
        tabindex: "0",
        onkeydown: function (ev) {
          if (ev.key === "Enter") {
            ev.preventDefault();
            openTask(t.id, {});
          }
        },
      },
      kids
    );
    attachHoverTip(el, [
      ["Project", p.name],
      ["Team Member", assigneeLabel(t)],
      ["Task Name", t.name],
      ["Task Duration", E.fmtDuration(placement.dur) + " (" + meta + ")"],
      ["Task Status", STATUS[t.status].label],
    ]);
    if (last && t.status !== "done" && !t.locked) {
      el.appendChild(h("div", { class: "rz", "data-drag": "resize", "data-id": t.id }));
    }
    return el;
  }

  /* --------------------------------------------------------- render: month */

  function renderMonth(head, body) {
    var info = monthDays();
    var days = info.days;
    var today = todayKey();
    var mclock = viewClock();

    var headRow = h("div", { class: "month-head" });
    [1, 2, 3, 4, 5, 6, 0].forEach(function (wd) {
      headRow.appendChild(h("div", { class: "month-dow", text: DOW[wd] }));
    });
    head.appendChild(headRow);

    var weeks = Math.ceil(days.length / 7);
    var grid = h("div", {
      class: "month-grid",
      style: "grid-template-rows:repeat(" + weeks + ", minmax(96px, 1fr))",
    });

    days.forEach(function (d) {
      var key = E.keyFromDayIndex(d);
      var win = mclock.window(d);
      var cap = mclock.capacityOf(d) * lanesOnDay(d);
      var used = bookedMinutes(d);
      var mo = E.monthOfDayIndex(d);
      var outside = mo.m !== info.month.m;
      var dayIsOff = !!win && mclock.isDayOff(d);
      var offList = timeOffOnDay(d);

      var cell = h("div", {
        class:
          "month-cell" +
          (win && !dayIsOff ? "" : " is-off") +
          (dayIsOff ? " is-dayoff" : "") +
          (outside ? " is-outside" : "") +
          (key === today ? " is-today" : ""),
        "data-date": key,
        "data-day": String(d),
        "data-off": win && !dayIsOff ? null : "1",
        "data-month": "1",
      });

      cell.appendChild(
        h("div", { class: "month-cell-top" }, [
          h("button", {
            class: "month-num",
            text: String(+key.split("-")[2]),
            title: "Open " + key,
            onclick: function (ev) {
              ev.stopPropagation();
              state.ui.anchor = key;
              state.ui.view = "day";
              save();
              render();
            },
          }),
          h("span", {
            class: "month-load" + (dayIsOff ? " is-off" : ""),
            text: !win
              ? "off"
              : dayIsOff
              ? offList
                  .map(function (e) {
                    return e.name;
                  })
                  .join(", ") || "off"
              : used
              ? E.fmtDuration(used)
              : "",
          }),
        ])
      );

      /* only draw the load bar on days that actually hold work, so empty days
         do not read as ruled lines */
      if (win && !dayIsOff && cap && used) {
        cell.appendChild(
          h(
            "div",
            { class: "month-bar" + (used >= cap ? " is-full" : "") },
            h("i", { style: "width:" + Math.min(100, (used / cap) * 100) + "%" })
          )
        );
      }

      /* one pill per task on this day, in start order */
      var rows = [];
      visibleTasks().forEach(function (t) {
        var pl = sched.placements[t.id];
        if (!pl) return;
        var mins = 0;
        var first = null;
        pl.blocks.forEach(function (b) {
          if (b.dateKey !== key) return;
          mins += b.minutes;
          if (first === null) first = b.startMin;
        });
        if (!mins) return;
        rows.push({ task: t, startMin: first, mins: mins });
      });
      rows.sort(function (a, b) {
        return a.startMin - b.startMin;
      });

      var listEl = h("div", { class: "month-pills" });
      rows.slice(0, 4).forEach(function (r) {
        var p = projectById(r.task.projectId);
        listEl.appendChild(
          h(
            "div",
            {
              class:
                "pill" +
                (r.task.status === "done" ? " is-done" : "") +
                (r.task.status === "delayed" ? " is-delayed" : "") +
                (r.task.locked ? " is-locked" : "") +
                (state.ui.selectedId === r.task.id ? " is-selected" : ""),
              style: projVars(p),
              "data-id": r.task.id,
              "data-drag": r.task.status === "done" || r.task.locked ? "select" : "move",
              "data-part": "0",
              title:
                r.task.name +
                "  ·  " +
                E.fmtClock(r.startMin) +
                "  ·  " +
                E.fmtDuration(r.mins) +
                " on this day",
            },
            [
              r.task.locked ? h("span", { class: "lock-mark", text: "🔒", title: "Locked" }) : null,
              h("span", { class: "pill-time", text: E.fmtClock(r.startMin) }),
              h("span", { class: "pill-name", text: r.task.name }),
            ]
          )
        );
      });
      if (rows.length > 4) {
        listEl.appendChild(
          h("button", {
            class: "month-more",
            text: "+" + (rows.length - 4) + " more",
            onclick: function (ev) {
              ev.stopPropagation();
              state.ui.anchor = key;
              state.ui.view = "day";
              save();
              render();
            },
          })
        );
      }
      cell.appendChild(listEl);
      grid.appendChild(cell);
    });

    body.appendChild(grid);
  }

  /* ------------------------------------------------------- render: details */

  /**
   * The details pane is editable field by field. Nothing changes on a stray
   * click: you open a field with Edit, change it, then Save. Cancel or Escape
   * backs out. `detailEdit` holds the one field currently open.
   */
  var detailEdit = null;

  function renderDetails() {
    var shell = $("#shell");
    var det = $("#details");
    var t = state.ui.selectedId ? taskById(state.ui.selectedId) : null;
    if (!t) {
      shell.classList.remove("has-details");
      det.textContent = "";
      return;
    }
    shell.classList.add("has-details");
    det.textContent = "";

    var p = projectById(t.projectId);
    var pl = sched.placements[t.id];
    var late = isLate(t);
    var slot = currentSlot(t);

    /* ---- title, editable in place */
    if (detailEdit === "name") {
      var nameIn = h("input", { type: "text", value: t.name });
      det.appendChild(
        h("div", { class: "field", style: "margin-bottom:10px" }, [
          h("label", { text: "Task Name" }),
          nameIn,
          fieldButtons(function () {
            var v = nameIn.value.trim();
            if (!v) {
              nameIn.focus();
              toast("A task needs a name");
              return;
            }
            var wasName = t.name;
            t.name = v;
            if (wasName !== v) logTaskActivity(t, "Name changed from “" + wasName + "” to “" + v + "”");
            closeField("Name saved", "Task Renamed|" + wasName + " to " + v);
          }),
        ])
      );
      setTimeout(function () {
        nameIn.focus();
        nameIn.select();
      }, 0);
    } else {
      det.appendChild(
        h("div", { class: "det-head" }, [
          h("div", { class: "det-title", text: t.name }),
          h("button", {
            class: "btn is-quiet is-icon",
            text: "✎",
            title: "Edit the task name",
            "aria-label": "Edit the task name",
            onclick: function () {
              openField("name");
            },
          }),
          h("button", {
            class: "btn is-quiet is-icon",
            text: "✕",
            title: "Close",
            "aria-label": "Close details",
            onclick: function () {
              state.ui.selectedId = null;
              detailEdit = null;
              save();
              render();
            },
          }),
        ])
      );
    }

    det.appendChild(
      h("div", { class: "tagrow" }, [
        h("span", { class: "tag is-proj", style: projVars(p), text: p.name }),
        h("span", {
          class: "tag",
          text: assigneeLabel(t),
        }),
        t.locked ? h("span", { class: "tag", text: "🔒 Locked" }) : null,
        late ? h("span", { class: "tag is-late", text: "Past deadline" }) : null,
        !t.startDate ? h("span", { class: "tag", text: "Unscheduled" }) : null,
        pl && pl.w !== null && slotDiffers(t, pl)
          ? h("span", {
              class: "tag is-moved",
              text: "Moved by the scheduler",
              title:
                "You put this at " +
                E.fmtClock(t.startMin) +
                " on " +
                t.startDate +
                ". Something is in the way, so it currently sits at " +
                E.fmtClock(pl.startMin) +
                " on " +
                pl.startDate +
                ". Remove the obstacle and it returns.",
            })
          : null,
      ])
    );

    /* ---- status, always live
       Every other field here opens with Edit and closes with Save, because
       every other field can be typed wrong halfway through. A status cannot:
       there are four of them and you either mean one or you do not. So it
       has no Edit and no Save. One click sets it, and the change is recorded
       in the history like any other. */
    det.appendChild(
      h("div", { class: "field", style: "margin-top:12px" }, [
        h("label", { text: "Status" }),
        h(

                detailEdit = null;

    function openField(key) {

  function dependencyLevels(taskId, upstream) {
    var seen = {};
    seen[taskId] = true;
    var frontier = [taskId];
    var levels = [];
    while (frontier.length && levels.length <= state.tasks.length) {
      var next = [];
      frontier.forEach(function (id) {
        var neighbors;
        if (upstream) {
          var task = taskById(id);
          neighbors = task ? task.dependsOn || [] : [];
        } else {
          neighbors = state.tasks
            .filter(function (task) { return (task.dependsOn || []).indexOf(id) !== -1; })
            .map(function (task) { return task.id; });
        }
        neighbors.forEach(function (neighborId) {
          if (!seen[neighborId] && taskById(neighborId)) {
            seen[neighborId] = true;
            next.push(neighborId);
          }
        });
      });
      if (!next.length) break;
      next = next.filter(function (id, i, list) { return list.indexOf(id) === i; });
      next.sort(function (a, b) { return byName(taskById(a), taskById(b)); });
      levels.push(next);
      frontier = next;
    }
    return levels;
  }

  function dependencyChainSection(task, onEdit) {
    var previous = dependencyLevels(task.id, true).reverse();
    var future = dependencyLevels(task.id, false);
    var wrap = h("div", { class: "dependency-chain" });
    wrap.appendChild(h("div", { class: "detail-section-head" }, [
      h("b", { text: "Dependency Chain" }),
      h("button", { class: "btn is-quiet", text: "Edit", onclick: onEdit }),
    ]));
    var flow = h("div", { class: "chain-flow" });
    function taskButton(id, current) {
      var related = taskById(id);
      return h("button", {
        class: "chain-task" + (current ? " is-current" : ""),
        text: related ? related.name : "Missing task",
        disabled: current ? true : null,
        onclick: current ? null : function () {
          state.ui.selectedId = id;
          detailEdit = null;
          noteEdit = null;
          save();
          render();
        },
      });
    }
    function chainRow(label, levels, current) {
      var track = h("div", { class: "chain-track" });
      if (current) track.appendChild(h("span", { class: "chain-levels" }, [taskButton(task.id, true)]));
      else if (!levels.length) track.appendChild(h("span", { class: "muted", text: "None" }));
      else levels.forEach(function (level) {
        track.appendChild(h("span", { class: "chain-levels" }, level.map(function (id) { return taskButton(id, false); })));
      });
      return h("div", { class: "chain-group" }, [h("span", { class: "chain-label", text: label }), track]);
    }
    flow.appendChild(chainRow("Previous", previous, false));
    flow.appendChild(chainRow("Current", [], true));
    flow.appendChild(chainRow("Future", future, false));
    wrap.appendChild(flow);
    return wrap;
  }

  function taskActivitySection(task) {
    var entries = normalizeTaskActivity(task.activity, task.createdAt);
    task.activity = entries;
    var list = h("div", { class: "activity-list" });
    entries.forEach(function (entry) {
      var d = new Date(entry.at);
      var date = d.getFullYear() + "-" + E.pad2(d.getMonth() + 1) + "-" + E.pad2(d.getDate());
      list.appendChild(h("div", { class: "activity-row" }, [
        h("span", { class: "activity-date", text: date }),
        h("span", { class: "activity-time", text: E.fmtClock(d.getHours() * 60 + d.getMinutes()) }),
        h("span", { class: "activity-action", text: entry.action }),
      ]));
    });
    return h("div", { class: "task-activity" }, [
      h("div", { class: "detail-section-head" }, [h("b", { text: "Activity Log" })]),
      h("div", { class: "activity-head" }, [h("span", { text: "Date" }), h("span", { text: "Time" }), h("span", { text: "Action" })]),
      list,
    ]);
  }

  function toggleTaskLock(id) {
    var task = taskById(id);
    if (!task || !task.startDate) return;
    var wasLocked = !!task.locked;
    var currentPlacement = sched && sched.placements[task.id]
      ? JSON.parse(JSON.stringify(sched.placements[task.id]))
      : null;
    acceptCurrent(task);
    task.locked = !wasLocked;
    task.lockedPlacement = task.locked ? currentPlacement : null;
    logTaskActivity(task, task.locked ? "Locked scheduled date and time" : "Unlocked scheduled date and time");
    commit(null, task.locked ? "Task locked" : "Task unlocked", (task.locked ? "Task Locked|" : "Task Unlocked|") + task.name);
  }

  /** True when the scheduler has had to put a task somewhere other than where
   *  it was asked to go. */
  function slotDiffers(t, pl) {
    if (!t.startDate || !pl) return false;
    return t.startDate !== pl.startDate || t.startMin !== pl.startMin;
  }

  /** Always confirmed: a deleted task cannot be recovered. */
  /* ------------------------------------------------------- notes section */

  function notesSection(t) {
    var notes = Array.isArray(t.notes) ? t.notes : [];
    var wrap = h("div", { class: "field", style: "margin-top:14px" });
    var head = h("div", { class: "field-head" }, [
      h("label", { text: "Notes" }),
      notes.length ? h("span", { class: "sec-count", text: String(notes.length) }) : null,
    ]);
    if (noteEdit !== "new") {
      head.appendChild(
        h("button", {
          class: "btn is-quiet",
          text: "+ Add Note",
          onclick: function () {
            noteEdit = "new";
            renderDetails();
          },
        })
      );
    }
    wrap.appendChild(head);

    if (noteEdit === "new") {
      wrap.appendChild(
        noteEditor("", function (html) {
          if (!noteIsEmpty(html)) {
            t.notes = [{ id: uid("n"), html: sanitizeNote(html), at: Date.now() }].concat(notes);
            logTaskActivity(t, "Note added");
            record("Note Added", t.name);
          }
          noteEdit = null;
          save();
          render();
        })
      );

    if (!notes.length && noteEdit !== "new") {
      wrap.appendChild(
        h("div", {
          class: "empty",

        })
      );
    }

    notes.forEach(function (note) {
      if (noteEdit === note.id) {
        wrap.appendChild(
          noteEditor(note.html, function (html) {
            if (noteIsEmpty(html)) {
              t.notes = notes.filter(function (n) {
                return n.id !== note.id;
              });
              logTaskActivity(t, "Note deleted");
              record("Note Deleted", t.name + ", emptied while editing");
            } else {
              note.html = sanitizeNote(html);
              logTaskActivity(t, "Note changed");
              record("Note Edited", t.name);
            }
            noteEdit = null;
            save();
            render();
          })
        );
        return;
      }
      var body = h("div", { class: "note-body" });
      body.innerHTML = sanitizeNote(note.html);
      wrap.appendChild(
        h("div", { class: "note" }, [
          h("div", { class: "note-top" }, [
            h("span", { class: "note-stamp", text: noteStamp(note.at) }),
            h("button", {
              class: "btn is-quiet",
              text: "Edit",
              onclick: function () {
                noteEdit = note.id;
                renderDetails();
              },
            }),
            h("button", {
              class: "btn is-quiet",
              text: "Delete",
              title: "Delete this note",
              onclick: function () {
                confirmAction({
                  title: "Delete This Note?",
                  body: "Delete the note from " + noteStamp(note.at) + "?",
                  detail:
                    "The task itself is not affected, and the Change History keeps a version from just before this.",
                  confirmLabel: "Delete Note",
                  onConfirm: function () {
                    t.notes = notes.filter(function (n) {
                      return n.id !== note.id;
                    });
                    logTaskActivity(t, "Note deleted");
                    noteEdit = null;
                    record("Note Deleted", t.name + ", written " + noteStamp(note.at));
                    save();
                    render();
                  },
                });
              },
            }),
          ]),
          body,
        ])
      );
    });

    return wrap;
  }

  /**
   * A small rich-text box. Bold, italic, bullets and, the point of the whole
   * thing, selecting some words and turning just those words into a link.
   *
   * The link bar keeps its own copy of the selection, because focusing the URL
   * field destroys the document selection that execCommand needs.
   */
  function noteEditor(initialHtml, onSave) {
    var box = h("div", { class: "note-editor" });
    var area = h("div", {
      class: "note-input",
      contenteditable: "true",
      spellcheck: "true",
      role: "textbox",
      "aria-multiline": "true",
      "aria-label": "Note text",
    });
    area.innerHTML = sanitizeNote(initialHtml);

    /* The selection has to be kept by hand. Focusing the URL field destroys the
       document selection that execCommand needs, so we stash a copy of the
       range and put it back before running a command. `restoring` guards
       against the put-back itself being recorded: focusing the editable places
       a collapsed caret first, and recording that would throw away the very
       selection we are trying to link. */
    var savedRange = null;
    var restoring = false;

    function remember() {
      if (restoring) return;
      var sel = window.getSelection();
      if (sel && sel.rangeCount && area.contains(sel.getRangeAt(0).commonAncestorContainer)) {
        savedRange = sel.getRangeAt(0).cloneRange();
      }
    }

    function focusAndRestore() {
      restoring = true;
      area.focus();
      var ok = false;
      if (savedRange) {
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(savedRange);
        ok = true;
      }
      restoring = false;
      return ok;
    }

    area.addEventListener("keyup", remember);
    area.addEventListener("mouseup", remember);

    /* every anchor the browser creates needs the safe attributes back */
    function decorateLinks() {
      Array.prototype.forEach.call(area.querySelectorAll("a"), function (a) {
        var href = safeUrl(a.getAttribute("href"));
        if (!href) {
          var parent = a.parentNode;
          while (a.firstChild) parent.insertBefore(a.firstChild, a);
          parent.removeChild(a);
          return;
        }
        a.setAttribute("href", href);
        a.setAttribute("target", "_blank");
        a.setAttribute("rel", "noopener noreferrer");
      });
    }

    /* Paste and drop are the two ways a browser will put arbitrary HTML into a
       contenteditable. Both are intercepted and reduced to plain text, so
       nothing rich, and nothing executable, ever enters the box. Sanitising on
       save is the second line of defence, not the first: an <img onerror> in
       inserted markup would fire the moment it landed. */
    function takeText(ev, raw) {
      ev.preventDefault();
      var text = String(raw == null ? "" : raw);
      var url = safeUrl(text);
      var sel = window.getSelection();
      if (url && sel && sel.rangeCount && !sel.isCollapsed && area.contains(sel.anchorNode)) {
        document.execCommand("createLink", false, url);
      } else {
        document.execCommand("insertText", false, text);
      }
      decorateLinks();
      remember();
    }

    area.addEventListener("paste", function (ev) {
      var dt = ev.clipboardData || window.clipboardData;
      takeText(ev, dt ? dt.getData("text/plain") : "");
    });
    area.addEventListener("dragover", function (ev) {
      ev.preventDefault();
    });
    area.addEventListener("drop", function (ev) {
      var dt = ev.dataTransfer;
      takeText(ev, dt ? dt.getData("text/plain") || dt.getData("text/uri-list") : "");
    });

    var urlIn = h("input", {
      type: "text",
      class: "note-url",
      placeholder: "www.example.com",
      spellcheck: "false",
    });
    var linkBar = h("div", { class: "note-linkbar", hidden: true }, [
      urlIn,
      h("button", { class: "btn is-primary", type: "button", text: "Apply", onclick: applyLink }),
      h("button", {
        class: "btn",
        type: "button",
        text: "Cancel",
        onclick: function () {
          linkBar.hidden = true;
        },
      }),
    ]);

    function selectedText() {
      return savedRange ? String(savedRange.toString()) : "";
    }

    function openLinkBar() {
      remember();
      if (!savedRange) {
        toast("Put the cursor in the note first, or select the words you want to link.");
        return;
      }
      var sel = selectedText();
      linkBar.hidden = false;
      urlIn.value = "";
      urlIn.placeholder = sel
        ? "Link " + (sel.length > 24 ? sel.slice(0, 24) + "…" : sel) + " to…"
        : "www.example.com";
      urlIn.focus();
    }

    function applyLink() {
      var url = safeUrl(urlIn.value);
      if (!url) {
        urlIn.focus();
        toast("That does not look like a web address. Try www.example.com.");
        return;
      }
      if (!focusAndRestore()) return;
      var sel = window.getSelection();
      if (sel.isCollapsed) {
        /* nothing selected: drop the address in as its own link */
        var a = document.createElement("a");
        a.setAttribute("href", url);
        a.setAttribute("target", "_blank");
        a.setAttribute("rel", "noopener noreferrer");
        a.textContent = urlIn.value.trim();
        var r = sel.getRangeAt(0);
        r.insertNode(a);
        r.setStartAfter(a);
        r.collapse(true);
        sel.removeAllRanges();
        sel.addRange(r);
      } else {
        /* the point of the whole feature: wrap just the selected words */
        document.execCommand("createLink", false, url);
      }
      decorateLinks();
      linkBar.hidden = true;
      remember();
    }

    function cmd(name) {
      return function () {
        focusAndRestore();
        document.execCommand(name, false, null);
        decorateLinks();
        remember();
      };
    }

    var tools = h("div", { class: "note-tools" }, [
      h("button", { class: "note-btn", type: "button", title: "Bold", onmousedown: swallow, onclick: cmd("bold") }, h("b", { text: "B" })),
      h("button", { class: "note-btn is-em", type: "button", title: "Italic", onmousedown: swallow, onclick: cmd("italic") }, h("i", { text: "I" })),
      h("button", { class: "note-btn", type: "button", title: "Bulleted list", onmousedown: swallow, onclick: cmd("insertUnorderedList"), text: "•—" }),
      h("span", { class: "note-tools-gap" }),
      h("button", { class: "note-btn is-wide", type: "button", title: "Link the selected words", onmousedown: swallow, onclick: openLinkBar, text: "Link" }),
      h("button", { class: "note-btn is-wide", type: "button", title: "Remove the link", onmousedown: swallow, onclick: cmd("unlink"), text: "Unlink" }),
    ]);

    function swallow(ev) {
      /* keep the selection alive: a mousedown on a button would clear it */
      ev.preventDefault();
    }

    box.appendChild(tools);
    box.appendChild(linkBar);
    box.appendChild(area);
    box.appendChild(
      h("div", { class: "note-foot" }, [
        h("span", { class: "hint", text: "Select any words, then Link." }),
        h("button", {
          class: "btn",
          text: "Cancel",
          onclick: function () {
            noteEdit = null;
            renderDetails();
          },
        }),
        h("button", {
          class: "btn is-primary",
          text: "Save Note",
          onclick: function () {
            decorateLinks();
            onSave(area.innerHTML);
          },
        }),
      ])
    );

    setTimeout(function () {
      area.focus();
      var sel = window.getSelection();
      var r = document.createRange();
      r.selectNodeContents(area);
      r.collapse(false);
      sel.removeAllRanges();
      sel.addRange(r);
      remember();
    }, 0);

    return box;
  }

  function deleteTask(id, afterClose) {
    var t = taskById(id);
    if (!t) return;
    var dependents = state.tasks.filter(function (x) {
      return (x.dependsOn || []).indexOf(id) !== -1;
    });
    confirmAction({
      title: "Delete This Task?",
      body: "Delete " + t.name + "?",
      detail:
        "The Change History keeps a version from just before this, so it can be brought back from there. " +
        (dependents.length
          ? "It is a prerequisite for " + dependents.length + (dependents.length === 1 ? " task; that dependency will be removed." : " tasks; those dependencies will be removed.")
          : "To take it off the calendar without deleting it, use On Hold or Unschedule instead."),
      confirmLabel: "Delete Task",
      onConfirm: function () {
        state.tasks = state.tasks.filter(function (x) {
          return x.id !== id;
        });
        state.tasks.forEach(function (x) {
          if ((x.dependsOn || []).indexOf(id) !== -1) {
            x.dependsOn = x.dependsOn.filter(function (parentId) { return parentId !== id; });
            logTaskActivity(x, "Dependency “" + t.name + "” removed because that task was deleted");
          }
        });
        if (state.ui.selectedId === id) state.ui.selectedId = null;
        if (afterClose) closeModal();
        commit(null, "Deleted " + t.name, "Task Deleted|" + t.name);
      },
    });
  }

  /* --------------------------------------------------------------- modals */

  function closeModal() {
    $("#modalRoot").textContent = "";
    openModalName = null;
  }

  function modal(name, title, bodyEl, footKids, wide, noAutoFocus) {
    openModalName = name;
    var root = $("#modalRoot");
    root.textContent = "";
    var box = h("div", { class: "modal" + (wide ? " is-wide" : "") }, [
      h("div", { class: "modal-head" }, [
        h("h2", { text: title }),
        h("button", {
          class: "btn is-quiet is-icon",
          text: "✕",
          "aria-label": "Close",
          onclick: closeModal,
        }),
      ]),
      h("div", { class: "modal-body" }, bodyEl),
      footKids ? h("div", { class: "modal-foot" }, footKids) : null,
    ]);
    var scrim = h("div", {
      class: "scrim",
      onclick: function (ev) {
        if (ev.target === scrim) closeModal();
      },
    });
    scrim.appendChild(box);
    root.appendChild(scrim);
    if (!noAutoFocus) {
      var first = box.querySelector("input,select,textarea");
      if (first) first.focus();
    }
    return box;
  }

  /* A checkbox grid standing in for a <select multiple>: same set of ids in,
     same set of ids out, but every option is visible at once instead of
     needing a scrollable listbox and Ctrl/Cmd-click. */
  function peopleCheckPicker(selectedIds) {
    var boxes = [];
    var wrap = h("div", { class: "people-checks" });
    sortedPeople().forEach(function (pp) {
      var cb = h("input", { type: "checkbox", value: pp.id, checked: selectedIds.indexOf(pp.id) !== -1 });
      boxes.push({ id: pp.id, cb: cb });
      wrap.appendChild(h("label", { class: "people-check" }, [cb, h("span", { text: pp.name })]));
    });
    wrap.selectedIds = function () {
      return boxes.filter(function (b) { return b.cb.checked; }).map(function (b) { return b.id; });
    };
    wrap.focusFirst = function () {
      if (boxes[0]) boxes[0].cb.focus();
    };
    return wrap;
  }

  function fieldRow(label, input, hint, required) {
    return h("div", { class: "field" }, [
      h("label", {}, [label, required ? h("span", { class: "reqmark", text: "Required" }) : null]),
      input,
      hint ? h("div", { class: "hint", text: hint }) : null,
    ]);
  }

  function timeValue(min) {
    return E.pad2(Math.floor(min / 60)) + ":" + E.pad2(min % 60);
  }
  function parseTimeValue(v, fallback) {
    var p = String(v || "").split(":");
    if (p.length < 2) return fallback;
    var m = +p[0] * 60 + +p[1];
    return isFinite(m) ? m : fallback;
  }

  /* task editor */
  function openTask(id, prefill) {
    var t = id ? taskById(id) : null;
    var isNew = !t;
    /* prefill from where the task actually sits, not from a stale intent */
    if (t) {
      var live = currentSlot(t);
      t = JSON.parse(JSON.stringify(t));
      t.startDate = live.startDate;
      t.startMin = live.startMin;
    }
    /**
     * A new task has to name the work, the project, the person and how long
     * it takes. Those four are what make a task schedulable at all: without
     * a person there is no timeline to put it on, and without a duration
     * there is nothing to place. So a new task starts with all four empty
     * and refuses to be created until they are filled.
     *
     * An existing task that arrived unassigned, from imported data, keeps
     * Unassigned in its list so it stays editable. Nothing can be moved TO
     * Unassigned though, which is the rule the same way round.
     */
    var draft = t
      ? t
      : {
          name: "",
          projectId: state.ui.projectFilter || "",
          assigneeIds: state.ui.personFilter ? [state.ui.personFilter] : [],
          durationMin: null,
          deadline: null,
          status: "todo",
          dependsOn: [],
          startDate: prefill.startDate || null,
          startMin: prefill.startMin == null ? null : prefill.startMin,
        };
    if (!Array.isArray(draft.assigneeIds)) draft.assigneeIds = draft.assigneeId ? [draft.assigneeId] : [];
    var allowNobody = !isNew && !draft.assigneeIds.length;

    var nameIn = h("input", { type: "text", value: draft.name, placeholder: "What is the work?" });
    var projIn = h(
      "select",
      {},
      (draft.projectId ? [] : [h("option", { value: "", text: "Choose a project", selected: true })]).concat(
        sortedProjects().map(function (p) {
          return h("option", { value: p.id, text: p.name, selected: p.id === draft.projectId });
        })
      )
    );
    var whoIn = peopleCheckPicker(draft.assigneeIds);
    var hIn = h("input", {
      type: "number",
      min: "0",
      max: "80",
      step: "1",
      placeholder: "0",
      value: draft.durationMin == null ? "" : String(Math.floor(draft.durationMin / 60)),
      disabled: draft.locked ? true : null,
    });
    var mIn = h("input", {
      type: "number",
      min: "0",
      max: "59",
      step: "5",
      placeholder: "0",
      value: draft.durationMin == null ? "" : String(draft.durationMin % 60),
      disabled: draft.locked ? true : null,
    });
    var presets = h(
      "div",
      { class: "dur-presets" },
      [30, 60, 120, 180, 240, 480, 720, 960].map(function (v) {
        return h("button", {
          type: "button",
          text: E.fmtDuration(v),
          disabled: draft.locked ? true : null,
          onclick: function () {
            hIn.value = String(Math.floor(v / 60));
            mIn.value = String(v % 60);
          },
        });
      })
    );
    var dateIn = h("input", { type: "date", value: draft.startDate || "", disabled: draft.locked ? true : null });
    var timeIn = h("input", {
      type: "time",
      step: "900",
      value: timeValue(draft.startMin == null ? gridRange().start : draft.startMin),
      disabled: draft.locked ? true : null,
    });
    var dlIn = h("input", { type: "date", value: draft.deadline || "" });
    var statusIn = h(
      "select",
      {},
      STATUS_ORDER.map(function (st) {
        return h("option", { value: st, text: STATUS[st].label, selected: draft.status === st });
      })
    );
    /* Completed work is rarely a useful new prerequisite, and an ever-growing
       list makes the relationship picker harder to use. Keep the active work
       (and any already chosen completed task) visible by default; older work
       is still available deliberately through the reveal control. */
    var dependencyIn = h("select", { multiple: true, size: "6", class: "dependency-picker" });
    var showCompletedIn = h("input", { type: "checkbox" });
    var dependencySelection = (draft.dependsOn || []).slice();
    function selectedDependencyIds() {
      return Array.prototype.map.call(dependencyIn.selectedOptions, function (option) {
        return option.value;
      });
    }
    function renderDependencyOptions() {
      var selected = dependencySelection;
      if (dependencyIn.options.length) selected = selectedDependencyIds();
      dependencySelection = selected;
      dependencyIn.textContent = "";
      state.tasks
        .filter(function (candidate) {
          return (
            candidate.id !== (id || "") &&
            (candidate.status !== "done" || showCompletedIn.checked || selected.indexOf(candidate.id) !== -1)
          );
        })
        .slice()
        .sort(byName)
        .forEach(function (candidate) {
          dependencyIn.appendChild(
            h("option", {
              value: candidate.id,
              text: candidate.name + (candidate.status === "done" ? " — Completed" : ""),
              selected: selected.indexOf(candidate.id) !== -1,
            })
          );
        });
    }
    showCompletedIn.addEventListener("change", renderDependencyOptions);
    renderDependencyOptions();
    var dependencyControl = h("div", {}, [
      dependencyIn,
      h(
        "label",
        { class: "hint", style: "display:flex;align-items:center;gap:6px;margin-top:7px;cursor:pointer" },
        [showCompletedIn, "Show completed tasks"]
      ),
    ]);

    var body = h("div", { class: "task-form-grid" }, [
      h("div", { class: "field span-3" }, [
        h("label", {}, ["Task Name", h("span", { class: "reqmark", text: "Required" })]),
        nameIn,
      ]),
      fieldRow("Project", projIn, null, true),
      h("div", { class: "field span-2" }, [
        h("label", {}, ["Assigned Team Members", h("span", { class: "reqmark", text: "Required" })]),
        whoIn,
        h("div", { class: "hint", text: "Check everyone this task should appear on" }),
      ]),
      h("div", { class: "field span-3" }, [
        h("label", {}, ["Duration", h("span", { class: "reqmark", text: "Required" })]),
        h("div", { class: "row2" }, [
          h("div", { style: "display:flex;gap:6px;align-items:center" }, [
            hIn,
            h("span", { class: "hint", text: "h" }),
            mIn,
            h("span", { class: "hint", text: "m" }),
          ]),
          presets,
        ]),
        h("div", {
          class: "hint",
          text: "Longer than a working day is fine. The scheduler splits it across days and around breaks.",
        }),
      ]),
      fieldRow("Start Date", dateIn, draft.locked ? "Unlock the task to change its fixed time" : "Leave empty to keep it unscheduled"),
      fieldRow("Start Time", timeIn, draft.locked ? "This scheduled time is locked" : null),
      fieldRow("Status", statusIn, "Uses the same colors throughout the dashboard"),
      fieldRow("Deadline", dlIn, "A passed deadline automatically marks unfinished work DELAYED"),
      h("div", { class: "field span-2" }, fieldRow(
          "Blocked by",
          dependencyControl,
          "Active tasks are shown first. This task moves after their planned finish; if one is ON HOLD, this chain is frozen."
        )),
    ]);

    var box = modal(
      "task",
      isNew ? "New Task" : "Edit Task",
      body,
      [
        !isNew
          ? h("button", {
              class: "btn is-danger",
              text: "Delete",
              onclick: function () {
                deleteTask(id, true);
              },
            })
          : null,
        h("div", { class: "grow" }),
        h("button", { class: "btn", text: "Cancel", onclick: closeModal }),
        h("button", {
          class: "btn is-primary",
          text: isNew ? "Create Task" : "Save",
          onclick: submit,
        }),
      ],
      true
    );

    box.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" && ev.target.tagName !== "TEXTAREA") {
        ev.preventDefault();
        submit();
      }
    });

    function submit() {
      var name = nameIn.value.trim();
      var mins = (+hIn.value || 0) * 60 + (+mIn.value || 0);
      if (!name) {
        nameIn.focus();
        toast("Give the task a name");
        return;
      }
      if (!projIn.value) {
        projIn.focus();
        toast("Choose a project for this task");
        return;
      }
      var selectedPeople = whoIn.selectedIds();
      if (!selectedPeople.length && !allowNobody) {
        whoIn.focusFirst();
        toast("Choose who this task is assigned to");
        return;
      }
      if (mins < 15) {
        hIn.focus();
        toast("Give the task a duration, 15 minutes or more");
        return;
      }
      var status = statusIn.value;
      var keepDate = !!dateIn.value;
      var dependsOn = Array.prototype.map.call(dependencyIn.selectedOptions, function (option) {
        return option.value;
      });
      if (wouldCreateDependencyCycle(id, dependsOn)) {
        toast("Dependencies cannot form a loop");
        dependencyIn.focus();
        return;
      }
      if (status === "doing") {
        var unfinished = unfinishedPrerequisiteNames(dependsOn);
        if (unfinished.length) {
          toast(
            "Cannot start this task until " +
              unfinished.join(", ") +
              (unfinished.length === 1 ? " is completed" : " are completed")
          );
          dependencyIn.focus();
          return;
        }
      }
      var target = {
        name: name,
        projectId: projIn.value,
        assigneeIds: selectedPeople,
        durationMin: Math.max(15, mins),
        deadline: dlIn.value || null,
        status: status,
        dependsOn: dependsOn,
        startDate: keepDate ? dateIn.value : null,
        startMin: keepDate ? parseTimeValue(timeIn.value, gridRange().start) : null,
      };
      if (isNew) {
        var fresh = { id: uid(), createdAt: Date.now(), sample: false, notes: [], locked: false, activity: [] };
        for (var k in target) fresh[k] = target[k];
        logTaskActivity(fresh, "Task created");
        state.tasks.push(fresh);
        state.ui.selectedId = fresh.id;
        closeModal();
        if (fresh.startDate) state.ui.anchor = fresh.startDate;
        commit(
          fresh.startDate ? fresh.id : null,
          fresh.startDate ? null : "Added to unscheduled",
          "Task Created|" +
            fresh.name +
            ", " +
            E.fmtDuration(fresh.durationMin) +
            ", " +
            (fresh.startDate
              ? shortDate(fresh.startDate) + " at " + E.fmtClock(fresh.startMin)
              : "unscheduled")
        );
      } else {
        var task = taskById(id);
        if (task.locked && (target.startDate !== task.startDate || target.startMin !== task.startMin || target.durationMin !== task.durationMin)) {
          toast("Unlock this task before changing its fixed time or duration");
          return;
        }
        logTaskEditorChanges(task, target);
        for (var k2 in target) task[k2] = target[k2];
        closeModal();
        commit(task.startDate ? task.id : null, "Saved", "Task Edited|" + task.name);
      }
    }
  }

  function logTaskEditorChanges(task, target) {
    if (task.name !== target.name) {
      logTaskActivity(task, "Name changed from “" + task.name + "” to “" + target.name + "”");
    }
    if (task.projectId !== target.projectId) {
      logTaskActivity(task, "Project changed from " + projectById(task.projectId).name + " to " + projectById(target.projectId).name);
    }
    if (!sameIds(taskAssigneeIds(task), target.assigneeIds)) {
      var beforePeople = assigneeLabel(task);
      var afterPeople = target.assigneeIds.length
        ? target.assigneeIds.map(function (id) { return personById(id).name; }).join(", ")
        : "Unassigned";
      logTaskActivity(task, "Assignment changed from " + beforePeople + " to " + afterPeople);
    }
    if (task.durationMin !== target.durationMin) {
      logTaskActivity(task, "Duration changed from " + E.fmtDuration(task.durationMin) + " to " + E.fmtDuration(target.durationMin));
    }
    if ((task.deadline || null) !== target.deadline) {
      logTaskActivity(task, "Deadline changed from " + (task.deadline || "none") + " to " + (target.deadline || "none"));
    }
    if (task.status !== target.status) {
      logTaskActivity(task, (target.status === "done" ? "Completed" : "Status changed") + " — " + STATUS[task.status].label + " to " + STATUS[target.status].label);
      task.autoDelayed = false;
      task.delayedFrom = null;
    }
    if (!sameIds(task.dependsOn || [], target.dependsOn || [])) {
      var beforeDeps = dependencyNames(task).join(", ") || "none";
      var afterDeps = (target.dependsOn || []).map(function (depId) {
        var dep = taskById(depId);
        return dep ? dep.name : depId;
      }).join(", ") || "none";
      logTaskActivity(task, "Dependencies changed from " + beforeDeps + " to " + afterDeps);
    }
    var current = currentSlot(task);
    if ((current.startDate || null) !== target.startDate || (current.startMin == null ? null : current.startMin) !== target.startMin) {
      var beforeSlot = current.startDate ? current.startDate + " " + E.fmtClock(current.startMin) : "unscheduled";
      var afterSlot = target.startDate ? target.startDate + " " + E.fmtClock(target.startMin) : "unscheduled";
      logTaskActivity(task, "Schedule changed from " + beforeSlot + " to " + afterSlot);
    }
  }

  /* ---------------------------------------------------------- project editor */

  function openProject(id) {
    var existing = null;
    for (var i = 0; i < state.projects.length; i++) {

    }
    var draft = { color: existing ? existing.color : nextColor(state.projects) };

      h("span", { class: "swatch-preview-stripe" }),

        h("div", { class: "swatch-preview-title", text: "Sample task block" }),

      type: "text",

    var sw = h(
      "div",
      { class: "swatches" },
      [1, 2, 3, 4, 5, 6, 7, 8].map(function (n) {
        return h("button", {
          class: "swatch",
          type: "button",
          style: "--pc:var(--p" + n + ")",
          "aria-label": "Palette colour " + n,
          onclick: function () {
            draft.color = n;
            hexIn.value = "";
            paint();
          },
        });
      })
    );

    function paint() {
      sample.setAttribute("style", colorVars(draft.color));
      Array.prototype.forEach.call(sw.children, function (c, k) {
        c.setAttribute("aria-pressed", draft.color === k + 1 ? "true" : "false");
      });

    function takeHex(v) {

    hexIn.addEventListener("input", function () {

    var count = id

    var body = h("div", {}, [
      fieldRow("Project Name", nameIn),

        h("label", { text: "Colour on the Calendar" }),

        h("div", { class: "hexrow" }, [
          picker,
          hexIn,
          h("span", { class: "hint", text: "or paste a hex code" }),
        ]),
        sample,
        warn,
      ]),
      id && count
        ? h("div", {
            class: "hint",
            text:
              count +
              (count === 1 ? " task belongs" : " tasks belong") +
              " to this project. It cannot be deleted while any of them are Yet to Start, In Progress or On Hold.",
          })
        : null,

    modal("project", id ? "Edit Project" : "New Project", body, [
      id && state.projects.length > 1
        ? h("button", {
            class: "btn is-danger",
            text: "Delete",
            onclick: function () {
              var live = liveTasks(function (t) {
                return t.projectId === id;
              });
              if (live.length) {
                refuseDelete(
                  "Project",
                  existing.name,
                  live,
                  "Move that work to another project, or complete or delete it, and the project can then be deleted. Only Completed tasks are ignored here."
                );
                return;

              })[0];
              confirmAction({
