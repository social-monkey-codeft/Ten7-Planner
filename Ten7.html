<style>
/* ==========================================================================
   Ten7
   Palette: cool graphite ground, single teal accent for the instrument chrome,
   eight project hues carrying the only real colour on the grid.
   Type: IBM Plex Sans for interface, Plex Sans Condensed for column headers
   and labels, Plex Mono for every time value, so the gutter and card times
   line up as a scale rather than as prose.
   ========================================================================== */

:root {
  --bg: #0f172a;
  --surface: #111827;
  --surface-2: #1e293b;
  --surface-3: #253449;
  --line: #334155;
  --line-soft: #26334a;
  --ink: #f8fafc;
  --ink-2: #94a3b8;
  --ink-3: #64748b;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --accent-ink: #ffffff;
  --accent-soft: #1e2c4d;
  --warn: #d09a4c;
  --warn-soft: #322612;
  --danger: #e0737d;
  --danger-soft: #341c20;
  --ok: #5fb289;
  --shadow-drag: 0 10px 28px rgba(0, 0, 0, 0.55);
  --shadow-pop: 0 14px 44px rgba(0, 0, 0, 0.5);

  --p1: #68b0a8;
  --p1-bg: #182927;
  --p2: #909ac9;
  --p2-bg: #1d2130;
  --p3: #bf9c5c;
  --p3-bg: #28241a;
  --p4: #c78b99;
  --p4-bg: #2a2025;
  --p5: #9ab077;
  --p5-bg: #202721;
  --p6: #83a5c1;
  --p6-bg: #1b232d;
  --p7: #a78dbc;
  --p7-bg: #24202c;
  --p8: #be9279;
  --p8-bg: #282119;

  --gutter: 62px;
  --radius: 5px;
  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --cond: "IBM Plex Sans Condensed", "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
  border-radius: 3px;
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}

/* ------------------------------------------------------------------ shell */

.shell {
  display: grid;
  grid-template-areas: "brand top" "side main";
  grid-template-columns: 274px minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  height: 100dvh;
}

.shell.has-details {
  grid-template-areas: "brand top top" "side main details";
  grid-template-columns: 274px minmax(0, 1fr) 324px;
}

.brand {
  grid-area: brand;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 14px;
  height: 50px;
  background: var(--surface);
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.brand-mark {
  width: 22px;
  height: 22px;
  flex: none;
  border-radius: 4px;
  background: var(--ink);
  position: relative;
  overflow: hidden;
}
.brand-mark i {
  position: absolute;
  left: 4px;
  right: 4px;
  height: 3px;
  border-radius: 1px;
  background: var(--accent);
  display: block;
}
.brand-mark i:nth-child(1) {
  top: 5px;
  right: 9px;
}
.brand-mark i:nth-child(2) {
  top: 10px;
}
.brand-mark i:nth-child(3) {
  top: 15px;
  left: 8px;
  background: var(--ink-3);
}

/* The wordmark keeps the app's own rule that every numeral is set in the mono
   face: "Ten" is the condensed interface face, the 7 is the same mono the hour
   gutter and every card time use, and the two sit tight against each other as
   one word rather than as a name with a number after it. */
.brand-name {
  display: flex;
  align-items: baseline;
  gap: 4px;
  font-size: 19px;
  line-height: 1;
}
.brand-name b {
  font-family: var(--cond);
  font-weight: 700;
  letter-spacing: 0;
}
.brand-name i {
  font-family: var(--mono);
  font-style: normal;
  /* the mono face carries more sidebearing than the condensed one, so the 7
     is pulled back to sit against the n rather than a word-space away */
  font-size: 18.5px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.04em;
}

.brand-filters {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1 1 auto;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.brand-filters:empty {
  display: none;
}
.filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex: none;
  max-width: 130px;
  padding: 3px 5px 3px 9px;
  border-radius: 999px;
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  color: var(--ink);
  font-size: 11px;
  line-height: 1.3;
  white-space: nowrap;
}
.filter-chip span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.filter-chip button {
  flex: none;
  width: 15px;
  height: 15px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--ink-2);
  font-size: 12px;
  line-height: 1;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.filter-chip button:hover {
  background: var(--surface-3);
  color: var(--ink);
}

/* --------------------------------------------------------- gh sync pill */

.gh-status {
  flex: none;
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11px;
  line-height: 1.3;
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink-2);
  white-space: nowrap;
}
.gh-status:hover {
  border-color: var(--ink-3);
  color: var(--ink);
}
.gh-status .gh-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--ink-3);
  flex: none;
}
.gh-status.is-editor .gh-dot {
  background: var(--ok);
}
.gh-status.is-viewer .gh-dot {
  background: var(--ink-3);
}
.gh-status.is-offline .gh-dot {
  background: var(--danger);
}

/* -------------------------------------------------------------- top bar */

.top {
  grid-area: top;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  height: 50px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}

.top-date {
  font-family: var(--cond);
  font-size: 15px;
  font-weight: 600;
  min-width: 190px;
  letter-spacing: 0.01em;
  flex-shrink: 0;
}

.top-spacer {
  flex: 1;
}

.stat {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  padding: 0 10px;
  border-left: 1px solid var(--line-soft);
  line-height: 1.2;
  flex-shrink: 0;
  white-space: nowrap;
}
.stat b {
  font-family: var(--mono);
  font-size: 12.5px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.stat span {
  font-family: var(--cond);
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-3);
  white-space: nowrap;
}
.stat.is-late b {
  color: var(--danger);
}
.stat.is-progress b {
  color: var(--ok);
}

/* -------------------------------------------------------------- controls */

.btn {
  font: inherit;
  font-size: 12px;
  color: var(--ink);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 5px 10px;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.12s, border-color 0.12s;
}
.btn:hover {
  background: var(--surface-3);
}
.btn:active {
  transform: translateY(0.5px);
}
.btn.is-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-weight: 500;
}
.btn.is-primary:hover {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}
.btn.is-quiet {
  background: transparent;
  border-color: transparent;
  color: var(--ink-2);
}
.btn.is-quiet:hover {
  background: var(--surface-2);
  color: var(--ink);
}
.btn.is-danger {
  color: var(--danger);
  border-color: var(--line);
}
.btn.is-danger:hover {
  background: var(--danger-soft);
}
.btn.is-icon {
  padding: 5px 8px;
  font-family: var(--mono);
}

.seg {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--surface-2);
  flex-shrink: 0;
}
.seg button {
  font: inherit;
  font-family: var(--cond);
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 5px 11px;
  border: 0;
  background: transparent;
  color: var(--ink-2);
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
}
.seg button + button {
  border-left: 1px solid var(--line);
}
.seg button[aria-pressed="true"] {
  background: var(--ink);
  color: var(--surface);
}

/* -------------------------------------------------------------- sidebar */

.side {
  grid-area: side;
  background: var(--surface);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.sec {
  border-bottom: 1px solid var(--line-soft);
  padding: 12px 14px 14px;
}
.sec:last-child {
  border-bottom: 0;
}

.sec-head {
  display: flex;
  align-items: baseline;
  gap: 7px;
  margin-bottom: 9px;
}
.sec-title {
  font-family: var(--cond);
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-3);
}
.sec-count {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.sec-head .btn {
  margin-left: auto;
  padding: 2px 7px;
  font-size: 11px;
}

.list {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

/* project rows */
.proj {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 7px;
  border-radius: var(--radius);
  cursor: pointer;
  border: 1px solid transparent;
  background: transparent;
  font: inherit;
  color: inherit;
  text-align: left;
  width: 100%;
}
.proj:hover {
  background: var(--surface-2);
}
.proj[aria-pressed="true"] {
  background: var(--surface-2);
  border-color: var(--line);
}
.proj-dot {
  width: 9px;
  height: 9px;
  border-radius: 2px;
  flex: none;
  background: var(--pc);
}
.proj-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.proj-hours {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  flex: none;
  white-space: nowrap;
}
.proj-x {
  font: inherit;
  border: 0;
  background: transparent;
  color: var(--ink-3);
  cursor: pointer;
  padding: 0 2px;
  opacity: 0;
  font-family: var(--mono);
}
.proj:hover .proj-x {
  opacity: 1;
}
.proj-x:hover {
  color: var(--danger);
}

/* task chips in the sidebar */
.chip {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  padding: 6px 8px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--pc, var(--line));
  border-radius: var(--radius);
  background: var(--surface-2);
  cursor: grab;
  touch-action: none;
  user-select: none;
}
.chip:hover {
  background: var(--surface-3);
}
.chip.is-selected {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}
.chip.is-done .chip-name {
  text-decoration: line-through;
  color: var(--ink-3);
}
.chip-body {
  flex: 1;
  min-width: 0;
}
.chip-name {
  font-size: 12.5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chip-meta {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-3);
  display: flex;
  gap: 6px;
  font-variant-numeric: tabular-nums;
}
.chip-meta .late {
  color: var(--danger);
}

.empty {
  font-size: 12px;
  color: var(--ink-3);
  padding: 7px 8px;
  border: 1px dashed var(--line);
  border-radius: var(--radius);
  line-height: 1.4;
}

/* scheduler activity */
.logrow {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 8px;
  padding: 5px 0;
  border-bottom: 1px dotted var(--line-soft);
  font-size: 11.5px;
}
.logrow:last-child {
  border-bottom: 0;
}
.logrow b {
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.logrow span {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
  text-align: right;
}
.logrow i {
  grid-column: 1 / -1;
  font-family: var(--mono);
  font-size: 10.5px;
  font-style: normal;
  color: var(--ink-3);
}

/* -------------------------------------------------------------- calendar */

.main {
  grid-area: main;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  overflow: hidden;
}

.cal-head {
  display: grid;
  grid-template-columns: var(--gutter) 1fr;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  flex: none;
}
.cal-head-days {
  display: grid;
}
.dayhead {
  padding: 6px 9px 7px;
  border-left: 1px solid var(--line-soft);
  min-width: 0;
}
.dayhead-top {
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.dayhead-dow {
  font-family: var(--cond);
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--ink-3);
}
.dayhead-num {
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.dayhead-load {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.dayhead.is-today .dayhead-num {
  color: var(--accent);
}
.dayhead.is-today .dayhead-dow {
  color: var(--accent);
}
.dayhead.is-off .dayhead-num,
.dayhead.is-off .dayhead-dow {
  color: var(--ink-3);
  opacity: 0.65;
}
.dayhead-bar {
  margin-top: 5px;
  height: 3px;
  border-radius: 2px;
  background: var(--surface-3);
  overflow: hidden;
}
.dayhead-bar i {
  display: block;
  height: 100%;
  background: var(--accent);
}
.dayhead-bar.is-full i {
  background: var(--warn);
}

.cal-body {
  flex: 1;
  overflow: auto;
  display: grid;
  grid-template-columns: var(--gutter) 1fr;
  align-items: start;
  position: relative;
  /* top room so the first hour label is not clipped by its own centring */
  padding: 9px 0 20px;
}

.gutter {
  position: relative;
  height: var(--grid-h);
  background: var(--surface);
  border-right: 1px solid var(--line);
}
.hourlabel {
  position: absolute;
  right: 7px;
  transform: translateY(-50%);
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.cols {
  position: relative;
  height: var(--grid-h);
  display: grid;
}

.gridlines {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}
.gridlines div {
  position: absolute;
  left: 0;
  right: 0;
  border-top: 1px solid var(--line-soft);
}
.gridlines div.half {
  border-top-style: dotted;
  opacity: 0.7;
}

.col {
  position: relative;
  border-left: 1px solid var(--line-soft);
  background: var(--surface);
  min-width: 0;
  z-index: 1;
}
.col.is-off {
  background: var(--bg);
  background-image: repeating-linear-gradient(
    135deg,
    transparent 0 6px,
    var(--line-soft) 6px 7px
  );
}
.col-off-label {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6px 8px;
  pointer-events: none;
}
.col-off-label span {
  font-family: var(--cond);
  font-size: 9.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-3);
  background: var(--surface);
  padding: 1px 6px;
  border-radius: 3px;
  border: 1px solid var(--line);
  text-align: center;
  line-height: 1.35;
  white-space: normal;
  word-break: break-word;
  max-width: 100%;
}
.col-dead {
  position: absolute;
  left: 0;
  right: 0;
  background: var(--bg);
  background-image: repeating-linear-gradient(
    135deg,
    transparent 0 6px,
    var(--line-soft) 6px 7px
  );
  pointer-events: none;
}

.nowline {
  position: absolute;
  left: 0;
  right: 0;
  height: 0;
  border-top: 1px solid var(--accent);
  z-index: 6;
  pointer-events: none;
}
.nowline::before {
  content: "";
  position: absolute;
  left: -3px;
  top: -3px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
}

/* -------------------------------------------------------------- blocks */

.block {
  position: absolute;
  left: 3px;
  right: 4px;
  /* Neutral outline, coloured stripe. Outlining every block in its project hue
     was the loudest thing on the grid; the stripe carries the identity. */
  border: 1px solid var(--line);
  border-left: 3px solid var(--pc);
  border-radius: 4px;
  background: var(--pc-bg);
  overflow: hidden;
  cursor: grab;
  touch-action: none;
  user-select: none;
  z-index: 2;
  padding: 3px 6px 3px 7px;
  min-height: 15px;
}
.block:hover {
  z-index: 4;
  filter: brightness(1.02) saturate(1.05);
}
.block.is-selected {
  z-index: 5;
  box-shadow: 0 0 0 2px var(--accent);
}
.block.is-cont {
  border-top-style: dashed;
}
.block.is-split-open {
  border-bottom-style: dashed;
}
/* Completed work greys out completely: the project colour is dropped from the
   stripe too, so a finished block reads as finished at a glance. */
.block.is-done {
  background: var(--surface-2);
  border-color: var(--line);
  border-left-color: var(--ink-3);
  cursor: default;
}
.block.is-done .block-title {
  text-decoration: line-through;
  color: var(--ink-3);
}
.block.is-done .block-meta,
.block.is-done .block-part {
  color: var(--ink-3);
}
.block.is-done .avatar {
  opacity: 0.55;
}

/* On hold keeps its slot, and says so with a hatch behind it */
.block.is-hold {
  background-image: repeating-linear-gradient(
    -45deg,
    transparent 0 6px,
    var(--line-soft) 6px 7px
  );
}
.block.is-late {
  box-shadow: inset 0 0 0 1px var(--danger);
}
.block.is-ghosted {
  opacity: 0.28;
}

.block-title {
  font-size: 12px;
  font-weight: 500;
  line-height: 1.25;
  color: var(--ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* tall enough to give a long task name a second line */
.block.is-tall .block-title {
  white-space: normal;
  text-overflow: clip;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
}
.block-meta {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.block-part {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: var(--cond);
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--ink-3);
  /* one line only: wrapping here orphaned the separator onto its own row */
  white-space: nowrap;
  overflow: hidden;
}
.block-part span {
  overflow: hidden;
  text-overflow: ellipsis;
}
.block.is-short {
  padding-top: 1px;
  padding-bottom: 1px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.block.is-short .block-title {
  font-size: 11px;
}
.block.is-short .block-meta {
  flex: none;
  font-size: 9.5px;
}

.rz {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 7px;
  cursor: ns-resize;
  touch-action: none;
}
.rz::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 2px;
  transform: translateX(-50%);
  width: 20px;
  height: 2px;
  border-radius: 1px;
  background: var(--pc);
  opacity: 0;
}
.block:hover .rz::after {
  opacity: 0.55;
}

/* drag artefacts */
.ghost {
  position: fixed;
  z-index: 90;
  pointer-events: none;
  border-radius: 4px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--pc);
  background: var(--pc-bg);
  box-shadow: var(--shadow-drag);
  padding: 3px 7px;
  overflow: hidden;
  opacity: 0.95;
}
.drop-preview {
  position: absolute;
  left: 3px;
  right: 4px;
  z-index: 3;
  border: 1px dashed var(--accent);
  border-radius: 4px;
  background: var(--accent-soft);
  pointer-events: none;
  padding: 2px 6px;
  overflow: hidden;
}
.drop-preview b {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
body.is-dragging {
  cursor: grabbing;
}
body.is-dragging .block,
body.is-dragging .chip {
  cursor: grabbing;
}

/* -------------------------------------------------------------- details */

.details {
  grid-area: details;
  background: var(--surface);
  border-left: 1px solid var(--line);
  overflow-y: auto;
  padding: 14px;
}
.shell:not(.has-details) .details {
  display: none;
}

.det-head {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 12px;
}
.det-title {
  font-family: var(--cond);
  font-size: 16px;
  font-weight: 600;
  line-height: 1.25;
  flex: 1;
  text-wrap: balance;
}

.kv {
  display: grid;
  grid-template-columns: 84px 1fr;
  gap: 7px 10px;
  align-items: baseline;
  padding: 11px 0;
  border-top: 1px solid var(--line-soft);
}
.kv dt {
  font-family: var(--cond);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-3);
}
.kv dd {
  margin: 0;
  font-size: 12.5px;
}
.kv dd.mono {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 12px;
}

.blocklist {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-top: 4px;
}
.blocklist div {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-family: var(--mono);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  padding: 4px 7px;
  background: var(--surface-2);
  border-radius: 3px;
  border-left: 2px solid var(--pc);
}
.blocklist div span {
  color: var(--ink-3);
}

.det-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
  padding-top: 13px;
  border-top: 1px solid var(--line-soft);
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 7px;
  border-radius: 3px;
  font-family: var(--cond);
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  background: var(--surface-3);
  color: var(--ink-2);
}
.tag.is-proj {
  background: var(--pc-bg);
  color: var(--pc);
}
.tag.is-late {
  background: var(--danger-soft);
  color: var(--danger);
}
.tag.is-done {
  background: var(--accent-soft);
  color: var(--accent);
}

/* --------------------------------------------------------------- modals */

.scrim {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(12, 16, 22, 0.42);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 6vh 16px 16px;
  overflow: auto;
}
.modal {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: var(--shadow-pop);
  width: 100%;
  max-width: 460px;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
}
.modal.is-wide {
  max-width: 860px;
}
.modal-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 16px;
  border-bottom: 1px solid var(--line-soft);
  flex: none;
}
.modal-head h2 {
  margin: 0;
  font-family: var(--cond);
  font-size: 15.5px;
  font-weight: 600;
  flex: 1;
}
.modal-body {
  padding: 16px;
  overflow-y: auto;
  flex: 1 1 auto;
  min-height: 0;
}
.modal-foot {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  border-top: 1px solid var(--line-soft);
  background: var(--surface-2);
  border-radius: 0 0 8px 8px;
  flex: none;
}
.modal-foot .grow {
  flex: 1;
}

/* ---------------------------------------------------------------- forms */

.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 12px;
}
.field > label {
  font-family: var(--cond);
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-3);
}
.row2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

input[type="text"],
input[type="date"],
input[type="time"],
input[type="number"],
select,
textarea {
  font: inherit;
  font-size: 13px;
  color: var(--ink);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 6px 8px;
  width: 100%;
}
input[type="date"],
input[type="time"],
input[type="number"] {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
}
textarea {
  resize: vertical;
  min-height: 58px;
  line-height: 1.5;
}
select {
  cursor: pointer;
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%),
    linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 26px;
}
.hint {
  font-size: 11.5px;
  color: var(--ink-3);
  line-height: 1.4;
}

.dur-presets {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.dur-presets button {
  font: inherit;
  font-family: var(--mono);
  font-size: 11px;
  padding: 3px 7px;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: var(--surface-2);
  color: var(--ink-2);
  cursor: pointer;
}
.dur-presets button:hover {
  background: var(--surface-3);
  color: var(--ink);
}

.swatches {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}
.swatch {
  width: 24px;
  height: 24px;
  border-radius: 4px;
  border: 1px solid var(--line);
  background: var(--pc);
  cursor: pointer;
  padding: 0;
}
.swatch[aria-pressed="true"] {
  box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--pc);
}

/* settings day rows */
.daygrid {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.dayrow {
  display: grid;
  grid-template-columns: 26px 1fr auto auto;
  gap: 9px;
  align-items: center;
  padding: 5px 8px;
  border-radius: var(--radius);
  border: 1px solid transparent;
}
.dayrow:nth-child(odd) {
  background: var(--surface-2);
}
.dayrow.is-off {
  color: var(--ink-3);
}
.dayrow-name {
  font-family: var(--cond);
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.dayrow input[type="time"] {
  width: 104px;
}
.dayrow-total {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
  min-width: 42px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.dayrow.is-off input[type="time"] {
  opacity: 0.4;
  pointer-events: none;
}

.sw {
  position: relative;
  width: 30px;
  height: 17px;
  flex: none;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--surface-3);
  cursor: pointer;
  padding: 0;
  transition: background 0.14s;
}
.sw::after {
  content: "";
  position: absolute;
  top: 1px;
  left: 1px;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: var(--surface);
  transition: transform 0.14s;
}
.sw[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
}
.sw[aria-pressed="true"]::after {
  transform: translateX(13px);
}

/* --------------------------------------------------------------- toasts */

.toasts {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 120;
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: center;
  pointer-events: none;
}
.toast {
  background: var(--ink);
  color: var(--surface);
  padding: 7px 13px;
  border-radius: 20px;
  font-size: 12px;
  box-shadow: var(--shadow-drag);
  max-width: 78vw;
}
.toast b {
  font-family: var(--mono);
  font-weight: 500;
}

/* The custom hover tip that replaces the native title attribute on task
   blocks, so its 0.5s appear-delay can be exact and cancellable. */
.hover-tip {
  position: fixed;
  z-index: 200;
  background: var(--ink);
  color: var(--surface);
  padding: 7px 10px;
  border-radius: 6px;
  font-size: 11.5px;
  line-height: 1.5;
  display: grid;
  grid-template-columns: max-content max-content 1fr;
  column-gap: 4px;
  box-shadow: var(--shadow-drag);
  max-width: 280px;
  pointer-events: none;
}
.hover-tip-label {
  grid-column: 1;
  white-space: nowrap;
}
.hover-tip-colon {
  grid-column: 2;
}
.hover-tip-value {
  grid-column: 3;
  overflow-wrap: break-word;
}

/* ------------------------------------------------------------ responsive */

.side-toggle {
  display: none;
}

@media (max-width: 1180px) {
  .shell.has-details {
    grid-template-areas: "brand top" "side main";
    grid-template-columns: 274px minmax(0, 1fr);
  }
  .shell.has-details .details {
    position: fixed;
    top: 50px;
    right: 0;
    bottom: 0;
    width: 324px;
    z-index: 40;
    box-shadow: var(--shadow-pop);
  }
}

@media (max-width: 860px) {
  .shell,
  .shell.has-details {
    grid-template-areas: "brand top" "main main";
    grid-template-columns: auto minmax(0, 1fr);
  }
  .brand {
    border-right: 0;
  }
  .brand-name {
    display: none;
  }
  .side {
    position: fixed;
    top: 50px;
    bottom: 0;
    left: 0;
    width: 274px;
    z-index: 50;
    box-shadow: var(--shadow-pop);
    transform: translateX(-100%);
    transition: transform 0.18s;
  }
  body.side-open .side {
    transform: none;
  }
  .side-toggle {
    display: inline-block;
  }
  .top-date {
    min-width: 0;
    font-size: 13.5px;
  }
  .stat {
    display: none;
  }
  .shell.has-details .details {
    width: min(324px, 92vw);
  }
}

/* ==========================================================================
   Additions: people, statuses, breaks, month view, filters, side-by-side lanes
   ========================================================================== */

/* ------------------------------------------------------------- filter chip */

.filterchip {
  font: inherit;
  font-family: var(--cond);
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.04em;
  padding: 4px 9px;
  border-radius: 20px;
  border: 1px solid var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
  cursor: pointer;
  white-space: nowrap;
}
.filterchip:hover {
  filter: brightness(1.05);
}

/* --------------------------------------------------------------- overflow */

#menuRoot .menu {
  position: fixed;
  z-index: 110;
  width: 286px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 7px;
  box-shadow: var(--shadow-pop);
  padding: 5px;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.menu-item {
  font: inherit;
  text-align: left;
  border: 0;
  background: transparent;
  color: inherit;
  border-radius: 4px;
  padding: 7px 9px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.menu-item:hover {
  background: var(--surface-2);
}
.menu-item b {
  font-size: 12.5px;
  font-weight: 500;
}
.menu-item span {
  font-size: 11px;
  color: var(--ink-3);
  line-height: 1.35;
}

/* ---------------------------------------------------------------- avatars */

.avatar {
  width: 20px;
  height: 20px;
  flex: none;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--pc-bg, var(--surface-3));
  color: var(--pc, var(--ink-2));
  border: 1px solid var(--pc, var(--line));
  font-family: var(--cond);
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.avatar.is-sm {
  width: 18px;
  height: 18px;
  font-size: 9px;
}
.avatar.is-empty {
  background: var(--surface-3);
  border-style: dashed;
}

/* ---------------------------------------------------- collapsible section */

.sec-toggle {
  font: inherit;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1;
  border: 0;
  background: transparent;
  color: var(--ink-3);
  cursor: pointer;
  padding: 0 1px;
}
.sec-toggle:hover {
  color: var(--ink);
}

/* --------------------------------------------------------- load breakdown */

.bargroup {
  margin-top: 4px;
}
.bargroup + .bargroup {
  margin-top: 11px;
}
.bargroup-title {
  font-family: var(--cond);
  font-size: 9.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--ink-3);
  margin-bottom: 5px;
}
.bar {
  display: grid;
  grid-template-columns: 68px 1fr 46px;
  gap: 7px;
  align-items: center;
  padding: 2px 0;
}
.bar-name {
  font-size: 11.5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.bar-track {
  height: 6px;
  border-radius: 3px;
  background: var(--surface-3);
  overflow: hidden;
}
.bar-track i {
  display: block;
  height: 100%;
  background: var(--pc);
  border-radius: 3px;
}
.bar-val {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-2);
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* ------------------------------------------------------------ chip states */

.chip.is-parked {
  border-style: dashed;
  background: transparent;
}
.chip.is-parked .chip-name {
  color: var(--ink-2);
}

/* -------------------------------------------------------- status segments */

/* Two by two, because the full status names do not fit in one strip */
.statusgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.statusgrid button {
  font: inherit;
  font-family: var(--cond);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 6px 4px;
  border: 0;
  background: var(--surface-2);
  color: var(--ink-3);
  cursor: pointer;
}
.statusgrid button:hover {
  color: var(--ink);
  background: var(--surface-3);
}
/* The set the whole app reads by: Yet to Start is quiet, In Progress is
   amber because it is the one thing happening now, On Hold is red because
   it is the one thing stuck, Completed is green because it is finished.
   The same four colours are used on the cards, so a status never means two
   different things in two places. */
.statusgrid button[aria-pressed="true"] {
  background: var(--ink);
  color: var(--surface);
}
.statusgrid button[data-status="doing"][aria-pressed="true"] {
  background: var(--warn);
  color: #fff;
}
.statusgrid button[data-status="hold"][aria-pressed="true"] {
  background: var(--danger);
  color: #fff;
}
.statusgrid button[data-status="done"][aria-pressed="true"] {
  background: var(--ok);
  color: #fff;
}

.tagrow {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}

/* ---------------------------------------------------------------- breaks */

.col-break {
  position: absolute;
  left: 0;
  right: 0;
  z-index: 1;
  background: var(--bg);
  background-image: repeating-linear-gradient(
    135deg,
    transparent 0 6px,
    var(--line-soft) 6px 7px
  );
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.col-break span {
  font-family: var(--cond);
  font-size: 9.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-3);
  background: var(--surface);
  padding: 1px 6px;
  border-radius: 3px;
  border: 1px solid var(--line);
  white-space: nowrap;
}

.breakrow {
  display: grid;
  grid-template-columns: 1fr auto auto auto;
  gap: 9px;
  align-items: center;
  padding: 5px 8px;
  border-radius: var(--radius);
}
.breakrow:nth-child(odd) {
  background: var(--surface-2);
}
.breakrow input[type="time"] {
  width: 104px;
}
.daypicker {
  display: flex;
  gap: 2px;
}
.daypicker button {
  font: inherit;
  font-family: var(--cond);
  font-size: 10.5px;
  font-weight: 600;
  width: 21px;
  height: 21px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: var(--surface);
  color: var(--ink-3);
  cursor: pointer;
}
.daypicker button[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}

/* ------------------------------------------------------------ block extras */

.block.is-laned {
  border-left-width: 3px;
}
/* status pills inside a task card */
.spill {
  display: inline-block;
  font-family: var(--cond);
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  line-height: 14px;
  padding: 0 4px;
  border-radius: 2px;
  white-space: nowrap;
  flex: none;
}
/* the default state stays quiet, the ones that mean something speak up */
.spill.is-todo {
  border: 1px solid var(--line);
  color: var(--ink-3);
  background: transparent;
  line-height: 12px;
}
.spill.is-doing {
  background: var(--warn);
  color: #fff;
}
.spill.is-hold {
  background: var(--danger);
  color: #fff;
}
.spill.is-done {
  border: 1px solid var(--line);
  color: var(--ink-3);
  background: transparent;
  line-height: 12px;
}

/* --------------------------------------------------------------- month view */

.cal-head > .month-head {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
}
.month-dow {
  padding: 5px 9px 6px;
  border-left: 1px solid var(--line-soft);
  font-family: var(--cond);
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--ink-3);
}
.month-dow:first-child {
  border-left: 0;
}

.cal-body.is-month {
  display: block;
  padding: 0;
}
.month-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  min-height: 100%;
}
.month-cell {
  border-left: 1px solid var(--line-soft);
  border-top: 1px solid var(--line-soft);
  background: var(--surface);
  padding: 5px 6px 6px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
  cursor: default;
}
.month-cell:nth-child(7n + 1) {
  border-left: 0;
}
.month-cell.is-off {
  background: var(--bg);
  background-image: repeating-linear-gradient(135deg, transparent 0 6px, var(--line-soft) 6px 7px);
}
.month-cell.is-outside {
  opacity: 0.55;
}
.month-cell.is-today {
  box-shadow: inset 0 2px 0 0 var(--accent);
}
.month-cell.is-drop {
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 2px var(--accent);
}
.month-cell-top {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 2px 6px;
}
.month-num {
  font: inherit;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  border: 0;
  background: transparent;
  color: var(--ink);
  padding: 0;
  cursor: pointer;
}
.month-num:hover {
  color: var(--accent);
  text-decoration: underline;
}
.month-cell.is-today .month-num {
  color: var(--accent);
}
.month-load {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  margin-left: auto;
  font-variant-numeric: tabular-nums;
  min-width: 0;
}
.month-bar {
  height: 3px;
  border-radius: 2px;
  background: var(--surface-3);
  overflow: hidden;
  flex: none;
}
.month-bar i {
  display: block;
  height: 100%;
  background: var(--accent);
}
.month-bar.is-full i {
  background: var(--warn);
}
.month-pills {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
  min-height: 0;
}
.pill {
  display: flex;
  align-items: baseline;
  gap: 5px;
  padding: 2px 5px;
  border-radius: 3px;
  background: var(--pc-bg);
  border-left: 3px solid var(--pc);
  cursor: grab;
  touch-action: none;
  user-select: none;
  min-width: 0;
}
.pill:hover {
  filter: brightness(1.03) saturate(1.05);
}
.pill.is-selected {
  box-shadow: 0 0 0 2px var(--accent);
}
.pill.is-done {
  background: var(--surface-2);
  border-left-color: var(--line);
  cursor: default;
}
.pill.is-done .pill-name {
  text-decoration: line-through;
  color: var(--ink-3);
}
.pill-time {
  font-family: var(--mono);
  font-size: 9.5px;
  color: var(--ink-2);
  flex: none;
  font-variant-numeric: tabular-nums;
}
.pill-name {
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.month-more {
  font: inherit;
  font-size: 10.5px;
  color: var(--ink-3);
  border: 0;
  background: transparent;
  text-align: left;
  padding: 1px 5px;
  cursor: pointer;
}
.month-more:hover {
  color: var(--accent);
  text-decoration: underline;
}

/* --------------------------------------------------------- narrow screens */

@media (max-width: 860px) {
  .month-cell {
    padding: 4px;
  }
  .pill-time {
    display: none;
  }
  .filterchip {
    display: none;
  }
}

/* keep a task name clear of the assignee badge sitting in the corner */
.block.has-who .block-title {
  padding-right: 19px;
}

/* ==========================================================================
   Additions: confirm layer, notes with links, custom hex colours
   ========================================================================== */

/* --------------------------------------------------------- confirm layer */

.scrim.is-confirm {
  z-index: 130;
  background: rgba(12, 16, 22, 0.5);
  align-items: center;
  padding: 16px;
}
.modal.is-narrow {
  max-width: 396px;
}
.confirm-body {
  margin: 0 0 6px;
  font-size: 13.5px;
  line-height: 1.5;
}
.btn.is-destroy {
  background: var(--danger);
  border-color: var(--danger);
  color: #fff;
  font-weight: 500;
}
.btn.is-destroy:hover {
  background: var(--danger);
  filter: brightness(1.1);
}

/* --------------------------------------------------------- notes + links */

.field-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.field-head label {
  flex: 1;
}
.field-head .btn {
  padding: 1px 7px;
  font-size: 11px;
}
.notes-view {
  font-size: 12.5px;
  line-height: 1.55;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  padding: 7px 9px;
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  background: var(--surface-2);
  cursor: text;
}
.notes-view:hover {
  border-color: var(--line);
}
.notes-view a {
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 2px;
  text-decoration-thickness: 1px;
  overflow-wrap: anywhere;
}
.notes-view a:hover {
  text-decoration-thickness: 2px;
}
.notes-tools {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
}
.notes-tools .hint {
  flex: 1;
}

/* ------------------------------------------------------ custom hex colour */

.hexrow {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 8px;
}
.hexpicker {
  width: 30px;
  height: 26px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--surface-2);
  cursor: pointer;
  flex: none;
}
.hexpicker::-webkit-color-swatch-wrapper {
  padding: 2px;
}
.hexpicker::-webkit-color-swatch {
  border: 0;
  border-radius: 2px;
}
/* input[type="text"] sets width:100% and outranks a bare class, so the hex
   field has to name the element to win the cascade */
input[type="text"].hexfield {
  width: 106px;
  flex: none;
  font-family: var(--mono);
  text-transform: lowercase;
}
input[type="text"].hexfield.is-active {
  border-color: var(--accent);
}
.hexrow .hint {
  flex: 1;
  min-width: 0;
}

.swatch-preview {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 9px;
  padding: 7px 9px 7px 0;
  border: 1px solid var(--line);
  border-left: 0;
  border-radius: 4px;
  background: var(--pc-bg);
  overflow: hidden;
}
.swatch-preview-stripe {
  width: 3px;
  align-self: stretch;
  background: var(--pc);
  flex: none;
}
.swatch-preview-title {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink);
}
.swatch-preview-meta {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}

/* people carry no colour, so their initials sit on the neutral surface */
.avatar {
  background: var(--surface-3);
  color: var(--ink-2);
  border-color: var(--line);
}

/* ==========================================================================
   Additions: multiple rich-text notes per task, raw data disclosure
   ========================================================================== */

.note {
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  background: var(--surface-2);
  margin-top: 7px;
  overflow: hidden;
}
.note-top {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 5px 4px 9px;
  border-bottom: 1px solid var(--line-soft);
}
.note-stamp {
  flex: 1;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.note-top .btn {
  padding: 1px 6px;
  font-size: 11px;
}
.note-body {
  padding: 8px 10px;
  font-size: 12.5px;
  line-height: 1.55;
  overflow-wrap: anywhere;
}
.note-body p {
  margin: 0 0 6px;
}
.note-body p:last-child {
  margin-bottom: 0;
}
.note-body ul,
.note-body ol {
  margin: 4px 0;
  padding-left: 19px;
}
.note-body a {
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 2px;
  text-decoration-thickness: 1px;
}
.note-body a:hover {
  text-decoration-thickness: 2px;
}

/* ------------------------------------------------------------ note editor */

.note-editor {
  margin-top: 7px;
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  background: var(--surface);
  overflow: hidden;
}
.note-tools {
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 4px 5px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line-soft);
}
.note-tools-gap {
  flex: 1;
}
.note-btn {
  font: inherit;
  font-size: 12px;
  min-width: 24px;
  height: 22px;
  padding: 0 5px;
  border: 1px solid transparent;
  border-radius: 3px;
  background: transparent;
  color: var(--ink-2);
  cursor: pointer;
  line-height: 1;
}
.note-btn:hover {
  background: var(--surface-3);
  color: var(--ink);
  border-color: var(--line);
}
.note-btn.is-wide {
  font-family: var(--cond);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 0 8px;
}
.note-btn b {
  font-weight: 700;
}
.note-btn.is-em i {
  font-style: italic;
  font-family: Georgia, serif;
}

.note-linkbar {
  display: flex;
  gap: 5px;
  padding: 6px 5px;
  background: var(--accent-soft);
  border-bottom: 1px solid var(--line-soft);
}
.note-linkbar .btn {
  padding: 4px 9px;
  font-size: 11.5px;
}
input[type="text"].note-url {
  flex: 1;
  min-width: 0;
  font-family: var(--mono);
  font-size: 11.5px;
  padding: 4px 7px;
}

.note-input {
  padding: 8px 10px;
  min-height: 76px;
  max-height: 260px;
  overflow-y: auto;
  font-size: 12.5px;
  line-height: 1.55;
  overflow-wrap: anywhere;
}
.note-input:focus {
  outline: none;
}
.note-input:empty::before {
  content: "Write your note. Select any words, then hit Link.";
  color: var(--ink-3);
}
.note-input a {
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 2px;
}
.note-input ul,
.note-input ol {
  margin: 4px 0;
  padding-left: 19px;
}

.note-foot {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 8px;
  border-top: 1px solid var(--line-soft);
  background: var(--surface-2);
}
.note-foot .hint {
  flex: 1;
  min-width: 0;
}
.note-foot .btn {
  padding: 4px 9px;
  font-size: 11.5px;
}

/* ------------------------------------------------------------- raw data */

.rawdata {
  margin-top: 14px;
  border-top: 1px solid var(--line-soft);
  padding-top: 10px;
}
.rawdata summary {
  font-family: var(--cond);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-3);
  cursor: pointer;
}
.rawdata summary:hover {
  color: var(--ink);
}

/* ==========================================================================
   Additions: holidays and time off
   ========================================================================== */

/* A day emptied by time off reads like a weekend, but says why. The texture
   stays as quiet as the weekend hatch; the label and the header carry the
   meaning, so a week with a holiday in it is not a wall of colour. */
.col.is-dayoff {
  background-image: repeating-linear-gradient(
    135deg,
    transparent 0 6px,
    var(--line-soft) 6px 7px
  );
}
.col.is-dayoff .col-off-label {
  color: var(--warn);
}
.dayhead.is-dayoff .dayhead-num,
.dayhead.is-dayoff .dayhead-load {
  color: var(--warn);
}
.dayhead-off {
  margin-top: 4px;
  font-family: var(--cond);
  font-size: 9.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--warn);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* a partial stretch of time off, drawn like a break but warmer */
.col-timeoff {
  position: absolute;
  left: 0;
  right: 0;
  z-index: 1;
  background: var(--warn-soft);
  background-image: repeating-linear-gradient(
    -45deg,
    transparent 0 6px,
    var(--line) 6px 7px
  );
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.col-timeoff span {
  font-family: var(--cond);
  font-size: 9.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--warn);
  background: var(--surface);
  padding: 1px 6px;
  border-radius: 3px;
  border: 1px solid var(--line);
  white-space: nowrap;
}

.month-cell.is-dayoff {
  background-image: repeating-linear-gradient(
    135deg,
    transparent 0 6px,
    var(--line-soft) 6px 7px
  );
}
.month-load.is-off {
  color: var(--warn);
  font-family: var(--cond);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  white-space: normal;
  overflow-wrap: break-word;
  text-align: left;
  flex-basis: 100%;
  margin-left: 0;
}

/* ------------------------------------------------------- time off editor */

.offlist {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.offrow {
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  background: var(--surface-2);
  padding: 8px 9px;
}
.offrow-main {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  gap: 9px;
  align-items: center;
}
.offdates {
  display: flex;
  gap: 6px;
  align-items: center;
}
.offdates input[type="date"] {
  width: 138px;
}
.offrow-sub {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  align-items: center;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dotted var(--line);
}
.offallday {
  display: flex;
  align-items: center;
  gap: 6px;
}
.offallday-label {
  font-family: var(--cond);
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--ink-2);
}
.offtimes {
  display: flex;
  gap: 6px;
  align-items: center;
}
.offtimes input[type="time"] {
  width: 102px;
}
.offrow.is-allday .offtimes {
  opacity: 0.35;
  pointer-events: none;
}
.offwho {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-left: auto;
}
.offchip {
  font: inherit;
  font-size: 11.5px;
  padding: 3px 9px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--surface);
  color: var(--ink-2);
  cursor: pointer;
  white-space: nowrap;
}
.offchip:hover {
  background: var(--surface-3);
  color: var(--ink);
}
/* a selection, not a warning */
.offchip[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}

/* ==========================================================================
   Additions: accordion sidebar, editable details pane
   ========================================================================== */

.sec-head {
  cursor: pointer;
  border-radius: 3px;
  margin: -2px -4px 7px;
  padding: 2px 4px;
  user-select: none;
}
.sec-head:hover {
  background: var(--surface-2);
}
.sec-head.is-collapsed {
  margin-bottom: 0;
}
.sec-chev {
  font-size: 8px;
  line-height: 1;
  color: var(--ink-3);
  width: 9px;
  flex: none;
}
.sec.is-collapsed {
  padding-bottom: 10px;
}
/* a long list folds away, and scrolls rather than pushing the rest off screen */
.sec-scroll {
  max-height: 268px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 3px;
  margin-right: -4px;
  padding-right: 4px;
}

/* ------------------------------------------------------ editable details */

.detrow {
  display: grid;
  grid-template-columns: 86px minmax(0, 1fr) 24px;
  gap: 8px;
  align-items: center;
  padding: 7px 0;
  border-top: 1px solid var(--line-soft);
}
.detrow-label {
  font-family: var(--cond);
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-3);
}
.detrow-value {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  min-width: 0;
  overflow: hidden;
}
.detrow-value .mono {
  font-family: var(--mono);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.detrow-value .muted {
  color: var(--ink-3);
}
.detrow-value .is-late-text {
  color: var(--danger);
}
.kv-dot {
  width: 9px;
  height: 9px;
  border-radius: 2px;
  flex: none;
  background: var(--pc);
}
/* Faint but always present: editing is the point of this pane, so the
   affordance should not be a hover secret. */
.detrow-edit {
  opacity: 0.4;
  padding: 2px 5px;
  font-size: 12px;
  transition: opacity 0.12s;
}
.detrow:hover .detrow-edit,
.detrow-edit:focus-visible {
  opacity: 1;
}
.kv.kv-static {
  border-top: 1px solid var(--line-soft);
  padding: 7px 0;
  grid-template-columns: 86px minmax(0, 1fr);
  gap: 8px;
}
.kv.kv-static dt {
  font-family: var(--cond);
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-3);
}

.field.is-editing {
  border-left: 2px solid var(--accent);
  padding-left: 9px;
  margin-top: 8px;
  margin-bottom: 8px;
}
.field-actions {
  display: flex;
  gap: 6px;
  margin-top: 7px;
}
.field-actions .btn {
  padding: 4px 10px;
  font-size: 11.5px;
}

.det-head .btn.is-icon {
  padding: 3px 6px;
}

.tag.is-moved {
  background: var(--warn-soft);
  color: var(--warn);
  cursor: help;
}

/* time off that has already happened is locked, so it cannot silently
   re-flow work that is already done */
.offrow.is-past {
  opacity: 0.72;
  background: var(--surface);
  border-style: dashed;
}
.offrow.is-past input,
.offrow.is-past .sw,

/* ---------------------------------------------------------- name badges */

/* Three characters, not one initial, so a badge is readable on its own
   rather than being a puzzle. A circle cannot hold three characters, so the
   badge is a small rounded tag instead. */
.avatar {
  width: auto;
  min-width: 21px;
  height: 19px;
  padding: 0 5px;
  border-radius: 4px;
  font-size: 9.5px;
  letter-spacing: 0.03em;
  white-space: nowrap;

  color: var(--ink-2);
  border: 1px solid var(--line);
}
.avatar.is-sm {
  width: auto;
  min-width: 19px;
  height: 17px;
  padding: 0 4px;
  font-size: 9px;
}

/* the badge used inside a calendar card, sized to sit beside a status pill */
.namebadge {
  display: inline-flex;
  align-items: center;
  height: 14px;
  padding: 0 4px;
  border-radius: 2px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  font-family: var(--cond);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.06em;
  line-height: 1;
  white-space: nowrap;
  flex: none;
  max-width: 100%;
  overflow: hidden;
}
.block.is-done .namebadge {
  opacity: 0.6;
}

/* --------------------------------------------------------- card stacking */

/* A card reads top to bottom in a fixed order: who and what state first,
   then the work itself, then the hours it occupies pinned to the bottom
   edge, so the times line up along the foot of every card in a column. */
.block {
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 3px 6px 3px 7px;
}
.block-top {
  display: flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
  flex: none;
}
.block-title {
  flex: none;
}
.block-time {
  margin-top: auto;
  flex: none;
  padding-top: 1px;
  font-family: var(--mono);
  font-size: 9.5px;
  font-variant-numeric: tabular-nums;
  color: var(--ink-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.block.is-done .block-time {
  color: var(--ink-3);
}
/* A card with only just enough height keeps all three rows and sets them
   tighter, rather than dropping one of them. The order is the point, so it
   is the last thing to give way. */
.block.is-compact {
  padding: 2px 5px 2px 6px;
  gap: 0;
}
.block.is-compact .block-top {
  height: 12px;
}
.block.is-compact .namebadge {
  height: 12px;
  padding: 0 3px;
  font-size: 8.5px;
  letter-spacing: 0.03em;
}
.block.is-compact .spill {
  font-size: 8.5px;
  line-height: 11px;
  padding: 0 3px;
}
.block.is-compact .spill.is-todo,
.block.is-compact .spill.is-done {
  line-height: 10px;
}
.block.is-compact .block-title {
  font-size: 11px;
  line-height: 1.18;
}
.block.is-compact .block-time {
  font-size: 9px;
  padding-top: 0;
}

/* Too narrow to print the status in words: the pill becomes a marker in the
   status colour, and the words stay on the tooltip. Better than a name
   sliced off mid-word. */
.spill {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.spill.is-dot {
  width: 7px;
  min-width: 7px;

/* a card too short for rows keeps the same left-to-right order instead */
.block.is-short {
