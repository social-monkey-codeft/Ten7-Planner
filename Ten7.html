  var MAX_DAY = 20000; // the far edge of the searchable ruler, about 2074
  var MAX_OFF_SPAN = 400; // a single time-off entry cannot exceed this many days

  /* Every status takes up room on the calendar, On Hold included: pausing a
     task marks it, it does not clear the plan. Completed work is additionally
     FIXED, meaning a cascade will never move it. */
  var OCCUPIES = { todo: 1, doing: 1, hold: 1, delayed: 1, done: 1 };
  var FIXED = { done: 1 };

  /* ---------------------------------------------------------------- dates */

  function dayIndexFromYMD(y, mo, da) {
    return Math.round((Date.UTC(y, mo, da) - EPOCH_UTC) / MS_DAY);
  }

  /** "2026-09-08" -> day index */
  function dayIndexFromKey(key) {
    var p = String(key).split("-");
    return dayIndexFromYMD(+p[0], +p[1] - 1, +p[2]);
  }

  /** day index -> "2026-09-08" */
  function keyFromDayIndex(d) {
    var t = new Date(EPOCH_UTC + d * MS_DAY);
    return t.getUTCFullYear() + "-" + pad2(t.getUTCMonth() + 1) + "-" + pad2(t.getUTCDate());
  }

  /** day index -> JS weekday, 0 = Sunday */
  function weekdayFromDayIndex(d) {
    return new Date(EPOCH_UTC + d * MS_DAY).getUTCDay();
  }

  function dayIndexFromDate(dt) {
    return dayIndexFromYMD(dt.getFullYear(), dt.getMonth(), dt.getDate());
  }

  function monthOfDayIndex(d) {
    var t = new Date(EPOCH_UTC + d * MS_DAY);
    return { y: t.getUTCFullYear(), m: t.getUTCMonth() };
  }

  function pad2(n) {
    return n < 10 ? "0" + n : "" + n;
  }

  /* ----------------------------------------------------------- work clock */

  /**
   * Carve a day's outer window into the stretches that are actually bookable,
   * by removing every hole (a break, or time off) that applies to it.
   */
  function carve(start, end, holes) {
    var out = [{ start: start, end: end }];
    holes
      .slice()
      .sort(function (a, b) {
        return a.start - b.start;
      })
      .forEach(function (hole) {
        var next = [];
        out.forEach(function (seg) {
          if (hole.end <= seg.start || hole.start >= seg.end) {
            next.push(seg);
            return;
          }
          if (hole.start > seg.start) next.push({ start: seg.start, end: hole.start });
          if (hole.end < seg.end) next.push({ start: hole.end, end: seg.end });
        });
        out = next;
      });
    return out.filter(function (s) {
      return s.end > s.start;
    });
  }

  /** Which time-off entries apply to a given person (null = unassigned). */
  function timeOffFor(settings, personId) {
    return (settings.timeOff || []).filter(function (e) {
      if (!e || !e.from) return false;
      if (!e.people || !e.people.length) return true; // applies to everyone
      return personId ? e.people.indexOf(personId) !== -1 : false;
    });
  }

  /**
   * settings.days is a 7-slot array indexed by JS weekday (0 = Sunday):
   *   { on: boolean, start: minutesFromMidnight, end: minutesFromMidnight }
   * settings.breaks is a list of weekly holes:
   *   { id, name, start, end, days: [weekday, ...] }
   * settings.timeOff is a list of dated holes:
   *   { id, name, from: "YYYY-MM-DD", to, allDay, start, end, people: null | [id] }
   */
  function makeClock(settings, personId) {
    var order = [1, 2, 3, 4, 5, 6, 0]; // week positions, starting on the epoch Monday
    var i;

    /* ---- one-off working weekend dates: a dated Saturday/Sunday exception
       that turns that single date into a working day, borrowing the week's
       standard hours, while every other weekend date is untouched. */
    var overrideSet = {};
    (settings.workOverrides || []).forEach(function (ov) {
      if (ov && ov.date) overrideSet[ov.date] = true;
    });
    function overrideHours() {
      var mon = settings.days[1];
      if (mon && mon.on && mon.end > mon.start) return { start: mon.start, end: mon.end };
      for (var wd = 0; wd < 7; wd++) {
        var c = settings.days[wd];
        if (c && c.on && c.end > c.start) return { start: c.start, end: c.end };
      }
      return null;
    }

    /* ---- the repeating weekly pattern */
    var weekSegs = [];
    var weekBreaks = [];
    var weekLen = [];

    function breaksForWeekday(wd, cfg) {
      return (settings.breaks || [])
        .filter(function (br) {
          return br && br.end > br.start && (!br.days || br.days.indexOf(wd) !== -1);
        })
        .map(function (br) {
          return {
            name: br.name || "Break",
            kind: "break",
            start: Math.max(cfg.start, br.start),
            end: Math.min(cfg.end, br.end),
          };
        })
        .filter(function (br) {
          return br.end > br.start;
        });
    }

    for (i = 0; i < 7; i++) {
      var wd = order[i];
      var cfg = settings.days[wd];
      var brs = [];
      var segs = [];
      if (cfg && cfg.on && cfg.end > cfg.start) {
        brs = breaksForWeekday(wd, cfg);
        segs = carve(cfg.start, cfg.end, brs);
      }
      var acc = 0;
      segs.forEach(function (s) {
        s.off = acc;
        acc += s.end - s.start;
      });
      weekSegs.push(segs);
      weekBreaks.push(brs);
      weekLen.push(acc);
    }

    var weekCum = [0];
    for (i = 0; i < 7; i++) weekCum.push(weekCum[i] + weekLen[i]);
    var weekMinutes = weekCum[7];

    function posOf(d) {
      var week = Math.floor(d / 7);
      return { week: week, pos: d - week * 7 };
    }

    /** The day's outer window, for drawing. Null when the day is not worked. */
    function window_(d) {
      var wd2 = weekdayFromDayIndex(d);
      if (overrideSet[keyFromDayIndex(d)]) {
        var oh = overrideHours();
        if (oh) return { start: oh.start, end: oh.end, weekday: wd2, isOverride: true };
      }
      var cfg2 = settings.days[wd2];
      if (!cfg2 || !cfg2.on || cfg2.end <= cfg2.start) return null;
      return { start: cfg2.start, end: cfg2.end, weekday: wd2 };
    }

    /* ---- dated time off, as a sparse set of affected days */
    var offByDay = {};
    timeOffFor(settings, personId).forEach(function (e) {
      var d0 = dayIndexFromKey(e.from);
      var d1 = e.to ? dayIndexFromKey(e.to) : d0;
      if (d1 < d0) {
        var swap = d0;
        d0 = d1;
        d1 = swap;
      }
      if (d1 - d0 > MAX_OFF_SPAN) d1 = d0 + MAX_OFF_SPAN;
      for (var d = d0; d <= d1; d++) {
        if (!offByDay[d]) offByDay[d] = [];
        offByDay[d].push({
          id: e.id,
          name: e.name || "Time off",
          kind: "off",
          allDay: !!e.allDay,
          start: e.allDay ? 0 : e.start,
          end: e.allDay ? 1440 : e.end,
          everyone: !e.people || !e.people.length,
        });
      }
    });

    /* A one-off working weekend date needs its own exception record too,
       even when it carries no time-off entries, so it is computed from
       window_() (which now grants it hours) instead of falling back to the
       normal weekly pattern for that weekday (which is off). */
    Object.keys(overrideSet).forEach(function (key) {
      var d = dayIndexFromKey(key);
      if (!offByDay[d]) offByDay[d] = [];
    });

    /* Recompute the affected days once, and record how much bookable time was
       lost on each, so W can correct for it without walking the calendar. */
    var excDays = Object.keys(offByDay)
      .map(Number)
      .sort(function (a, b) {
        return a - b;
      });
    var exc = {};
    var lossPrefix = [0];

    excDays.forEach(function (d, idx) {
      var p = posOf(d);
      var win = window_(d);
      var segs = [];
      var offs = [];
      if (win) {
        offs = offByDay[d]
          .map(function (o) {
            return {
              id: o.id,
              name: o.name,
              kind: "off",
              allDay: o.allDay,
              everyone: o.everyone,
              start: Math.max(win.start, o.start),
              end: Math.min(win.end, o.end),
            };
          })
          .filter(function (o) {
            return o.end > o.start;
          });
        segs = carve(win.start, win.end, weekBreaks[p.pos].concat(offs));
      }
      var len = 0;
      segs.forEach(function (s) {
        s.off = len;
        len += s.end - s.start;
      });
      exc[d] = { segs: segs, len: len, off: offs };
      lossPrefix[idx + 1] = lossPrefix[idx] + (weekLen[p.pos] - len);
    });

    var totalLoss = lossPrefix[excDays.length];

    /** Bookable minutes lost to time off on days strictly before d. */
    function lossBefore(d) {
      if (!excDays.length) return 0;
      var lo = 0;
      var hi = excDays.length;
      while (lo < hi) {
        var mid = (lo + hi) >> 1;
        if (excDays[mid] < d) lo = mid + 1;
        else hi = mid;
      }
      return lossPrefix[lo];
    }

    /** The bookable stretches of a day, in order. */
    function segmentsOf(d) {
      var e = exc[d];
      return e ? e.segs : weekSegs[posOf(d).pos];
    }

    function dayLen(d) {
      var e = exc[d];
      return e ? e.len : weekLen[posOf(d).pos];
    }

    /** The weekly breaks that apply to a day, for drawing. */
    function breaksOf(d) {
      return window_(d) ? weekBreaks[posOf(d).pos] : [];
    }

    /** The dated time off that applies to a day, for drawing. */
    function timeOffOf(d) {
      var e = exc[d];
      return e ? e.off : [];
    }

    /** True when a day that would normally be worked has been emptied. */
    function isDayOff(d) {
      return !!window_(d) && dayLen(d) === 0;
    }

    /** The bookable stretch containing a minute, or null. */
    function segmentAt(d, m) {
      var list = segmentsOf(d);
      for (var k = 0; k < list.length; k++) {
        if (m >= list[k].start && m < list[k].end) return list[k];
      }
      return null;
    }

    /** W at the first bookable minute of day d. Monotonic in d. */
    function dayStartW(d) {
      var p = posOf(d);
      return p.week * weekMinutes + weekCum[p.pos] - lossBefore(d);
    }

    /** W index for (day, offset into that day's bookable minutes). */
    function wAt(d, offset) {
      return dayStartW(d) + offset;
    }

    /**
     * W index of an instant, snapped FORWARD to the next bookable minute when
     * the instant lands in dead time: after hours, a weekend, lunch, or a day
     * somebody has taken off.
     */
    function toW(inst) {
      if (weekMinutes <= 0) return null;
      var d = inst.d;
      var m = inst.m;
      for (var guard = 0; guard < MAX_OFF_SPAN + 20; guard++) {
        var list = segmentsOf(d);
        for (var k = 0; k < list.length; k++) {
          var s = list[k];
          if (m <= s.start) return wAt(d, s.off);
          if (m < s.end) return wAt(d, s.off + (m - s.start));
        }
        d += 1;
        m = -Infinity; // any later day is entered at its first bookable minute
      }
      return null;
    }

    /**
     * W index -> instant { d, m }. dayStartW is monotonic, so the day is found
     * by binary search: the one we want is the last whose start is at or before
     * w. Days with no bookable minutes have equal starts and are skipped for
     * free, because dayStartW(d + 1) - dayStartW(d) is that day's length.
     */
    function fromW(w) {
      if (weekMinutes <= 0) return null;
      var lo = 0;
      var hi = MAX_DAY;
      while (lo < hi) {
        var mid = (lo + hi) >> 1;
        if (dayStartW(mid + 1) > w) hi = mid;
        else lo = mid + 1;
      }
      var d = lo;
      var offset = w - dayStartW(d);
      var list = segmentsOf(d);
      for (var k = 0; k < list.length; k++) {
        var s = list[k];
        if (offset >= s.off && offset < s.off + (s.end - s.start)) {
          return { d: d, m: s.start + (offset - s.off) };
        }
      }
      return null;
    }

    /**
     * Expand a contiguous W range into calendar blocks, cutting at every day
     * boundary, every break and every stretch of time off. This is where
     * multi-day splitting, splitting around lunch, and stepping over a holiday
     * all come from: the task stays one task, its drawing becomes several
     * rectangles.
     */
    function expand(startW, durW) {
      var out = [];
      if (weekMinutes <= 0 || durW <= 0) return out;
      var cur = startW;
      var left = durW;
      var n = 0;
      while (left > 0 && n < MAX_SEGMENTS) {
        var inst = fromW(cur);
        if (!inst) break;
        var seg = segmentAt(inst.d, inst.m);
        if (!seg) break;
        var take = Math.min(left, seg.end - inst.m);
        out.push({
          d: inst.d,
          dateKey: keyFromDayIndex(inst.d),
          startMin: inst.m,
          endMin: inst.m + take,
          minutes: take,
        });
        cur += take;
        left -= take;
        n++;
      }
      return out;
    }

    return {
      usable: weekMinutes > 0,
      weekMinutes: weekMinutes,
      personId: personId || null,
      hasTimeOff: excDays.length > 0,
      minutesLostToTimeOff: totalLoss,
      window: window_,
      segmentsOf: segmentsOf,
      breaksOf: breaksOf,
      timeOffOf: timeOffOf,
      isDayOff: isDayOff,
      segmentAt: segmentAt,
      capacityOf: dayLen,
      toW: toW,
      wAt: wAt,
      fromW: fromW,
      expand: expand,
    };
  }

  /* ------------------------------------------------------------ intervals */

  /**
   * Earliest position at or after `from` where a run of `dur` minutes fits
   * without touching any blocked interval. Blockers are [start, end) in W.
   */
  function firstFit(from, dur, blockers) {
    var s = from;
    var bumped = true;
    var guard = 0;
    while (bumped && guard++ < blockers.length + 2) {
      bumped = false;
      for (var i = 0; i < blockers.length; i++) {
        var b = blockers[i];
        if (s < b.end && s + dur > b.start) {
          s = b.end;
          bumped = true;
        }
      }
    }
    return s;
  }

  function byStart(a, b) {
    return a.start - b.start;
  }

  /** Which timeline a task belongs to. Unassigned work is its own lane, not a
   *  shared free-for-all, so two unassigned tasks still conflict. */
  function laneKey(task) {
    return task.assigneeId || "_none";
  }

  /* ------------------------------------------------------------- resolver */

  /**
   * The core. Takes the full task list plus settings and returns a schedule in
   * which no two of one person's tasks overlap, nothing sits outside bookable
   * time, and the task named by `pinnedId` keeps the slot it was just given.
   *
   * Rules, in order of authority:
   *   1. Completed tasks never move. They already happened.
   *   2. The pinned task gets the slot it asked for, only sliding forward if
   *      a completed task is already sitting there.
   *   3. Everything else is swept in start-time order and pushed forward far
   *      enough to clear what came before it. A task with clear air in front
   *      of it keeps its slot, so gaps in the day survive.
   *
   * Each rule applies within one person's timeline, against that person's own
   * clock, so their days off shift only their own work.
   */
  function resolve(tasks, settings, opts) {
    opts = opts || {};
    var clocks = {};

    function clockFor(personId) {
      var k = personId || "_none";
      if (!clocks[k]) clocks[k] = makeClock(settings, personId || null);
      return clocks[k];
    }

    var base = clockFor(null);
    var result = {
      usable: base.usable,
      clock: base,
      clockFor: clockFor,
      placements: {},
      moved: [],
      unscheduled: [],
      inactive: [],
      blocked: [],
      dependencyIssues: [],
    };
    if (!base.usable) return result;

    var pinnedId = opts.pinnedId || null;
    var notBefore = opts.notBefore || {};
    /* Some callers have already resolved a set of calendar commitments and
       need to keep them exactly where they landed while placing later work.
       This is used by dependency chains: an existing booking is never moved
       aside just because a successor has become ready. */
    var fixedIds = opts.fixedIds || {};
    var lanes = {};
    var i;

    for (i = 0; i < tasks.length; i++) {
      var t = tasks[i];
      var dur = Math.max(15, Math.round(t.durationMin || 60));
      if (!OCCUPIES[t.status || "todo"]) {
        result.inactive.push(t.id);
        continue;
      }
      if (!t.startDate) {
        result.unscheduled.push(t.id);
        continue;
      }
      var clock = clockFor(t.assigneeId);
      var w = clock.toW({ d: dayIndexFromKey(t.startDate), m: t.startMin || 0 });
      if (w === null) {
        result.unscheduled.push(t.id);
        continue;
      }
      /* A predecessor's finish is an earliest-start boundary.  It is supplied
         in this task's own work-clock, so dependencies can cross assignees
         with different hours and time off. */
      if (!FIXED[t.status] && !t.locked && notBefore[t.id] != null) w = Math.max(w, notBefore[t.id]);
      var key = laneKey(t);
      if (!lanes[key]) lanes[key] = { clock: clock, items: [] };
      lanes[key].items.push({ id: t.id, w0: w, dur: dur, task: t, fixed: !!fixedIds[t.id] });
    }

    Object.keys(lanes).forEach(function (key) {
      resolveLane(lanes[key].items, pinnedId, lanes[key].clock, result);
    });

    return result;
  }

  /**
   * Resolve ordinary calendar conflicts, then repeatedly introduce the end
   * of each prerequisite as a floor for its successor.
   *
   * Tasks without prerequisites are resolved first. Their derived slots then
   * become fixed commitments while dependent work is placed. This matters when
   * a chain becomes ready in an occupied slot: the prior booking keeps its
   * time and the chain moves forward to the next available bookable minute.
   * A dependency is thus an absolute earliest-start constraint, but never a
   * licence to displace work that was already assigned.
   */
  function resolveWithDependencies(tasks, settings, opts) {
    opts = opts || {};
    var byId = {};
    tasks.forEach(function (t) { byId[t.id] = t; });

    var blocked = {};
    var issues = [];
    function depsOf(t) {
      return Array.isArray(t.dependsOn) ? t.dependsOn.filter(function (id) {
        return id && id !== t.id && byId[id];
      }) : [];
    }
    /* A hold pauses every downstream task, not merely the immediate child. */
    function isBlocked(t, trail) {
      if (blocked[t.id]) return true;
      trail = trail || {};
      if (trail[t.id]) { issues.push(t.id); return false; }
      trail[t.id] = true;
      var deps = depsOf(t);
      for (var i = 0; i < deps.length; i++) {
        var parent = byId[deps[i]];
        if (parent.status === "hold" || isBlocked(parent, trail)) {
          blocked[t.id] = true;
          delete trail[t.id];
          return true;
        }
      }
      delete trail[t.id];
      return false;
    }
    tasks.forEach(function (t) { isBlocked(t); });

    var dependent = {};
    tasks.forEach(function (t) {
      if (depsOf(t).length) dependent[t.id] = true;
    });

    /* First settle the work that is already independently scheduled. It is
       intentionally resolved without dependents: a chain must fit around
       existing work, not push that work out of the way. */
    var roots = tasks.filter(function (t) { return !dependent[t.id]; });
    var rootResult = resolve(roots, settings, {
      pinnedId: dependent[opts.pinnedId] ? null : (opts.pinnedId || null),
    });
    var fixedIds = {};
    var working = tasks.map(function (t) {
      var c = {};
      var k;
      for (k in t) c[k] = t[k];
      if (!dependent[t.id]) {
        fixedIds[t.id] = true;
        var placed = rootResult.placements[t.id];
        if (placed) {
          c.startDate = placed.startDate;
          c.startMin = placed.startMin;
        }
      }
      return c;
    });

    var floors = {};
    var result;
    for (var pass = 0; pass < tasks.length + 1; pass++) {
      result = resolve(working, settings, {
        /* A freshly created or dragged dependent still has to respect the
           commitments above, so it cannot use pin priority to displace them. */
        pinnedId: dependent[opts.pinnedId] ? null : (opts.pinnedId || null),
        notBefore: floors,
        fixedIds: fixedIds,
      });
      var next = {};
      var changed = false;
      working.forEach(function (t) {
        if (blocked[t.id] || !result.placements[t.id] || FIXED[t.status] || t.locked) return;
        depsOf(t).forEach(function (parentId) {
          var parent = byId[parentId];
          var pp = result.placements[parentId];
          if (!pp || blocked[parentId]) return;
          var floor = result.clockFor(t.assigneeId).toW({
            d: dayIndexFromKey(pp.endDate), m: pp.endMin,
          });
          if (floor != null && (next[t.id] == null || floor > next[t.id])) next[t.id] = floor;
        });
      });
      Object.keys(next).forEach(function (id) {
        if (floors[id] !== next[id]) changed = true;
      });
      floors = next;
      if (!changed) break;
    }
    result.blocked = Object.keys(blocked);
    result.dependencyIssues = issues.filter(function (id, i, a) { return a.indexOf(id) === i; });
    return result;
  }

  function resolveLane(items, pinnedId, clock, result) {
    var i;
    function isFixed(item) {
      return !!FIXED[item.task.status] || !!item.task.locked || !!item.fixed;
    }

    // 1. Completed work is immovable, and becomes the hard floor everything
    //    else works around. It only shifts to repair a collision with other
    //    completed work, which normal use cannot produce but a settings change
    //    can: shorten a day, or book a holiday over it.
    var blockers = [];
    var fixedItems = items
      .filter(function (x) {
        return isFixed(x);
      })
      .sort(function (a, b) {
        if (a.w0 !== b.w0) return a.w0 - b.w0;
        return (a.task.createdAt || 0) - (b.task.createdAt || 0);
      });
    for (i = 0; i < fixedItems.length; i++) {
      /* A user lock is an explicit scheduler override against ordinary
         movable work — but not against another fixed booking for the same
         person. Two commitments can never occupy the same person's same
         minute, locked or not, so the later one (by start time, then by
         creation order) is bumped to right after the earlier one ends. */
      fixedItems[i].w = firstFit(fixedItems[i].w0, fixedItems[i].dur, blockers);
      blockers.push({ start: fixedItems[i].w, end: fixedItems[i].w + fixedItems[i].dur });
      blockers.sort(byStart);
    }

    // 2. The pin wins over everything that can still move.
    var pinned = null;
    for (i = 0; i < items.length; i++) {
      if (items[i].id === pinnedId && !isFixed(items[i])) {
        pinned = items[i];
        break;
      }
    }
    if (pinned) {
      pinned.w = firstFit(pinned.w0, pinned.dur, blockers);
      blockers.push({ start: pinned.w, end: pinned.w + pinned.dur });
      blockers.sort(byStart);
    }

    // 3. Sweep the rest forward.
    var movable = items.filter(function (x) {
      return !isFixed(x) && x !== pinned;
    });
    movable.sort(function (a, b) {
      if (a.w0 !== b.w0) return a.w0 - b.w0;
      var ca = a.task.createdAt || 0;
      var cb = b.task.createdAt || 0;
      if (ca !== cb) return ca - cb;
      return a.id < b.id ? -1 : 1;
    });

    var cursor = -Infinity;
    for (i = 0; i < movable.length; i++) {
      var x = movable[i];
      var s = Math.max(x.w0, cursor);
      s = firstFit(s, x.dur, blockers);
      x.w = s;
      cursor = s + x.dur;
    }

    // Report.
    for (i = 0; i < items.length; i++) {
      var it = items[i];

        projectFilter: projIds[ui.projectFilter] ? ui.projectFilter : null,
        personFilter: peopleIds[ui.personFilter] ? ui.personFilter : null,
        search: typeof ui.search === "string" ? ui.search : "",
        collapsed: (function () {
          var c = ui.collapsed && typeof ui.collapsed === "object" ? ui.collapsed : {};
          if (!("completed" in c)) c.completed = true;
          return c;
        })(),
      },
    };
  }

  /* -------------------------------------------------------- change history */

  /**
   * Every action that changes the data appends an entry here, newest first,
   * each carrying a complete copy of the data as it stood immediately after
   * that action. Restoring an entry therefore means putting that copy back,
   * which is why an arbitrary point in the past can be returned to rather
   * than only the last step.
   *
   * The log itself is never inside a snapshot, so restoring cannot swallow
   * the history that got you there: the restore is appended as one more
   * entry, and can itself be undone by restoring what came before it.
   */
  function normalizeLog(v) {
    if (!Array.isArray(v)) return [];
    return v
      .filter(function (e) {
        return e && e.at && typeof e.label === "string";
      })
      .map(function (e) {
        return {
          id: e.id || uid("lg"),
          at: e.at,
          label: e.label,
          detail: typeof e.detail === "string" ? e.detail : "",
          snapshot: e.snapshot && typeof e.snapshot === "object" ? e.snapshot : null,
          trimmed: !!e.trimmed,
        };
      })
      .slice(0, LOG_MAX);
  }

  function normalizeTaskActivity(v, createdAt) {
    var list = Array.isArray(v)
      ? v
          .filter(function (e) { return e && e.at && typeof e.action === "string"; })
          .map(function (e) { return { at: e.at, action: e.action }; })
      : [];
    if (!list.length && createdAt) {
      list.push({ at: createdAt > 946684800000 ? createdAt : Date.now(), action: "Task created" });
    }
    return list.sort(function (a, b) { return b.at - a.at; }).slice(0, 200);
  }

  function logTaskActivity(task, action, at) {
    if (!task || !action) return;
    if (!Array.isArray(task.activity)) task.activity = [];
    task.activity.unshift({ at: at || Date.now(), action: action });
    if (task.activity.length > 200) task.activity.length = 200;
  }

  function dataSnapshot() {
    return JSON.parse(
      JSON.stringify({
        version: state.version,
        projects: state.projects,
        people: state.people,
        tasks: state.tasks,
        settings: state.settings,
      })
    );
  }

  /** Append one entry. Call it after the change, never before. */
  var undoCursor = 0;
  function record(label, detail) {
    if (!state) return;
    undoCursor = 0;
    if (!Array.isArray(state.log)) state.log = [];
    state.log.unshift({
      id: uid("lg"),
      at: Date.now(),
      label: label,
      detail: detail || "",
      snapshot: dataSnapshot(),
      trimmed: false,
    });
    pruneLog();
  }

  /**
   * Keep the newest entries restorable and let the oldest give up their
   * snapshots when the budget runs out, rather than dropping the entries
   * themselves. What happened is worth remembering even once going back to
   * it is no longer on offer.
   */
  function pruneLog() {
    if (!Array.isArray(state.log)) return;
    if (state.log.length > LOG_MAX) state.log.length = LOG_MAX;
    var used = 0;
    for (var i = 0; i < state.log.length; i++) {
      var e = state.log[i];
      if (!e.snapshot) continue;
      var size = JSON.stringify(e.snapshot).length;
      if (used + size > LOG_BUDGET) {
        e.snapshot = null;
        e.trimmed = true;
      } else {
        used += size;
      }
    }
  }

  function logStamp(at) {
    var d = new Date(at);
    return E.fmtClock(d.getHours() * 60 + d.getMinutes());
  }

  function logDayLabel(at) {
    var d = new Date(at);
    var key = E.keyFromDayIndex(E.dayIndexFromDate(d));
    var today = todayKey();
    if (key === today) return "Today";
    if (key === E.keyFromDayIndex(E.dayIndexFromKey(today) - 1)) return "Yesterday";
    return DOW[d.getDay()] + " " + shortDate(key) + " " + d.getFullYear();
  }

  var warnedFull = false;

  function save() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      saveTimer = null;
      pruneLog();
      /* the live record first, then the backups on their own longer clocks */
      scheduleBackups();
      Store.save(state).then(function (ok) {
        if (ok) return;
        /* Storage is full. The change history is the only part that can be given
           up without losing anything the user typed, so it goes first. */
        var kept = 0;
        (state.log || []).forEach(function (e) {
          if (e.snapshot && kept < 10) {
            kept++;
            return;
          }
          if (e.snapshot) {
            e.snapshot = null;
            e.trimmed = true;
          }
        });
        Store.save(state).then(function (ok2) {
          if (ok2 || warnedFull) return;
          warnedFull = true;
          toast("This browser is out of storage, so the schedule is not being saved");
        });
      });
    }, 180);
  }

  /* ------------------------------------------------------------ scheduling */

  /**
   * The stored startDate and startMin are the user's INTENT, not the
   * scheduler's last output. Nothing but an explicit action writes them.
   *
   * That distinction is what makes displacement reversible. Add a holiday and
   * the derived positions shift around it; delete the holiday and they derive
   * straight back, because the intent never changed. The same goes for a
   * cascade: remove whatever pushed a task and it returns.
   *
   * Intent settles when you act on a task. Dragging sets it outright; resizing
   * or editing accepts wherever the task currently sits first, so you are
   * changing the thing you can see. Marking a task complete freezes it, since
   * finished work records when it actually happened.
   */
  function snapshotPositions() {
    var m = {};
    if (!sched) return m;
    state.tasks.forEach(function (t) {
      var p = sched.placements[t.id];
      m[t.id] = p ? p.w : null;
    });
    return m;
  }

  function recompute(pinnedId) {
    /* The engine still resolves one timeline at a time. A shared task is fed
       to every additional person's timeline as a fixed booking at the shared
       slot. A short convergence pass handles different personal time off and
       branching conflicts without creating another stored task record. */
    var working = state.tasks.map(function (task) {
      var c = JSON.parse(JSON.stringify(task));
      c.assigneeId = primaryAssigneeId(task);
      return c;
    });
    var result = E.resolve(working, state.settings, { pinnedId: pinnedId || null });
    for (var pass = 0; pass < Math.min(12, state.tasks.length + 2); pass++) {
      var augmented = working.slice();
      state.tasks.forEach(function (source) {
        var ids = taskAssigneeIds(source);
        var main = result.placements[source.id];
        if (ids.length < 2 || !main) return;
        for (var i = 1; i < ids.length; i++) {
          augmented.push({
            id: jointGhostId(source.id, ids[i]),
            name: source.name,
            projectId: source.projectId,
            assigneeId: ids[i],
            durationMin: source.durationMin,
            startDate: main.startDate,
            startMin: main.startMin,
            status: source.status,
            dependsOn: [],
            createdAt: source.createdAt,
            locked: !!source.locked || source.id === pinnedId,
          });
        }
      });
      var next = E.resolve(augmented, state.settings, { pinnedId: pinnedId || null });
      var changed = false;
      state.tasks.forEach(function (source) {
        var ids = taskAssigneeIds(source);
        if (ids.length < 2) return;
        var latest = next.placements[source.id];
        for (var i = 1; i < ids.length; i++) {
          var gp = next.placements[jointGhostId(source.id, ids[i])];
          if (placementStamp(gp) > placementStamp(latest)) latest = gp;
        }
        var wc = working.filter(function (x) { return x.id === source.id; })[0];
        if (latest && wc && (wc.startDate !== latest.startDate || wc.startMin !== latest.startMin)) {
          wc.startDate = latest.startDate;
          wc.startMin = latest.startMin;
          changed = true;
        }
      });
      result = next;
      if (!changed) break;
    }
    /* Only real task ids are exposed to the application. */
    Object.keys(result.placements).forEach(function (id) {
      if (id.indexOf("__joint__") === 0) delete result.placements[id];
    });
    result.moved = (result.moved || []).filter(function (m) { return m.id.indexOf("__joint__") !== 0; });
    /* A locked task never recalculates again: it always reasserts the exact
       slot it held the moment it was locked. This can never reintroduce a
       same-person overlap, because that snapshot is only ever taken from the
       engine's own already-collision-free output (toggleTaskLock reads
       sched.placements), and a locked task's raw start/duration cannot change
       again — placeTask and resizeTask both refuse while locked. */
    state.tasks.forEach(function (task) {
      if (task.locked && task.lockedPlacement) {
        result.placements[task.id] = JSON.parse(JSON.stringify(task.lockedPlacement));
      }
    });
    sched = result;
  }

  function jointGhostId(taskId, personId) {
    return "__joint__" + taskId + "__" + personId;
  }

  function placementStamp(p) {
    return p ? E.dayIndexFromKey(p.startDate) * 1440 + p.startMin : -Infinity;
  }

  /** Where a task sits right now: its derived position, or its intent. */
  function currentSlot(t) {
    var p = sched && sched.placements[t.id];
    if (p) return { startDate: p.startDate, startMin: p.startMin };
    return { startDate: t.startDate, startMin: t.startMin };
  }

  /** Settle a task's intent at wherever it currently sits. */
  function acceptCurrent(t) {
    var slot = currentSlot(t);
    if (slot.startDate) {
      t.startDate = slot.startDate;
      t.startMin = slot.startMin;
    }
  }

  /** The task list as it actually stands, for anything that reasons about
   *  occupied time rather than intent. */
  function effectiveTasks() {
    return state.tasks.map(function (t) {
      var p = sched && sched.placements[t.id];
      var c = {};
      for (var k in t) c[k] = t[k];
      c.assigneeId = primaryAssigneeId(t);
      if (p) {
        c.startDate = p.startDate;
        c.startMin = p.startMin;
      }
      return c;
    });
  }

  /**
   * Apply a change, resolve conflicts, report what the scheduler moved, and
   * put the result in the change history. `log` is the label the entry carries,
   * optionally "Label|the detail line". Pass nothing for a change that is
   * not worth a version of its own.
   */
  function commit(pinnedId, note, log) {
    if (log) {
      var parts = String(log).split("|");
      record(parts[0], parts[1] || "");
    }
    var before = snapshotPositions();
    var beforeSlots = {};
    if (sched) {
      state.tasks.forEach(function (task) {
        var placement = sched.placements[task.id];
        if (placement) beforeSlots[task.id] = { startDate: placement.startDate, startMin: placement.startMin };
      });
    }
    recompute(pinnedId);
    var automaticChanges = syncAutomaticDelayedStatuses();
    if (automaticChanges) {
      recompute(pinnedId);
      record(
        "Automatic Status Update",
        automaticChanges + (automaticChanges === 1 ? " task changed" : " tasks changed")
      );
    }
    var moved = 0;
    var returned = 0;
    state.tasks.forEach(function (t) {
      if (t.id === pinnedId) return;
      var was = before[t.id];
      var p = sched.placements[t.id];
      var now = p ? p.w : null;
      if (was == null || now == null || was === now) return;
      if (now > was) moved++;
      else returned++;
      var oldSlot = beforeSlots[t.id];
      if (oldSlot && p) {
        logTaskActivity(
          t,
          "Scheduler moved task from " + oldSlot.startDate + " " + E.fmtClock(oldSlot.startMin) +
            " to " + p.startDate + " " + E.fmtClock(p.startMin)
        );
      }
    });
    if (moved || returned) {
      var bits = [];
      if (moved) bits.push(moved + (moved === 1 ? " task moved on" : " tasks moved on"));
      if (returned)
        bits.push(returned + (returned === 1 ? " task moved back" : " tasks moved back"));
      toast(bits.join(" and ") + " to keep the day clear");
    } else if (note) {
      toast(note);
    }
    save();
    render();
  }

  function placeTask(id, dateKey, min) {
    var t = taskById(id);
    if (!t) return;
    if (t.locked) {
      toast("Unlock this task before changing its time");
      return;
    }
    var old = currentSlot(t);
    t.startDate = dateKey;
    t.startMin = min;
    logTaskActivity(
      t,
      (old.startDate
        ? "Schedule changed from " + old.startDate + " " + E.fmtClock(old.startMin) + " to "
        : "Scheduled for ") + dateKey + " " + E.fmtClock(min)
    );
    commit(
      id,
      null,
      "Task Moved|" +
        t.name +
        " to " +
        DOW[E.weekdayFromDayIndex(E.dayIndexFromKey(dateKey))] +
        " " +
        shortDate(dateKey) +
        ", " +
        E.fmtClock(min)
    );
  }

  function resizeTask(id, durationMin) {
    var t = taskById(id);
    if (!t) return;
    if (t.locked) {
      toast("Unlock this task before changing its duration");
      return;
    }
    var was = t.durationMin;
    acceptCurrent(t);
    t.durationMin = Math.max(15, durationMin);
    logTaskActivity(t, "Duration changed from " + E.fmtDuration(was) + " to " + E.fmtDuration(t.durationMin));
    commit(
      id,
      null,
      "Duration Changed|" +
        t.name +
        ", " +
        E.fmtDuration(was) +
        " to " +
        E.fmtDuration(t.durationMin)
    );
  }

  function unscheduleTask(id) {
    var t = taskById(id);
    if (!t) return;
    if (t.locked) {
      toast("Unlock this task before removing its fixed time");
      return;
    }
    var old = currentSlot(t);
    t.startDate = null;
    t.startMin = null;
    logTaskActivity(
      t,
      "Unscheduled from " + (old.startDate || "calendar") + (old.startMin == null ? "" : " " + E.fmtClock(old.startMin))
    );
    commit(null, "Moved to unscheduled", "Task Unscheduled|" + t.name);
  }

  function setStatus(id, status) {
    var t = taskById(id);
    if (!t || !STATUS[status] || t.status === status) return;
    if (status === "doing") {
      var waitingOn = unfinishedPrerequisiteNames(t.dependsOn);
      if (waitingOn.length) {
        toast(
          "Cannot start " +
            t.name +
            " until " +
            waitingOn.join(", ") +
            (waitingOn.length === 1 ? " is completed" : " are completed")
        );
        return;
      }
    }
    var was = STATUS[t.status].label;
    /* completed work is a record of when it happened, so freeze it in place */
    if (status === "done") acceptCurrent(t);
    t.status = status;
    t.autoDelayed = false;
    t.delayedFrom = null;
    logTaskActivity(
      t,
      (status === "done" ? "Completed" : "Status changed") + " — " + was + " to " + STATUS[status].label
    );
    commit(
      null,
      STATUS[status].label,
      "Status Changed|" + t.name + ", " + was + " to " + STATUS[status].label
    );
  }

  function fillSchedule() {
    var ids = visibleTasks()
      .filter(function (t) {
        return !t.startDate && t.status !== "done";
      })
      .sort(function (a, b) {
        if (!!a.deadline !== !!b.deadline) return a.deadline ? -1 : 1;
        if (a.deadline && b.deadline && a.deadline !== b.deadline)
          return a.deadline < b.deadline ? -1 : 1;
        return (a.createdAt || 0) - (b.createdAt || 0);
      })
      .map(function (t) {
        return t.id;
      });
    if (!ids.length) {
      toast("Nothing waiting in the unscheduled list");
      return;
    }
    var now = new Date();
    var patch = E.fillGaps(effectiveTasks(), state.settings, ids, {
      d: E.dayIndexFromDate(now),
      m: now.getHours() * 60 + now.getMinutes(),
    });
    var count = 0;
    state.tasks.forEach(function (t) {
      if (patch[t.id]) {
        t.startDate = patch[t.id].startDate;
        t.startMin = patch[t.id].startMin;
        count++;
      }
    });
    commit(
      null,
      count + (count === 1 ? " task scheduled" : " tasks scheduled"),
      "Unscheduled Work Filled In|" +
        count +
        (count === 1 ? " task placed" : " tasks placed") +
        " in the earliest free time"
    );
  }

  /* ---------------------------------------------------------------- lookup */

  function taskById(id) {
    for (var i = 0; i < state.tasks.length; i++) {
      if (state.tasks[i].id === id) return state.tasks[i];
    }
    return null;
  }

  function taskAssigneeIds(task) {
    if (!task) return [];
    var raw = Array.isArray(task.assigneeIds)
      ? task.assigneeIds
      : task.assigneeId
      ? [task.assigneeId]
      : [];
    var seen = {};
    return raw.filter(function (id) {
      if (!id || seen[id] || !state.people.some(function (p) { return p.id === id; })) return false;
      seen[id] = true;
      return true;
    });
  }

  function primaryAssigneeId(task) {
    return taskAssigneeIds(task)[0] || null;
  }

  function taskAssignedTo(task, personId) {
    return taskAssigneeIds(task).indexOf(personId) !== -1;
  }

  function assigneeLabel(task) {
    var ids = taskAssigneeIds(task);
    return ids.length
      ? ids.map(function (id) { return personById(id).name; }).join(", ")
      : "Unassigned";
  }

  function sameIds(a, b) {
    var aa = (a || []).slice().sort();
    var bb = (b || []).slice().sort();
    return aa.length === bb.length && aa.every(function (id, i) { return id === bb[i]; });
  }

  function dependencyNames(task) {
    return (task.dependsOn || [])
      .map(function (id) {
        var parent = taskById(id);
        return parent ? parent.name : null;
      })
      .filter(Boolean);
  }

  /** A calendar slot can be planned in advance, but a dependent task cannot
     * be taken up until each selected prerequisite is actually complete. */
  function unfinishedPrerequisiteNames(ids) {
    return (ids || [])
      .map(function (id) {
        var parent = taskById(id);
        return parent && parent.status !== "done" ? parent.name : null;
      })
      .filter(Boolean);
  }

  /* A dependency points from a task to its prerequisite.  Starting at each
     proposed prerequisite, reaching the task being edited would close a loop. */
  function wouldCreateDependencyCycle(taskId, dependsOn) {
    if (!taskId) return false;
    var visiting = {};
    function reachesTask(id) {
      if (id === taskId) return true;
      if (visiting[id]) return false;
      visiting[id] = true;
      var task = taskById(id);
      var deps = task ? task.dependsOn || [] : [];
      for (var i = 0; i < deps.length; i++) {
        if (reachesTask(deps[i])) return true;
      }
      return false;
    }
    for (var i = 0; i < dependsOn.length; i++) {
      visiting = {};
      if (reachesTask(dependsOn[i])) return true;
    }
    return false;
  }

  function projectById(id) {
    for (var i = 0; i < state.projects.length; i++) {
      if (state.projects[i].id === id) return state.projects[i];
    }
    return { id: "none", name: "No project", color: 1 };
  }

  function personById(id) {
    for (var i = 0; i < state.people.length; i++) {
      if (state.people[i].id === id) return state.people[i];
    }
    return { id: null, name: "Unassigned", color: 0 };
  }

  /**
   * The badge shown wherever a person has to fit in a very small space: the
   * first three characters of their name rather than a single initial, which
   * is enough to tell DIW from DIV at a glance. Shorter names simply give
   * back what they have. Set in capitals, so a badge reads as a marker rather
   * than as a truncated word.
   */
  function initials(name) {
    var s = String(name == null ? "" : name)
      .replace(/\s+/g, " ")
      .trim()
      .slice(0, 3)
      .trim();
    return s ? s.toUpperCase() : "?";
  }

  /* Both lists in the left pane read alphabetically, so a name is found by
     where it should be rather than by when it was added. Sorted for display
     only: the stored order is left alone, and the scheduler never cared
     about it. */
  function byName(a, b) {
    return String(a.name).localeCompare(String(b.name), undefined, {
      sensitivity: "base",
      numeric: true,
    });
  }

  function sortedProjects() {
    return state.projects.slice().sort(byName);
  }

  function sortedPeople() {
    return state.people.slice().sort(byName);
  }

  function weekStart(dayIndex) {
    var wd = E.weekdayFromDayIndex(dayIndex);
    return dayIndex - ((wd + 6) % 7); // back to Monday
  }

  function visibleDays() {
    var anchor = E.dayIndexFromKey(state.ui.anchor);
    if (state.ui.view === "day") return [anchor];
    var start = weekStart(anchor);
    var out = [];
    for (var i = 0; i < 7; i++) out.push(start + i);
    return out;
  }

  function monthDays() {
    var anchor = E.dayIndexFromKey(state.ui.anchor);
    var mo = E.monthOfDayIndex(anchor);
    var firstOfMonth = E.dayIndexFromKey(
      mo.y + "-" + E.pad2(mo.m + 1) + "-01"
    );
    var start = weekStart(firstOfMonth);
    var out = [];
    for (var i = 0; i < 42; i++) out.push(start + i);
    /* trim a trailing all-next-month week */
    while (out.length > 35 && E.monthOfDayIndex(out[35]).m !== mo.m) out.length = 35;
    return { days: out, month: mo };
  }

  /** The vertical extent of the grid: the union of every enabled day's window. */
  function gridRange() {
    var lo = null;
    var hi = null;
    state.settings.days.forEach(function (d) {
      if (!d.on || d.end <= d.start) return;
      lo = lo === null ? d.start : Math.min(lo, d.start);
      hi = hi === null ? d.end : Math.max(hi, d.end);
    });
    if (lo === null) {
      lo = 600;
      hi = 1140;
    }
    return { start: lo, end: hi };
  }

  function isLate(t) {
    if (!t.deadline || t.status === "done") return false;
    var p = sched && sched.placements[t.id];
    /* unscheduled work is late once its deadline has simply gone by */
    if (!p) return t.deadline < todayKey();
    return p.endDate > t.deadline;
  }

  function localDateTime(key, minute, endOfDay) {
    if (!key) return null;
    var p = key.split("-");
    if (p.length !== 3) return null;
    var m = endOfDay ? 1439 : Math.max(0, minute == null ? 0 : minute);
    return new Date(+p[0], +p[1] - 1, +p[2], Math.floor(m / 60), m % 60, endOfDay ? 59 : 0, endOfDay ? 999 : 0);
  }

  function taskIsPast(t, now) {
    if (!t || t.status === "done") return false;
    now = now || new Date();
    var pl = sched && sched.placements[t.id];
    var endPassed = !!(pl && pl.endDate && localDateTime(pl.endDate, pl.endMin, false) < now);
    var deadlinePassed = !!(t.deadline && localDateTime(t.deadline, null, true) < now);
    return endPassed || deadlinePassed;
  }

  function syncAutomaticDelayedStatuses() {
    var changed = 0;
    var now = new Date();
    state.tasks.forEach(function (t) {
      if (t.status === "done") {
        t.autoDelayed = false;
        t.delayedFrom = null;
        return;
      }
      var overdue = taskIsPast(t, now);
      if (overdue && t.status !== "delayed") {
        var before = t.status;
        t.delayedFrom = before;
        t.autoDelayed = true;
        t.status = "delayed";
        logTaskActivity(t, "Automatically marked DELAYED from " + STATUS[before].label + " because its end time or deadline passed");
        changed++;
      } else if (!overdue && t.status === "delayed" && t.autoDelayed) {
        var restore = STATUS[t.delayedFrom] && t.delayedFrom !== "delayed" && t.delayedFrom !== "done"
          ? t.delayedFrom
          : "todo";
        if (restore === "doing" && unfinishedPrerequisiteNames(t.dependsOn).length) restore = "todo";
        t.status = restore;
        t.autoDelayed = false;
        t.delayedFrom = null;
        logTaskActivity(t, "Automatically restored to " + STATUS[restore].label + " after its end time and deadline moved into the future");
        changed++;
      }
    });
    return changed;
  }

  function taskSearchText(t) {
    var holder = document.createElement("div");
    (t.notes || []).forEach(function (n) { holder.innerHTML += " " + sanitizeNote(n.html || ""); });
    return (t.name + " " + holder.textContent).toLowerCase();
  }

  function matchesFilter(t) {
    if (state.ui.projectFilter && t.projectId !== state.ui.projectFilter) return false;
    if (state.ui.personFilter && !taskAssignedTo(t, state.ui.personFilter)) return false;
    var query = String(state.ui.search || "").trim().toLowerCase();
    if (query && taskSearchText(t).indexOf(query) === -1) return false;
    return true;
  }

  function filterActive() {
    return !!(state.ui.projectFilter || state.ui.personFilter || String(state.ui.search || "").trim());
  }

  function visibleTasks() {
    return state.tasks.filter(matchesFilter);
  }

  /** Booked minutes on a day, honouring the active filters. */
  function bookedMinutes(dayIndex) {
    var key = E.keyFromDayIndex(dayIndex);
    var total = 0;
    if (!sched) return 0;
    visibleTasks().forEach(function (t) {
      var p = sched.placements[t.id];
      if (!p) return;
      p.blocks.forEach(function (b) {
        if (b.dateKey === key) total += b.minutes;
      });
    });
    return total;
  }

  /** How many people have work on a day, so the load bar has a fair ceiling. */
  function lanesOnDay(dayIndex) {
    var key = E.keyFromDayIndex(dayIndex);
    var seen = {};
    var count = 0;
    visibleTasks().forEach(function (t) {
      var p = sched.placements[t.id];
      if (!p) return;
      var on = p.blocks.some(function (b) {
        return b.dateKey === key;
      });
      if (!on) return;
      var keys = taskAssigneeIds(t);
      if (!keys.length) keys = ["_none"];
      keys.forEach(function (k) {
        if (!seen[k]) {
          seen[k] = true;
          count++;
        }
      });
    });
    return Math.max(1, count);
  }

  /** Minutes booked in the visible range, grouped by a key function. */
  /** Time-off entries covering a day, as stored (ISO date strings compare). */
  function timeOffOnDay(dayIndex) {
    var key = E.keyFromDayIndex(dayIndex);
    return (state.settings.timeOff || []).filter(function (e) {
      return key >= e.from && key <= (e.to || e.from);
    });
  }

  function whoLabel(entry) {
    if (!entry.people || !entry.people.length) return "Everyone";
    return entry.people
      .map(function (id) {
        return personById(id).name;
      })
      .join(", ");
  }

  function offSummary(entry) {
    var span =
      entry.from === entry.to
        ? shortDate(entry.from)
        : shortDate(entry.from) + " to " + shortDate(entry.to);
    var when = entry.allDay
      ? "all day"
      : E.fmtClock(entry.start) + " to " + E.fmtClock(entry.end);
    return span + ", " + when;
  }

  function shortDate(key) {
    var p = String(key).split("-");
    return +p[2] + " " + MONTH[+p[1] - 1].slice(0, 3);
  }

  /** The clock the calendar should be drawn against, given the active filter. */
  function viewClock() {
    return sched.clockFor ? sched.clockFor(state.ui.personFilter) : sched.clock;
  }

  function loadBy(keyFn) {
    var days = state.ui.view === "month" ? monthDays().days : visibleDays();
    var inRange = {};
    days.forEach(function (d) {
      inRange[E.keyFromDayIndex(d)] = true;
    });
    var out = {};
    visibleTasks().forEach(function (t) {
      var p = sched.placements[t.id];
      if (!p) return;
      var mins = 0;
      p.blocks.forEach(function (b) {
        if (inRange[b.dateKey]) mins += b.minutes;
      });
      if (!mins) return;
      var keys = keyFn(t);
      if (!Array.isArray(keys)) keys = [keys];
      keys.forEach(function (k) {
        if (k == null) return;
        out[k] = (out[k] || 0) + mins;
      });
    });
    return out;
  }

  /* ------------------------------------------------------------------- dom */

  function h(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (Array.isArray(attrs) || typeof attrs === "string") {
      kids = attrs;
      attrs = null;
    }
    if (attrs) {
      for (var k in attrs) {
        var v = attrs[k];
        if (v == null || v === false) continue;
        if (k === "class") e.className = v;
        else if (k === "text") e.textContent = v;
        else if (k === "style") e.setAttribute("style", v);
        else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), v);
        else e.setAttribute(k, v === true ? "" : String(v));
      }
    }
    if (kids != null) {
      (Array.isArray(kids) ? kids : [kids]).forEach(function (c) {
        if (c == null || c === false) return;
        e.appendChild(typeof c === "object" ? c : document.createTextNode(String(c)));
      });
    }
    return e;
  }

  function $(sel) {
    return document.querySelector(sel);
  }

  /* ------------------------------------------------------------- colours */

  /* A project colour is either one of the eight built-in palette slots (1 to 8)
     or a custom hex string. Palette slots have hand-tuned tints per theme; a
     custom hex derives its tint as a translucent wash of itself, which
     composites correctly on both the light and the dark ground. */

  var HEX_RE = /^#[0-9a-fA-F]{6}$/;

  function normalizeHex(v) {
    var s = String(v || "").trim();
    if (s && s.charAt(0) !== "#") s = "#" + s;
    if (/^#[0-9a-fA-F]{3}$/.test(s)) {
      s = "#" + s[1] + s[1] + s[2] + s[2] + s[3] + s[3];
    }
    return HEX_RE.test(s) ? s.toLowerCase() : null;
  }

  function validColor(c) {
    var hex = typeof c === "string" ? normalizeHex(c) : null;
    if (hex) return hex;
    var n = Math.round(+c);
    return n >= 1 && n <= 8 ? n : 1;
  }

  function colorVars(color) {
    var hex = typeof color === "string" ? normalizeHex(color) : null;
    if (hex) {
      var r = parseInt(hex.slice(1, 3), 16);
      var g = parseInt(hex.slice(3, 5), 16);
      var b = parseInt(hex.slice(5, 7), 16);
      return "--pc:" + hex + ";--pc-bg:rgba(" + r + "," + g + "," + b + ",0.16)";
    }
    var n = (((+color || 1) - 1) % 8) + 1;
    return "--pc:var(--p" + n + ");--pc-bg:var(--p" + n + "-bg)";
  }

  function projVars(project) {
    return colorVars(project && project.color);
  }

  /** Relative luminance, used only to warn about a hex that will be hard to see. */
  function luminance(hex) {
    var parts = [1, 3, 5].map(function (i) {
      var v = parseInt(hex.substr(i, 2), 16) / 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * parts[0] + 0.7152 * parts[1] + 0.0722 * parts[2];
  }

  /* ------------------------------------------------------------- confirms */

  /**
   * Every action that removes, clears or deletes something routes through here.
   * It renders into its own layer so it can stack over an open modal without
   * tearing that modal down, which matters for Delete inside the task editor
   * and Remove inside settings.
   */
  function confirmAction(opts) {
    var root = $("#confirmRoot");
    root.textContent = "";
    confirmOpen = true;

    var box = h("div", { class: "modal is-narrow" }, [
      h("div", { class: "modal-head" }, [h("h2", { text: opts.title })]),
      h("div", { class: "modal-body" }, [
        h("p", { class: "confirm-body", text: opts.body }),
        opts.detail ? h("p", { class: "hint", text: opts.detail }) : null,
      ]),
      h("div", { class: "modal-foot" }, [
        h("div", { class: "grow" }),
        h("button", { class: "btn", text: "Cancel", onclick: closeConfirm }),
        h("button", {
          class: "btn " + (opts.danger === false ? "is-primary" : "is-destroy"),
          text: opts.confirmLabel || "Delete",
          onclick: function () {
            closeConfirm();
            opts.onConfirm();
          },
        }),
      ]),
    ]);
    var scrim = h("div", {
      class: "scrim is-confirm",
      onclick: function (ev) {
        if (ev.target === scrim) closeConfirm();
      },
    });
    scrim.appendChild(box);
    root.appendChild(scrim);
    var buttons = box.querySelectorAll(".modal-foot .btn");
    if (buttons.length) buttons[buttons.length - 1].focus();
  }

  function closeConfirm() {
    $("#confirmRoot").textContent = "";
    confirmOpen = false;
  }

  /**
   * The same layer, one button, nothing to agree to: used when an action is
   * refused rather than offered. Saying why in the place the click landed
   * beats a toast that has gone by the time the question forms.
   */
  function noticeAction(opts) {
    var root = $("#confirmRoot");
    root.textContent = "";
    confirmOpen = true;

    var box = h("div", { class: "modal is-narrow" }, [
      h("div", { class: "modal-head" }, [h("h2", { text: opts.title })]),
      h("div", { class: "modal-body" }, [
        h("p", { class: "confirm-body", text: opts.body }),
        opts.detail ? h("p", { class: "hint", text: opts.detail }) : null,
      ]),
      h("div", { class: "modal-foot" }, [
        h("div", { class: "grow" }),
        h("button", {
          class: "btn is-primary",
          text: opts.confirmLabel || "Got It",
          onclick: closeConfirm,
        }),
      ]),
    ]);
    var scrim = h("div", {
      class: "scrim is-confirm",
      onclick: function (ev) {
        if (ev.target === scrim) closeConfirm();
      },
    });
    scrim.appendChild(box);
    root.appendChild(scrim);
    var btn = box.querySelector(".modal-foot .btn");
    if (btn) btn.focus();
  }

  /* ------------------------------------------------- unfinished work guard */

  /**
   * A project or a person cannot be deleted while work on them is still
   * live. Yet to Start, In Progress and On Hold all count as live; only
   * Completed work is finished with. Reassigning or deleting that work
   * first forces the decision about where it goes to be made deliberately,
   * instead of a delete quietly moving it or orphaning it.
   */
  var LIVE_STATUSES = ["todo", "doing", "hold", "delayed"];

  function liveTasks(pred) {
    return state.tasks.filter(function (t) {
      return pred(t) && LIVE_STATUSES.indexOf(t.status || "todo") !== -1;
    });
  }

  function statusTally(list) {
    var counts = {};
    list.forEach(function (t) {
      counts[t.status] = (counts[t.status] || 0) + 1;
    });
    return LIVE_STATUSES.filter(function (s) {
      return counts[s];
    })
      .map(function (s) {
        return counts[s] + " " + STATUS[s].label;
      })
      .join(", ");
  }

  function refuseDelete(what, name, list, detail) {
    noticeAction({
      title: "Cannot Delete This " + what,
      body:
        name +
        " still has " +
        list.length +
        (list.length === 1 ? " unfinished task" : " unfinished tasks") +
        ": " +
        statusTally(list) +
        ".",
      detail: detail,
    });
  }

  /* ---------------------------------------------------------------- notes */

  /**
   * A task holds a list of notes, each a small piece of rich text. Notes are
   * written in a contenteditable box, so you can select a word and turn just
   * that word into a link.
   *
   * Everything that comes out of that box, or off the clipboard, is rebuilt
   * from scratch through sanitizeNote() before it is stored or shown: elements
   * are recreated by name from a whitelist and the only attribute ever carried
   * over is an href that passed safeUrl(). Nothing pasted can bring a script,
   * an event handler, or a javascript: URL along with it.
   */

  var NOTE_TAGS = {
    A: 1, B: 1, STRONG: 1, I: 1, EM: 1, U: 1, BR: 1,
    UL: 1, OL: 1, LI: 1, P: 1, DIV: 1, SPAN: 1,
  };

  /** A link target we are willing to render, or null. Bare domains get https. */
  function safeUrl(raw) {
    var v = String(raw == null ? "" : raw).trim();
    if (!v) return null;
    if (/^(https?:\/\/|mailto:)/i.test(v)) return v;
    if (/^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9-]+)+(?:[:\/?#]|$)/i.test(v)) {
      return "https://" + v;
    }
    return null;
  }

  function sanitizeNote(html) {
    var parsed = new DOMParser().parseFromString(
      "<body>" + String(html == null ? "" : html) + "</body>",
      "text/html"
    );
    var out = document.createElement("div");

    function walk(src, dest) {
      for (var n = src.firstChild; n; n = n.nextSibling) {
        if (n.nodeType === 3) {
          dest.appendChild(document.createTextNode(n.nodeValue));
          continue;
        }
        if (n.nodeType !== 1) continue;
        var tag = n.tagName.toUpperCase();
        var href = tag === "A" ? safeUrl(n.getAttribute("href")) : null;
        /* an element we do not allow, or a link we do not trust, is unwrapped:
           its text survives, the element itself does not */
        if (!NOTE_TAGS[tag] || (tag === "A" && !href)) {
          if (tag === "SCRIPT" || tag === "STYLE") continue;
          walk(n, dest);
          continue;
        }
        var el = document.createElement(tag.toLowerCase());
        if (href) {
          el.setAttribute("href", href);
          el.setAttribute("target", "_blank");
          el.setAttribute("rel", "noopener noreferrer");
        }
        walk(n, el);
        dest.appendChild(el);
      }
    }
    walk(parsed.body, out);
    return out.innerHTML;
  }

  function noteIsEmpty(html) {
    var d = document.createElement("div");
    d.innerHTML = sanitizeNote(html);
    return !d.textContent.trim() && !d.querySelector("img");
  }

  /** Old plain-text notes, including the [label](url) shorthand, become HTML. */
  var LEGACY_LINK_RE =
    /\[([^\]\n]+)\]\((https?:\/\/[^\s)]+|mailto:[^\s)]+)\)|(https?:\/\/[^\s<>"']+|mailto:[^\s<>"']+)/g;

  function plainToNoteHtml(text) {
    var wrap = document.createElement("div");
    String(text == null ? "" : text)
      .split("\n")
      .forEach(function (line, li) {
        if (li) wrap.appendChild(document.createElement("br"));
        LEGACY_LINK_RE.lastIndex = 0;
        var last = 0;
        var m;
        while ((m = LEGACY_LINK_RE.exec(line)) !== null) {
          if (m.index > last) {
            wrap.appendChild(document.createTextNode(line.slice(last, m.index)));
          }
          var href = safeUrl(m[2] || m[3]);
          if (href) {
            var a = document.createElement("a");
            a.setAttribute("href", href);
            a.setAttribute("target", "_blank");
            a.setAttribute("rel", "noopener noreferrer");
            a.textContent = m[1] || m[3];
            wrap.appendChild(a);
          } else {
            wrap.appendChild(document.createTextNode(m[0]));
          }
          last = m.index + m[0].length;
        }
        if (last < line.length) wrap.appendChild(document.createTextNode(line.slice(last)));
      });
    return wrap.innerHTML;
  }

  function normalizeNotes(v) {
    if (Array.isArray(v)) {
      return v
        .map(function (n) {
          if (!n) return null;
          var html = n.html != null ? sanitizeNote(n.html) : plainToNoteHtml(n.text);
          if (noteIsEmpty(html)) return null;
          return { id: n.id || uid("n"), html: html, at: n.at || Date.now() };
        })
        .filter(Boolean);
    }
    if (typeof v === "string" && v.trim()) {
      return [{ id: uid("n"), html: plainToNoteHtml(v), at: Date.now() }];
    }
    return [];
  }

  function noteStamp(at) {
    var d = new Date(at);
    var day = d.getDate();
    var mon = MONTH[d.getMonth()].slice(0, 3);
    return day + " " + mon + ", " + E.fmtClock(d.getHours() * 60 + d.getMinutes());
  }

  function toast(msg) {
    var box = $("#toasts");
    var el = h("div", { class: "toast", text: msg });
    box.appendChild(el);
    setTimeout(function () {
      el.style.transition = "opacity .3s";
      el.style.opacity = "0";
      setTimeout(function () {
        if (el.parentNode) el.parentNode.removeChild(el);
      }, 320);
    }, 2600);
  }

  /* --------------------------------------------------------- gh sync ui */

  var ghUserName = null; // cached display name for whoever's token is active

  function renderGhStatus() {
    var el = $("#ghStatus");
    if (!el) return;
    if (!GITHUB_CONFIGURED) {
      el.style.display = "none";
      return;
    }
    el.style.display = "";
    var editor = GithubStore.canWrite();
    el.className = "gh-status " + (editor ? "is-editor" : "is-viewer");
    var label = editor ? "Editing" + (ghUserName ? " as " + ghUserName : "") : "View only";
    el.textContent = "";
    el.appendChild(h("span", { class: "gh-dot" }));
    el.appendChild(h("span", { text: label }));
  }

  function ghConnectFlow() {
    if (GithubStore.canWrite()) {
      var proceed = window.confirm("Disconnect this token and switch back to view only?");
      if (!proceed) return;
      ghSetToken("");
      ghUserName = null;
      renderGhStatus();
      toast("Switched to view only");
      return;
    }
    var entered = window.prompt(
      "Paste a GitHub personal access token with write access to this repo to enable editing.\n" +
        "Leave blank to stay in view-only mode."
    );
    if (!entered) return;
    ghSetToken(entered.trim());
    fetch("https://api.github.com/user", { headers: { Authorization: "token " + entered.trim() } })
      .then(function (res) {
        return res.ok ? res.json() : null;
      })
      .then(function (user) {
        ghUserName = user && (user.login || user.name);
        renderGhStatus();
        toast(ghUserName ? "Connected as " + ghUserName : "Connected");
      })
      .catch(function () {
        renderGhStatus();
      });
  }

  /* Everyone - editors and viewers alike - polls GitHub for a newer
     version of the file. Conditional requests (If-None-Match) mean a poll
     that finds nothing new costs nothing against the rate limit. A merge
     is skipped whenever something local is mid-flight, so an incoming
     update never clobbers a save the user is about to make or a modal
     they currently have open. */
  function startGhPolling() {
    if (!GITHUB_CONFIGURED) return;
    setInterval(function () {
      if (drag || saveTimer || openModalName || confirmOpen || noteEdit || detailEdit) return;
      GithubStore.checkRemote().then(function (r) {
        if (r.authError) {
          if (GithubStore.canWrite()) {
            toast("This token no longer has access - switched to view only");
            ghUserName = null;
            renderGhStatus();
          }
          return;
        }
        if (!r.changed || !r.data) return;
        state = migrate(r.data);
        recompute(null);
        render();
      });
    }, GH_POLL_MS);
  }

  /* ------------------------------------------------------------ hover tip */

  /**
   * A small custom tooltip so the delay before it appears is exact and
   * cancellable, which a native `title` attribute cannot give us. Content is
   * a list of [label, value] rows, rendered as an aligned label/colon/value
   * grid so the colons line up regardless of label length or font.
   */
  var HOVER_TIP_DELAY = 500; // exactly 0.5s
  var hoverTipTimer = null;
  var hoverTipEl = null;

  function hideHoverTip() {
    if (hoverTipTimer) {
      clearTimeout(hoverTipTimer);
      hoverTipTimer = null;
    }
    if (hoverTipEl) {
      if (hoverTipEl.parentNode) hoverTipEl.parentNode.removeChild(hoverTipEl);
      hoverTipEl = null;
    }
  }

  function showHoverTipAt(rows, x, y) {
    hideHoverTip();
    hoverTipEl = h("div", { class: "hover-tip" });
    rows.forEach(function (row) {
      hoverTipEl.appendChild(h("span", { class: "hover-tip-label", text: row[0] }));
      hoverTipEl.appendChild(h("span", { class: "hover-tip-colon", text: ":" }));
      hoverTipEl.appendChild(h("span", { class: "hover-tip-value", text: row[1] }));
    });
    document.body.appendChild(hoverTipEl);
    var pad = 8;
    var rect = hoverTipEl.getBoundingClientRect();
    var left = Math.min(x + 14, window.innerWidth - rect.width - pad);
    var top = Math.min(y + 18, window.innerHeight - rect.height - pad);
    hoverTipEl.style.left = Math.max(pad, left) + "px";
    hoverTipEl.style.top = Math.max(pad, top) + "px";
  }

  /** Attach the custom hover tip to an element. `rows` is a list of
      [label, value] pairs, shown as an aligned grid. Leaves `title` alone
      unless the caller has not set one; also sets an aria-label so the same
      information reaches assistive tech immediately, without waiting on the
      hover delay. */
  function attachHoverTip(el, rows) {
    if (!el.hasAttribute("aria-label")) {
      el.setAttribute(
        "aria-label",
        rows.map(function (row) { return row[0] + ": " + row[1]; }).join(". ")
      );
    }
    el.addEventListener("mouseenter", function (ev) {
      var x = ev.clientX;
      var y = ev.clientY;
      hoverTipTimer = setTimeout(function () {
        hoverTipTimer = null;
        showHoverTipAt(rows, x, y);
      }, HOVER_TIP_DELAY);
    });
    el.addEventListener("mouseleave", hideHoverTip);
    el.addEventListener("mousedown", hideHoverTip);
  }


  /* ----------------------------------------------------------- render: top */

  function render() {
    hideHoverTip();
    renderTop();
    renderBrandFilters();
    renderSide();
    renderCalendar();
    renderDetails();
  }

  function renderBrandFilters() {
    var box = $("#brandFilters");
    if (!box) return;
    box.textContent = "";
    var proj = state.ui.projectFilter ? projectById(state.ui.projectFilter) : null;
    var person = state.ui.personFilter ? personById(state.ui.personFilter) : null;
    if (proj) {
      box.appendChild(
        h("div", { class: "filter-chip", title: "Project: " + proj.name }, [
          h("span", { text: proj.name }),
          h("button", {
            type: "button",
            text: "\u2715",
            "aria-label": "Remove project filter",
            onclick: function () {
              state.ui.projectFilter = null;
              save();
              render();
            },
          }),
        ])
      );
    }
    if (person) {
      box.appendChild(
        h("div", { class: "filter-chip", title: "Team Member: " + person.name }, [
          h("span", { text: person.name }),
          h("button", {
            type: "button",
            text: "\u2715",
            "aria-label": "Remove team member filter",
            onclick: function () {
              state.ui.personFilter = null;
              save();
              render();
            },
          }),
        ])
      );
    }
  }

  function renderTop() {
    var top = $("#top");
    top.textContent = "";
    var label;

    if (state.ui.view === "month") {
      var mo = monthDays().month;
      label = MONTH[mo.m] + " " + mo.y;
    } else {
      var days = visibleDays();
      var a = days[0];
      var b = days[days.length - 1];
      if (state.ui.view === "day") {
        var ymd = E.keyFromDayIndex(a).split("-");
        label = DOW_FULL[E.weekdayFromDayIndex(a)] + ", " + MONTH[+ymd[1] - 1] + " " + +ymd[2];
      } else {
        var s1 = E.keyFromDayIndex(a).split("-");
        var s2 = E.keyFromDayIndex(b).split("-");
        label =
          s1[1] === s2[1]
            ? MONTH[+s1[1] - 1] + " " + +s1[2] + " to " + +s2[2]
            : MONTH[+s1[1] - 1] + " " + +s1[2] + " to " + MONTH[+s2[1] - 1] + " " + +s2[2];
      }
    }

    var rangeDays = state.ui.view === "month" ? monthDays().days : visibleDays();
    var capacity = 0;
    var booked = 0;
    rangeDays.forEach(function (d) {
      capacity += sched && sched.usable ? viewClock().capacityOf(d) : 0;
      booked += bookedMinutes(d);
    });
    /* Worst first: the deadline that went by longest ago is the one to look
       at, and unscheduled work sorts last because it has no landing time. */
    var lateTasks = visibleTasks()
      .filter(isLate)
      .sort(function (a, b) {
        if (a.deadline !== b.deadline) return a.deadline < b.deadline ? -1 : 1;
        return String(a.name).localeCompare(String(b.name));
      });
    var delayedTasks = visibleTasks()
      .filter(function (t) { return t.status === "delayed"; })
      .sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); });
    var doingTasks = visibleTasks()
      .filter(function (t) { return t.status === "doing"; })
      .sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); });

    top.appendChild(
      h("button", {
        class: "btn is-quiet side-toggle",
        text: "Panel",
        onclick: function () {
          document.body.classList.toggle("side-open");
        },
      })
    );
    top.appendChild(
      h("button", {
        class: "btn is-icon",
        title: "Previous",
        "aria-label": "Previous",
        text: "‹",
        onclick: function () {
          step(-1);
        },
      })
    );
    top.appendChild(
      h("button", {
        class: "btn is-icon",
        title: "Next",
        "aria-label": "Next",
        text: "›",
        onclick: function () {
          step(1);
        },
      })
    );
    top.appendChild(
      h("button", {
        class: "btn",
        text: "Today",
        onclick: function () {
          state.ui.anchor = todayKey();
          save();
          render();
        },
      })
    );
    top.appendChild(h("div", { class: "top-date", text: label }));
    top.appendChild(
      h(
        "div",
        { class: "seg" },
        ["day", "week", "month"].map(function (v) {
          return h("button", {
            text: v.charAt(0).toUpperCase() + v.slice(1),
            "aria-pressed": state.ui.view === v ? "true" : "false",
            onclick: function () {
              state.ui.view = v;
              save();
              render();
            },
          });
        })
      )
    );

    var searchIn = h("input", {
      class: "top-search",
      type: "search",
      value: state.ui.search || "",
      placeholder: "Search",
      "aria-label": "Search task names and notes",
      oninput: function () {
        state.ui.search = searchIn.value;
        save();
        renderSide();
        renderCalendar();
        renderDetails();
      },
    });
    top.appendChild(h("div", { class: "top-filters" }, [
      searchIn,
      filterActive()
        ? h("button", {
            class: "btn is-quiet is-icon",
            text: "✕",
            title: "Clear search and filters",
            "aria-label": "Clear search and filters",
            onclick: function () {
              state.ui.search = "";
              state.ui.projectFilter = null;
              state.ui.personFilter = null;
              save();
              render();
            },
          })
        : null,
    ]));

    top.appendChild(h("div", { class: "top-spacer" }));

    top.appendChild(
      h("div", { class: "stat" }, [
        h("b", { text: E.fmtDuration(booked) + " / " + E.fmtDuration(capacity) }),
        h("span", {
          text:
            state.ui.view === "day" ? "Day Booked" : state.ui.view === "month" ? "Month Booked" : "Week Booked",
        }),
      ])
    );
    /* The one figure in the top bar you can act on, so it is a button. Hover
       names the work, clicking opens the list and takes you to any of it. */
    if (lateTasks.length) {
      top.appendChild(
        h("button", {
          class: "stat is-late is-pressable",
          title:
            "Past deadline:\n" +
            lateTasks
              .map(function (t) {
                return "  " + t.name + " (due " + t.deadline + ")";
              })
              .join("\n") +
            "\n\nClick to open the list.",
          "aria-label": lateTasks.length + " tasks past their deadline. Open the list.",
          onclick: function (ev) {
            ev.stopPropagation();
            openLateList(ev.currentTarget, lateTasks);
          },
        }, [
          h("b", { text: String(lateTasks.length) }),
          h("span", { text: "Past Deadline" }),
        ])
      );
    }
    top.appendChild(
      h("button", {
        class: "stat is-late is-pressable",
        title: delayedTasks.length
          ? "Delayed:\n" +
            delayedTasks
              .map(function (t) {
                return "  " + t.name;
              })
              .join("\n") +
            "\n\nClick to open the list."
          : "No delayed tasks.",
        "aria-label": delayedTasks.length + " delayed tasks. Open the list.",
        onclick: function (ev) {
          ev.stopPropagation();
          openLateList(ev.currentTarget, delayedTasks, "delayed");
        },
      }, [
        h("b", { text: String(delayedTasks.length) }),
        h("span", { text: "Delayed Tasks" }),
      ])
    );
    top.appendChild(
      h("button", {
        class: "stat is-progress is-pressable",
        title: doingTasks.length
          ? "In Progress:\n" +
            doingTasks
              .map(function (t) {
                return "  " + t.name;
              })
              .join("\n") +
            "\n\nClick to open the list."
          : "No tasks in progress.",
        "aria-label": doingTasks.length + " tasks in progress. Open the list.",
        onclick: function (ev) {
          ev.stopPropagation();
          openLateList(ev.currentTarget, doingTasks, "doing");
        },
      }, [
        h("b", { text: String(doingTasks.length) }),
        h("span", { text: "In Progress" }),
      ])
    );

    top.appendChild(
      h("button", {
        class: "btn is-icon gear-button",
        text: "⚙",
        title: "Settings and tools",
        "aria-label": "Settings and tools",
        onclick: function (ev) {
          ev.stopPropagation();
          openMenu(ev.currentTarget);
        },
      })
    );
    top.appendChild(
      h("button", {
        class: "btn is-primary",
        text: "New Task",
        onclick: function () {
          openTask(null, {});
        },
      })
    );
  }

  function step(dir) {
    var d = E.dayIndexFromKey(state.ui.anchor);
    if (state.ui.view === "month") {
      var mo = E.monthOfDayIndex(d);
      var m = mo.m + dir;
      var y = mo.y;
      if (m < 0) {
        m = 11;
        y--;
      } else if (m > 11) {
        m = 0;
        y++;
      }
      state.ui.anchor = y + "-" + E.pad2(m + 1) + "-01";
    } else {
      state.ui.anchor = E.keyFromDayIndex(d + dir * (state.ui.view === "day" ? 1 : 7));
    }
    save();
    render();
  }

  /**
   * The Past Deadline figure, opened out. Each row says what is late, what
   * it was due, and where it currently lands, and takes you straight there.
   */
  function openLateList(anchorEl, list, mode) {
    var root = $("#menuRoot");
    var already = !!root.querySelector(".menu");
    root.textContent = "";
    if (already) return;
    var r = anchorEl.getBoundingClientRect();
    var isDelayed = mode === "delayed";
    var isDoing = mode === "doing";

    var rows = list.map(function (t) {
      var pl = sched.placements[t.id];
      return h(
        "button",
        {
          class: "laterow",
          title: "Open " + t.name,
          onclick: function () {
            root.textContent = "";
            state.ui.selectedId = t.id;
            if (pl) {
              state.ui.anchor = pl.startDate;
              if (state.ui.view === "month") state.ui.view = "week";
            }
            save();
            render();
          },
        },
        [
          h("span", { class: "laterow-name", text: t.name }),
          h("span", { class: "laterow-when" + (isDoing ? " is-progress" : "") }, [
            h("b", {
              text: isDelayed ? "DELAYED" : isDoing ? "IN PROGRESS" : "Due " + shortDate(t.deadline),
            }),
            h("i", {
              text: pl
                ? "lands " + shortDate(pl.endDate) + ", " + E.fmtClock(pl.endMin)
                : "not scheduled",
            }),
