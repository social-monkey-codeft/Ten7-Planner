  function nextColor(list) {
    var used = {};
    list.forEach(function (p) {
      used[p.color] = true;
    });
    for (var n = 1; n <= 8; n++) if (!used[n]) return n;
    return (list.length % 8) + 1;
  }

  /* settings */
  function openSettings() {
    var days = JSON.parse(JSON.stringify(state.settings.days));
    var breaks = JSON.parse(JSON.stringify(state.settings.breaks || []));
    var snap = state.settings.snapMin || DEFAULT_SNAP;
    var grid = h("div", { class: "daygrid" });
    var breakList = h("div", { class: "daygrid" });
    var totalEl = h("div", { class: "hint" });
    var order = [1, 2, 3, 4, 5, 6, 0];

    function dayNet(wd) {
      var d = days[wd];
      if (!d.on || d.end <= d.start) return 0;
      var mine = breaks.filter(function (b) {
        return b.days.indexOf(wd) !== -1 && b.end > b.start;
      });
      return E.carve(d.start, d.end, mine).reduce(function (a, s) {
        return a + (s.end - s.start);
      }, 0);
    }

    function refreshTotal() {
      var total = 0;
      var count = 0;
      order.forEach(function (wd) {
        var net = dayNet(wd);
        if (net > 0) {
          total += net;
          count++;
        }
      });
      totalEl.textContent =
        "Bookable capacity: " +
        E.fmtDuration(total) +
        " a week, across " +
        count +
        " working days, after breaks.";
    }

    var dayTotals = {};
    order.forEach(function (wd) {
      var d = days[wd];
      var startIn = h("input", { type: "time", step: "900", value: timeValue(d.start) });
      var endIn = h("input", { type: "time", step: "900", value: timeValue(d.end) });
      var total = h("span", { class: "dayrow-total" });
      dayTotals[wd] = total;
      var row = h("div", { class: "dayrow" + (d.on ? "" : " is-off") }, []);

      function paint() {
        row.className = "dayrow" + (d.on ? "" : " is-off");
        var net = dayNet(wd);
        total.textContent = net > 0 ? E.fmtDuration(net) : "off";
        refreshTotal();
      }
      var toggle = h("button", {
        class: "sw",
        type: "button",
        "aria-pressed": d.on ? "true" : "false",
        "aria-label": DOW_FULL[wd] + " working",
        onclick: function () {
          d.on = !d.on;
          toggle.setAttribute("aria-pressed", d.on ? "true" : "false");
          paint();
        },
      });
      startIn.addEventListener("change", function () {
        d.start = parseTimeValue(startIn.value, d.start);
        if (d.end <= d.start) {
          d.end = Math.min(1440, d.start + 60);
          endIn.value = timeValue(d.end);
        }
        paint();
      });
      endIn.addEventListener("change", function () {
        d.end = parseTimeValue(endIn.value, d.end);
        if (d.end <= d.start) {
          d.end = Math.min(1440, d.start + 60);
          endIn.value = timeValue(d.end);
        }
        paint();
      });

      row.appendChild(toggle);
      row.appendChild(h("span", { class: "dayrow-name", text: DOW[wd] }));
      row.appendChild(
        h("div", { style: "display:flex;gap:6px;align-items:center" }, [
          startIn,
          h("span", { class: "hint", text: "to" }),
          endIn,
        ])
      );
      row.appendChild(total);
      grid.appendChild(row);
      paint();
    });

    function repaintDayTotals() {
      order.forEach(function (wd) {
        var net = dayNet(wd);
        dayTotals[wd].textContent = net > 0 ? E.fmtDuration(net) : "off";
      });
      refreshTotal();
    }

    function drawBreaks() {
      breakList.textContent = "";
      if (!breaks.length) {
        breakList.appendChild(
          h("div", { class: "empty", text: "No breaks. Add one to make that time unbookable." })
        );
      }
      breaks.forEach(function (br, idx) {
        var nameIn = h("input", { type: "text", value: br.name, placeholder: "Lunch" });
        var startIn = h("input", { type: "time", step: "900", value: timeValue(br.start) });
        var endIn = h("input", { type: "time", step: "900", value: timeValue(br.end) });
        nameIn.addEventListener("change", function () {
          br.name = nameIn.value.trim() || "Break";
        });
        startIn.addEventListener("change", function () {
          br.start = parseTimeValue(startIn.value, br.start);
          if (br.end <= br.start) {
            br.end = Math.min(1440, br.start + 30);
            endIn.value = timeValue(br.end);
          }
          repaintDayTotals();
        });
        endIn.addEventListener("change", function () {
          br.end = parseTimeValue(endIn.value, br.end);
          if (br.end <= br.start) {
            br.end = Math.min(1440, br.start + 30);
            endIn.value = timeValue(br.end);
          }
          repaintDayTotals();
        });
        var dayToggles = h(
          "div",
          { class: "daypicker" },
          order.map(function (wd) {
            var on = br.days.indexOf(wd) !== -1;
            var b = h("button", {
              type: "button",
              text: DOW1[wd],
              title: DOW_FULL[wd],
              "aria-pressed": on ? "true" : "false",
              onclick: function () {
                var at = br.days.indexOf(wd);
                if (at === -1) br.days.push(wd);
                else br.days.splice(at, 1);
                b.setAttribute("aria-pressed", br.days.indexOf(wd) !== -1 ? "true" : "false");
                repaintDayTotals();
              },
            });
            return b;
          })
        );
        breakList.appendChild(
          h("div", { class: "breakrow" }, [
            nameIn,
            h("div", { style: "display:flex;gap:6px;align-items:center" }, [
              startIn,
              h("span", { class: "hint", text: "to" }),
              endIn,
            ]),
            dayToggles,
            h("button", {
              class: "btn is-quiet is-icon",
              type: "button",
              text: "✕",
              title: "Remove this break",
              onclick: function () {
                confirmAction({
                  title: "Remove This Break?",
                  body: "Remove " + br.name + "?",
                  detail:
                    "That time becomes bookable again, and it takes effect when you save these settings.",
                  confirmLabel: "Remove Break",
                  onConfirm: function () {
                    breaks.splice(idx, 1);
                    drawBreaks();
                    repaintDayTotals();
                  },
                });
              },
            }),
          ])
        );
      });
    }
    drawBreaks();

    var body = h("div", {}, [
      h("div", { class: "field" }, [
        h("label", { text: "Working Days and Hours" }),
        grid,
      ]),
      h("div", { class: "field" }, [
        h("label", { text: "Breaks" }),
        h("div", {
          class: "hint",
          style: "margin-bottom:6px",
          text: "Break time is removed from the ruler the scheduler works on, so nothing can be booked into it, by drag or by cascade.",
        }),
        breakList,
        h("button", {
          class: "btn",
          type: "button",
          style: "align-self:flex-start;margin-top:6px",
          text: "+ Add a Break",
          onclick: function () {
            breaks.push({
              id: uid("br"),
              name: "Break",
              start: 780,
              end: 810,
              days: [1, 2, 3, 4, 5],
            });
            drawBreaks();
            repaintDayTotals();
          },
        }),
      ]),
      totalEl,
    ]);

    modal(
      "settings",
      "Working Hours and Breaks",
      body,
      [
        h("div", { class: "grow" }),
        h("button", { class: "btn", text: "Cancel", onclick: closeModal }),
        h("button", {
          class: "btn is-primary",
          text: "Save",
          onclick: function () {
            var anyOn = order.some(function (wd) {
              return dayNet(wd) > 0;
            });
            if (!anyOn) {
              toast("Keep at least one working day with time left after breaks");
              return;
            }
            state.settings.days = days;
            state.settings.breaks = breaks;
            state.settings.snapMin = DEFAULT_SNAP;
            closeModal();
            commit(
              null,
              "Working hours updated",
              "Working Hours Updated|" +
                order.filter(function (wd) {
                  return dayNet(wd) > 0;
                }).length +
                " working days, " +
                breaks.length +
                (breaks.length === 1 ? " break, snap " : " breaks, snap ") +
                state.settings.snapMin +
                " min"
            );
          },
        }),
      ],
      true,
      true
    );
  }

  /* --------------------------------------------- holidays and time off */

  /**
   * Time off is a dated hole in one or more people's clocks: a public holiday
   * for everybody, or one person away for an afternoon. The scheduler treats it
   * exactly like a weekend, so the affected work shifts along on its own.
   */
  function openTimeOff() {
    var entries = JSON.parse(JSON.stringify(state.settings.timeOff || []));
    var today = todayKey();
    /* Anything that finished before this date has left the working list and
       lives in the archive instead. */
    var cutoff = E.keyFromDayIndex(E.dayIndexFromKey(today) - ARCHIVE_AFTER_DAYS);
    var list = h("div", { class: "offlist" });
    var archiveBox = h("div", {});
    var summary = h("div", { class: "hint" });

    /* one-off working weekend: a specific Saturday or Sunday, made a working
       day, without touching any other weekend date */
    var overrides = JSON.parse(JSON.stringify(state.settings.workOverrides || []));
    var overrideList = h("div", { class: "offlist" });
    var overrideDateIn = h("input", { type: "date", value: today, min: today });

    function drawOverrides() {
      overrideList.textContent = "";
      if (!overrides.length) {
        overrideList.appendChild(
          h("div", { class: "empty", text: "No one-off working weekend dates added." })
        );
        return;
      }
      overrides
        .slice()
        .sort(function (a, b) {
          return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
        })
        .forEach(function (ov) {
          var wd = E.weekdayFromDayIndex(E.dayIndexFromKey(ov.date));
          overrideList.appendChild(
            h("div", { class: "offrow" }, [
              h(
                "div",
                { style: "display:flex;align-items:center;justify-content:space-between;gap:9px" },
                [
                  h("span", { text: ov.date + " (" + DOW_FULL[wd] + ")" }),
                  h("button", {
                    class: "btn is-quiet is-icon",
                    type: "button",
                    text: "✕",
                    title: "Remove this working weekend date",
                    onclick: function () {
                      overrides = overrides.filter(function (o) {
                        return o.id !== ov.id;
                      });
                      drawOverrides();
                    },
                  }),
                ]
              ),
            ])
          );
        });
    }

    function endOf(e) {
      return e.to || e.from;
    }
    function isArchived(e) {
      return endOf(e) < cutoff;
    }
    function isPast(e) {
      return endOf(e) < today;
    }

    /* Whatever had already gone by when this dialog opened stays read-only
       for as long as it is open. Everything else has to sit today or later,
       so a holiday can never be booked into time that has been worked. */
    var locked = {};
    entries.forEach(function (e) {
      if (isPast(e)) locked[e.id] = true;
    });

    /* Newest at the top, oldest at the bottom, matching the archive below.
       Anything added in this sitting is pinned above everything else, so a
       row you just created never appears somewhere down the middle. */
    var addSeq = 0;
    var justAdded = {};

    function live() {
      return entries
        .filter(function (e) {
          return !isArchived(e);
        })
        .sort(function (a, b) {
          var aNew = justAdded[a.id] || 0;
          var bNew = justAdded[b.id] || 0;
          if (aNew !== bNew) return bNew - aNew;
          if (a.from !== b.from) return a.from < b.from ? -1 : 1;
          var ae = endOf(a);
          var be = endOf(b);
          return ae < be ? -1 : ae > be ? 1 : 0;
        });
    }
    function archived() {
      return entries.filter(isArchived);
    }

    function refreshSummary() {
      var l = live();
      var a = archived();
      if (!l.length && !a.length) {
        summary.textContent = "";
        return;
      }
      var days = 0;
      l.forEach(function (e) {
        days += Math.abs(E.dayIndexFromKey(endOf(e)) - E.dayIndexFromKey(e.from)) + 1;
      });
      summary.textContent =
        (l.length
          ? l.length +
            (l.length === 1 ? " entry" : " entries") +
            " covering " +
            days +
            (days === 1 ? " day" : " days") +
            ". Work lands around them automatically."
          : "Nothing current.") +
        (a.length
          ? "  " +
            a.length +
            (a.length === 1 ? " older entry sits" : " older entries sit") +
            " in the archive."
          : "");
    }

    function draw() {
      list.textContent = "";
      var rows = live();
      if (!rows.length) {
        list.appendChild(
          h("div", {
            class: "empty",
            text: "Nothing booked. Add a holiday for the team, or time off for one person.",
          })
        );
      }
      rows.forEach(function (e) {
        /* Once a holiday has gone by, editing or deleting it would silently
           re-flow work that has already happened, so it is locked. */
        var past = isPast(e);
        var nameIn = h("input", {
          type: "text",
          value: e.name,
          placeholder: "Diwali, or Leave",
          disabled: past,
        });
        var fromIn = h("input", {
          type: "date",
          value: e.from,
          min: past ? null : today,
          disabled: past,
        });
        var toIn = h("input", {
          type: "date",
          value: e.to || e.from,
          min: past ? null : today,
          disabled: past,
        });
        var startIn = h("input", {
          type: "time",
          step: "900",
          value: timeValue(e.start || 600),
          disabled: past,
        });
        var endIn = h("input", {
          type: "time",
          step: "900",
          value: timeValue(e.end || 1140),
          disabled: past,
        });
        var row = h("div", { class: "offrow" });

        function paintTimes() {
          row.className = "offrow" + (e.allDay ? " is-allday" : "") + (past ? " is-past" : "");
        }

        var allDayBtn = h("button", {
          class: "sw",
          type: "button",
          disabled: past,
          "aria-pressed": e.allDay ? "true" : "false",
          "aria-label": "All day",
          onclick: function () {
            if (past) return;
            e.allDay = !e.allDay;
            allDayBtn.setAttribute("aria-pressed", e.allDay ? "true" : "false");
            paintTimes();
          },
        });

        nameIn.addEventListener("change", function () {
          e.name = nameIn.value.trim() || "Time off";
        });
        /* The date pickers carry a minimum, but a typed date gets past that
           in some browsers, so the value is clamped here as well. */
        fromIn.addEventListener("change", function () {
          var v = fromIn.value || e.from;
          if (v < today) {
            v = today;
            toast("Time off can only be booked from today onwards");
          }
          e.from = v;
          fromIn.value = v;
          if (endOf(e) < e.from) {
            e.to = e.from;
            toIn.value = e.to;
          }
          refreshSummary();
        });
        toIn.addEventListener("change", function () {
          var v = toIn.value || e.from;
          if (v < today) {
            v = today;
            toast("Time off can only be booked from today onwards");
          }
          if (v < e.from) v = e.from;
          e.to = v;
          toIn.value = v;
          refreshSummary();
        });
        startIn.addEventListener("change", function () {
          e.start = parseTimeValue(startIn.value, e.start);
          if (e.end <= e.start) {
            e.end = Math.min(1440, e.start + 60);
            endIn.value = timeValue(e.end);
          }
        });
        endIn.addEventListener("change", function () {
          e.end = parseTimeValue(endIn.value, e.end);
          if (e.end <= e.start) {
            e.end = Math.min(1440, e.start + 60);
            endIn.value = timeValue(e.end);
          }
        });

        /* who it applies to: Everyone, or a set of people */
        var chips = h("div", { class: "offwho" });
        function paintChips() {
          Array.prototype.forEach.call(chips.children, function (c) {
            var who = c.getAttribute("data-who");
            var on =
              who === "_all"
                ? !e.people || !e.people.length
                : e.people && e.people.indexOf(who) !== -1;
            c.setAttribute("aria-pressed", on ? "true" : "false");
          });
        }
        chips.appendChild(
          h("button", {
            class: "offchip",
            type: "button",
            "data-who": "_all",
            text: "Everyone",
            disabled: past,
            onclick: function () {
              if (past) return;
              e.people = null;
              paintChips();
            },
          })
        );
        sortedPeople().forEach(function (person) {
          chips.appendChild(
            h("button", {
              class: "offchip",
              type: "button",
              "data-who": person.id,
              text: person.name,
              disabled: past,
              onclick: function () {
                if (past) return;
                if (!e.people) e.people = [];
                var at = e.people.indexOf(person.id);
                if (at === -1) e.people.push(person.id);
                else e.people.splice(at, 1);
                if (!e.people.length) e.people = null;
                paintChips();
              },
            })
          );
        });
        paintChips();

        row.appendChild(
          h("div", { class: "offrow-main" }, [
            nameIn,
            h("div", { class: "offdates" }, [
              fromIn,
              h("span", { class: "hint", text: "to" }),
              toIn,
            ]),
            past
              ? h("span", {
                  class: "offlock",
                  text: "🔒",
                  title:
                    "This has already happened, so it cannot be edited or deleted. Removing it would re-flow work that is already done.",
                })
              : h("button", {
                  class: "btn is-quiet is-icon",
                  type: "button",
                  text: "✕",
                  title: "Remove this entry",
                  onclick: function () {
                    confirmAction({
                      title: "Remove This Time Off?",
                      body: "Remove " + e.name + "?",
                      detail:
                        "That time becomes bookable again, and it takes effect when you save.",
                      confirmLabel: "Remove Entry",
                      onConfirm: function () {
                        entries = entries.filter(function (x) {
                          return x !== e;

        );
        if (past) {
          row.appendChild(
            h("div", {
              class: "offpast",

                "Already passed, so this entry is locked and cannot be deleted. It moves to the archive " +
                ARCHIVE_AFTER_DAYS +

            })

        }
        row.appendChild(
          h("div", { class: "offrow-sub" }, [
            h("div", { class: "offallday" }, [
              allDayBtn,
              h("span", { class: "offallday-label", text: "All Day" }),
            ]),
            h("div", { class: "offtimes" }, [
              startIn,
              h("span", { class: "hint", text: "to" }),
              endIn,
            ]),
            chips,
          ])
        );
        paintTimes();
        list.appendChild(row);
      });
    }

    /**
     * The archive. Old entries are moved out of the working list, not out of
     * the data: the calendar still reads them exactly as before, so nothing
     * in any view changes. This is only about keeping the list you actually
     * work with short.
     */
    function drawArchive() {
      archiveBox.textContent = "";
      var a = archived().slice().sort(function (x, y) {
        var ex = endOf(x);
        var ey = endOf(y);
        return ex < ey ? 1 : ex > ey ? -1 : 0;
      });
      if (!a.length) return;
      var rows = h("div", {});
      a.forEach(function (e) {
        rows.appendChild(
          h("div", { class: "offarch-row" }, [

          ),

    }

    draw();
    drawArchive();
    refreshSummary();
    drawOverrides();

    var body = h("div", {}, [
      h(
        "div",
        { class: "field", style: "margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line-soft)" },
        [
          h("label", { text: "One-Off Working Weekend" }),
          h("div", { class: "hint", style: "margin-bottom:6px" },
            "Make a single Saturday or Sunday a working day. Every other Saturday and Sunday stays non-working."
          ),
          h("div", { style: "display:flex;gap:6px;align-items:center;margin-bottom:8px" }, [
            overrideDateIn,
            h("button", {
              class: "btn",
              type: "button",
              text: "+ Add",
              onclick: function () {
                var v = overrideDateIn.value;
                if (!v) return;
                if (v < today) {
                  toast("Pick today or a future date");
                  return;
                }
                var wd = E.weekdayFromDayIndex(E.dayIndexFromKey(v));
                if (wd !== 0 && wd !== 6) {
                  toast("Pick a Saturday or a Sunday");
                  return;
                }
                if (
                  overrides.some(function (o) {
                    return o.date === v;
                  })
                ) {
                  toast("That date is already a working weekend");
                  return;
                }

                drawOverrides();
              },
            }),
          ]),
          overrideList,
        ]
      ),
      h("div", { class: "hint", style: "margin-bottom:10px" }, [
        "A day off, or part of one. The scheduler treats it exactly like a weekend, so anything booked in that time shifts to the next opening on its own. Give it to ",
        h("b", { text: "Everyone" }),
        " for a holiday, or to one person for their own leave. Only today onwards can be booked, and once an entry has passed it is locked for good.",
      ]),
      h("button", {
        class: "btn",
        type: "button",
        style: "align-self:flex-start;margin-bottom:10px",
        text: "+ Add Time Off",
        onclick: function () {
          var fresh = {
            id: uid("off"),
            name: "Holiday",
            from: today,
            to: today,
            allDay: true,
            start: 600,
            end: 1140,
            people: null,
          };
          entries.push(fresh);
          justAdded[fresh.id] = ++addSeq;
          draw();
          refreshSummary();
        },
      }),
      list,
      summary,
      archiveBox,
    ]);

    modal(
      "timeoff",
      "Holidays and Time Off",
      body,
      [
        h("div", { class: "grow" }),
        h("button", { class: "btn", text: "Cancel", onclick: closeModal }),
        h("button", {
          class: "btn is-primary",
          text: "Save",
          onclick: function () {
            var bad = null;
            entries.forEach(function (e) {
              if (locked[e.id] || isArchived(e)) return;
              if (e.from < today) bad = e;
            });
            if (bad) {
              toast(bad.name + " starts in the past. Time off can only be booked from today.");
              return;
            }
            state.settings.timeOff = entries.map(function (e) {
              var from = e.from;
              var to = e.to || e.from;
              if (to < from) {
                var swap = from;
                from = to;
                to = swap;
              }
              return {
                id: e.id,
                name: e.name || "Time off",
                from: from,
                to: to,
                allDay: !!e.allDay,
                start: e.allDay ? 0 : e.start,
                end: e.allDay ? 1440 : e.end,
                people: e.people && e.people.length ? e.people.slice() : null,
              };
            });
            state.settings.workOverrides = overrides.map(function (o) {
              return { id: o.id, date: o.date };
            });
            closeModal();
            commit(
              null,
              "Time off updated",
              "Holidays And Time Off Updated|" +
                live().length +
                (live().length === 1 ? " current entry" : " current entries") +
                ", " +
                archived().length +
                " archived, " +
                overrides.length +
                (overrides.length === 1 ? " working weekend date" : " working weekend dates")
            );
          },
        }),
      ],
      true,
      true
    );
  }

  /* data */

  /* One stable filename, never a dated one. A new file every day is a folder
     full of near-duplicates and no clear answer to which is current, so the
     backup overwrites itself instead. */
  var BACKUP_NAME = "ten7-backup.json";

  function exportData() {
    return {
      version: state.version,
      projects: state.projects,
      people: state.people,
      tasks: state.tasks,
      settings: state.settings,
    };
  }

  function exportText() {
    return JSON.stringify(exportData(), null, 2);
  }

  /* ==========================================================================
     Automatic backup
     --------------------------------------------------------------------------
     Two kinds, because neither is enough alone.

     The first is a snapshot kept in this browser under its own key, written a
     couple of minutes after anything changes. It costs nothing and it is what
     survives a bad restore or a mistaken Start Over. Two slots are kept, the
     latest and the one before it, so a single destructive action cannot take
     both.

     The second writes a real file on disk, and writes the SAME file every
     time rather than leaving a new download behind each day. That needs the
     File System Access API, so in practice Chrome or Edge on a desktop: you
     pick the file once and it is kept current in place afterwards. Where the
     API is missing the panel says so, and the manual download at least uses
     one fixed name so it overwrites rather than piling up.

     Both mirror what is in the app, deletions included, because mirroring is
     what a backup is for. The Change History is what protects a mistake.
     ======================================================================== */

  var AUTO_KEY = STORAGE_KEY + ".auto";
  var AUTO_DELAY = 120000; // let edits settle for two minutes
  var FILE_DELAY = 60000; // and a minute before touching the file
  var autoTimer = null;
  var fileTimer = null;
  var autoBackup = { at: 0, prevAt: 0, tasks: 0, full: false };
  var fileBackup = {
    supported: typeof window.showSaveFilePicker === "function",
    handle: null,
    name: null,
    at: 0,
    error: null,
  };
  var canPersist = Store === BrowserStore;

  /* ---- the handle has to outlive the page, and only IndexedDB can hold one */

  function idb(work) {
    return new Promise(function (resolve) {
      var req;
      try {
        req = window.indexedDB.open("tento7.backup", 1);
      } catch (err) {
        resolve(null);
        return;
      }
      req.onupgradeneeded = function () {
        req.result.createObjectStore("handles");
      };
      req.onerror = function () {
        resolve(null);
      };
      req.onsuccess = function () {
        try {
          work(req.result, resolve);
        } catch (err) {
          resolve(null);
        }
      };
    });
  }

  function putHandle(handle) {
    return idb(function (db, done) {
      var tx = db.transaction("handles", "readwrite");
      tx.objectStore("handles").put(handle, "backup");
      tx.oncomplete = function () {
        done(true);
      };
      tx.onerror = function () {
        done(null);
      };
    });
  }

  function getHandle() {
    return idb(function (db, done) {
      var tx = db.transaction("handles", "readonly");
      var req = tx.objectStore("handles").get("backup");
      req.onsuccess = function () {
        done(req.result || null);
      };
      req.onerror = function () {
        done(null);
      };
    });
  }

  function dropHandle() {
    return idb(function (db, done) {
      var tx = db.transaction("handles", "readwrite");
      tx.objectStore("handles").delete("backup");
      tx.oncomplete = function () {
        done(true);
      };
      tx.onerror = function () {
        done(null);
      };
    });
  }

  /* ---- the snapshot in this browser */

  function readAutoBackup() {
    if (!canPersist) return null;
    try {
      var raw = window.localStorage.getItem(AUTO_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (err) {
      return null;
    }
  }

  function writeAutoSnapshot() {
    autoTimer = null;
    if (!canPersist || !state) return;
    var held = readAutoBackup();
    var data = exportData();
    var text = JSON.stringify(data);
    /* nothing has actually changed, so leave both generations alone rather
       than pushing an identical copy in and losing the older one */
    if (held && held.data && JSON.stringify(held.data) === text) return;
    /* exactly two generations: the incoming one, and whatever the latest was.
       Its own `previous` is dropped, so this cannot grow without end. */
    var record = {
      at: Date.now(),
      tasks: state.tasks.length,
      data: data,
      previous: held && held.data ? { at: held.at, tasks: held.tasks, data: held.data } : null,
    };
    if (!store(record) && record.previous) {
      /* out of room: keep the newest generation and let the older one go */
      record.previous = null;
      if (!store(record)) {
        autoBackup.full = true;
        return;
      }
    }
    autoBackup = {
      at: record.at,
      prevAt: record.previous ? record.previous.at : 0,
      tasks: record.tasks,
      full: false,
    };
    if (openModalName === "data") openData();

    function store(rec) {
      try {
        window.localStorage.setItem(AUTO_KEY, JSON.stringify(rec));
        return true;
      } catch (err) {
        return false;
      }
    }
  }

  /* ---- the file on disk */

  function filePermission(handle, ask) {
    if (!handle || !handle.queryPermission) return Promise.resolve(false);
    return handle.queryPermission({ mode: "readwrite" }).then(function (p) {
      if (p === "granted") return true;
      if (!ask) return false;
      return handle.requestPermission({ mode: "readwrite" }).then(function (p2) {
        return p2 === "granted";
      });
    });
  }

  function writeBackupFile(ask) {
    fileTimer = null;
    if (!fileBackup.handle) return Promise.resolve(false);
    var handle = fileBackup.handle;
    var text = exportText();
    return filePermission(handle, !!ask)
      .then(function (ok) {
        if (!ok) {
          fileBackup.error = "permission";
          return false;
        }
        return handle.createWritable().then(function (w) {
          return w
            .write(text)
            .then(function () {
              return w.close();
            })
            .then(function () {
              fileBackup.at = Date.now();
              fileBackup.error = null;
              return true;
            });
        });
      })
      .catch(function () {
        fileBackup.error = "write";
        return false;
      })
      .then(function (ok) {
        if (openModalName === "data") openData();
        return ok;
      });
  }

  function chooseBackupFile() {
    if (!fileBackup.supported) return;
    var opts = {
      suggestedName: BACKUP_NAME,
      types: [
        { description: "Ten7 backup", accept: { "application/json": [".json"] } },
      ],
    };
    var picked;
    try {
      picked = window.showSaveFilePicker(opts);
    } catch (err) {
      fileBackup.error = "picker";
      openData();
      return;
    }
    picked
      .then(function (handle) {
        fileBackup.handle = handle;
        fileBackup.name = handle.name;
        fileBackup.error = null;
        putHandle(handle);
        return writeBackupFile(true);
      })
      .then(function (ok) {
        if (ok) toast("That file is now kept up to date on its own");
        openData();
      })
      .catch(function (err) {
        if (err && err.name === "AbortError") return;
        fileBackup.error = "picker";
        openData();
      });
  }

  function stopBackupFile() {
    confirmAction({
      title: "Stop Updating That File?",
      body: "Stop keeping " + (fileBackup.name || BACKUP_NAME) + " up to date?",
      detail:
        "The file itself is left exactly as it is, holding the last thing written to it. Nothing in your schedule changes.",
      confirmLabel: "Stop Updating It",
      onConfirm: function () {
        fileBackup.handle = null;
        fileBackup.name = null;
        fileBackup.at = 0;
        fileBackup.error = null;
        if (fileTimer) {
          clearTimeout(fileTimer);
          fileTimer = null;
        }
        dropHandle();
        openData();
        toast("Automatic file backup stopped");
      },
    });
  }

  /** Pick the file up again after a reload, if the grant is still standing. */
  function resumeBackupFile() {
    if (!fileBackup.supported) return;
    getHandle().then(function (handle) {
      if (!handle) return;
      fileBackup.handle = handle;
      fileBackup.name = handle.name;
      filePermission(handle, false).then(function (ok) {
        if (!ok) fileBackup.error = "permission";
        if (openModalName === "data") openData();
      });
    });
  }

  /** Called after every change. Both writes are debounced, never per keystroke. */
  function scheduleBackups() {
    if (autoTimer) clearTimeout(autoTimer);
    autoTimer = setTimeout(writeAutoSnapshot, AUTO_DELAY);
    if (fileBackup.handle) {
      if (fileTimer) clearTimeout(fileTimer);
      fileTimer = setTimeout(function () {
        writeBackupFile(false);
      }, FILE_DELAY);
    }
  }

  /** Closing the tab should not lose the last two minutes of work. */
  function flushBackups() {
    if (autoTimer) {
      clearTimeout(autoTimer);
      writeAutoSnapshot();
    }
    if (fileTimer) {
      clearTimeout(fileTimer);
      writeBackupFile(false);
    }
  }

  function agoLabel(at) {
    if (!at) return "not yet";
    var mins = Math.round((Date.now() - at) / 60000);
    var when = noteStamp(at);
    if (mins < 1) return when + ", just now";
    if (mins < 60) return when + ", " + mins + (mins === 1 ? " minute ago" : " minutes ago");
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return when + ", " + hrs + (hrs === 1 ? " hour ago" : " hours ago");
    return when;
  }

  function restoreAutoBackup(which) {
    var held = readAutoBackup();
    var slot = which === "previous" ? held && held.previous : held;
    if (!slot || !slot.data) {
      toast("There is no automatic backup to go back to yet");
      return;
    }
    restoreFrom(
      slot.data,
      "the automatic backup from " + noteStamp(slot.at)
    );
  }

  /**
   * Two ways out, because neither works everywhere. Inside the artifact viewer
   * the page cannot start a download itself, so the platform's save prompt does
   * it. Opened as a plain file, there is no platform, so a blob link does.
   */
  function downloadBackup() {
    var name = BACKUP_NAME;
    var text = exportText();
    if (Downloads) {
      Downloads.save({ filename: name, data: text }).then(
        function () {
          toast("Backup saved");
        },
        function (err) {
          if (err && err.code === "declined") return;
          toast("Could not save the file");
        }
      );
      return;
    }
    try {
      var url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
      var a = document.createElement("a");
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        URL.revokeObjectURL(url);
        if (a.parentNode) a.parentNode.removeChild(a);
      }, 1000);
      toast("Backup downloaded");
    } catch (err) {
      toast("Could not start the download");
    }
  }

  function restoreFrom(parsed, sourceName) {
    var incoming = Array.isArray(parsed && parsed.tasks) ? parsed.tasks.length : null;
    if (incoming === null && !Array.isArray(parsed && parsed.projects)) {
      toast("That file does not look like Ten 7 data");
      return;
    }
    confirmAction({
      title: "Restore This Backup?",
      body:
        "Replace everything with " +
        sourceName +
        " (" +
        incoming +
        (incoming === 1 ? " task" : " tasks") +
        ")?",
      detail:
        "Your " +
        state.tasks.length +
        " current " +
        (state.tasks.length === 1 ? "task" : "tasks") +
        ", projects, people and settings are discarded. This cannot be undone.",
      confirmLabel: "Restore Backup",
      onConfirm: function () {
        /* The history is history, not data, so it survives a restore. That
           is what makes a restore itself reversible. */
        var keepLog = state.log || [];
        state = migrate(parsed);
        state.log = keepLog;
        state.ui.anchor = todayKey();
        closeModal();
        commit(
          null,
          "Backup restored",
          "Backup Restored|" +
            sourceName +
            ", " +
            state.tasks.length +
            (state.tasks.length === 1 ? " task" : " tasks")
        );
      },
    });
  }

  /**
   * Start Over throws everything away, so it asks three times, and each
   * question is a different question rather than the same one repeated: what
   * is about to go, whether there is a way back, and then the plain
   * confirmation. Backing out at any point changes nothing at all.
   */
  function startOver() {
    var tasks = state.tasks.length;
    var projects = state.projects.length;
    var people = state.people.length;

    confirmAction({
      title: "Start Over? (1 of 3)",
      body:
        "This deletes all " +
        tasks +
        (tasks === 1 ? " task" : " tasks") +
        ", " +
        projects +
        (projects === 1 ? " project" : " projects") +
        " and " +
        people +
        (people === 1 ? " person" : " people") +
        ", and resets your working hours, breaks and time off.",
      detail: "Nothing has been deleted yet. There are two more questions after this one.",
      confirmLabel: "Yes, Continue",
      onConfirm: askAgain,
    });

    function askAgain() {
      confirmAction({
        title: "Are You Really Sure? (2 of 3)",
        body:
          "Do you have a way back? A backup file is the surest one. The Change History also keeps its recent versions, and survives this.",
        detail:
          "Cancel now, choose Download Backup, and come back to this once the file is somewhere safe.",
        confirmLabel: "I Have a Way Back, Continue",
        onConfirm: askOnceMore,
      });
    }

    function askOnceMore() {
      confirmAction({
        title: "Last Chance (3 of 3)",
        body: "Clear the entire schedule and start from an empty calendar?",
        detail: "This is the last question. The next click clears everything.",
        confirmLabel: "Delete Everything",
        onConfirm: function () {
          var keepLog = state.log || [];
          state = seed();
          state.log = keepLog;
          closeModal();
          commit(
            null,
            "Everything cleared",
            "Started Over|" +
              tasks +
              (tasks === 1 ? " task" : " tasks") +
              ", projects, people and settings all cleared"
          );
        },
      });
    }
  }

  function openData() {
    var sampleCount = state.tasks.filter(function (t) {
      return t.sample;
    }).length;
    var text = exportText();
    var sizeKb = (text.length / 1024).toFixed(1);

    var fileIn = h("input", {
      type: "file",
      accept: ".json,application/json",
      style: "display:none",
    });
    fileIn.addEventListener("change", function () {
      var f = fileIn.files && fileIn.files[0];
      fileIn.value = "";
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        var parsed;
        try {
          parsed = JSON.parse(String(reader.result));
        } catch (err) {
          toast("That file is not valid JSON");
          return;
        }
        restoreFrom(parsed, f.name);
      };
      reader.onerror = function () {
        toast("Could not read that file");
      };
      reader.readAsText(f);
    });

    /* ---- the two automatic backups, each with its own state to report */

    function autoRow() {
      if (!canPersist) {
        return h("div", { class: "autorow is-off" }, [
          h("div", {}, [
            h("div", { class: "autorow-title", text: "Automatic, In This Browser" }),
            h("div", { class: "autorow-when", text: "Not available" }),
            h("div", {
              class: "autorow-note",
              text:
                "This browser is not letting the page store anything, so the schedule lives only until the tab closes. A backup file is the only way to keep it.",
            }),
          ]),
          h("div", { class: "autorow-actions" }),
        ]);
      }
      var note = autoBackup.full
        ? "This browser has run out of room, so the automatic snapshot has stopped. A backup file on disk is the way round it."
        : autoBackup.at
        ? "Kept beside your schedule under its own key, and rewritten a couple of minutes after any change." +
          (autoBackup.prevAt
            ? " The one before it is kept as well, from " + noteStamp(autoBackup.prevAt) + "."
            : "")
        : "Written a couple of minutes after your next change, and again whenever you leave the tab.";
      return h("div", { class: "autorow" + (autoBackup.at ? "" : " is-off") }, [
        h("div", {}, [
          h("div", { class: "autorow-title", text: "Automatic, In This Browser" }),
          h("div", {
            class: "autorow-when",
            text:
              agoLabel(autoBackup.at) +
              (autoBackup.at
                ? "  ·  " + autoBackup.tasks + (autoBackup.tasks === 1 ? " task" : " tasks")
                : ""),
          }),
          h("div", { class: "autorow-note", text: note }),
        ]),
        h("div", { class: "autorow-actions" }, [
          autoBackup.at
            ? h("button", {
                class: "btn",
                text: "Restore This",
                onclick: function () {
                  restoreAutoBackup("latest");
                },
              })
            : null,
          autoBackup.prevAt
            ? h("button", {
                class: "btn",
                text: "Restore The One Before",
                onclick: function () {
                  restoreAutoBackup("previous");
                },
              })
            : null,
        ]),
      ]);
    }

    function fileRow() {
      var live = !!fileBackup.handle && !fileBackup.error;
      var kids = [h("div", { class: "autorow-title", text: "Automatic, To A File On Disk" })];
      var actions = [];

      if (!fileBackup.supported) {
        kids.push(h("div", { class: "autorow-when", text: "Not available here" }));
        kids.push(
          h("div", {
            class: "autorow-note",
            text:
              "Keeping one file up to date needs Chrome or Edge on a desktop. Download Backup below always writes " +
              BACKUP_NAME +
              ", so saving it over the previous one replaces it rather than piling up copies.",
          })
        );
      } else if (!fileBackup.handle) {
        kids.push(h("div", { class: "autorow-when", text: "Not set up" }));
        kids.push(
          h("div", {
            class: "autorow-note",
            text:
              "Choose a file once and it is rewritten in place from then on, a minute after any change. No second download, no dated copies.",
          })
        );
        actions.push(
          h("button", { class: "btn is-primary", text: "Keep A File Up To Date", onclick: chooseBackupFile })
        );
      } else if (fileBackup.error === "permission") {
        kids.push(h("div", { class: "filepath autorow-when", text: fileBackup.name }));
        kids.push(
          h("div", {
            class: "autorow-note",
            text:
              "The browser drops its permission to write when the page reloads, and only a click can give it back. One click and it carries on.",
          })
        );
        actions.push(
          h("button", {
            class: "btn is-primary",
            text: "Reconnect The File",
            onclick: function () {

            },
          })
        );
        actions.push(h("button", { class: "btn", text: "Stop", onclick: stopBackupFile }));
      } else if (fileBackup.error) {
        kids.push(h("div", { class: "filepath autorow-when", text: fileBackup.name }));
        kids.push(
          h("div", {
            class: "autorow-note",
            text: "The last write did not go through. The file may have been moved, renamed or deleted.",
          })
        );
        actions.push(
          h("button", {
            class: "btn",
            text: "Try Again",
            onclick: function () {
              writeBackupFile(true);
            },
          })
        );
        actions.push(
          h("button", { class: "btn", text: "Choose Another File", onclick: chooseBackupFile })
        );
        actions.push(h("button", { class: "btn", text: "Stop", onclick: stopBackupFile }));
      } else {
        kids.push(h("div", { class: "filepath autorow-when", text: fileBackup.name }));
        kids.push(
          h("div", {
            class: "autorow-note",
            text:
              "Last written " +
              agoLabel(fileBackup.at) +
              ". Rewritten in place a minute after any change, and whenever you leave the tab.",
          })
        );
        actions.push(
          h("button", {
            class: "btn",
            text: "Save It Now",
            onclick: function () {
              writeBackupFile(true).then(function (ok) {

              });

          })
        );
        actions.push(
          h("button", { class: "btn", text: "Choose Another File", onclick: chooseBackupFile })
        );
        actions.push(h("button", { class: "btn", text: "Stop", onclick: stopBackupFile }));
      }

      return h("div", { class: "autorow" + (live ? "" : " is-off") }, [
        h("div", {}, kids),
        h("div", { class: "autorow-actions" }, actions),
      ]);
    }

    var body = h("div", {}, [
      h("div", { class: "hint", style: "margin-bottom:12px" }, [
        "Your schedule lives in ",
        h("b", { text: Store.label }),
        ". It is backed up on its own as well, both here and, if you set it up, to one file on disk that is rewritten in place rather than downloaded again. A backup mirrors what is in the app, deletions included, so the ",
        h("b", { text: "Change History" }),
        " is what protects a mistake.",
      ]),
      h("dl", { class: "kv", style: "margin-top:0" }, [
        h("dt", { text: "Tasks" }),
        h("dd", { class: "mono", text: String(state.tasks.length) }),
        h("dt", { text: "Projects" }),
        h("dd", { class: "mono", text: String(state.projects.length) }),
        h("dt", { text: "People" }),
        h("dd", { class: "mono", text: String(state.people.length) }),
        h("dt", { text: "Backup Size" }),
        h("dd", { class: "mono", text: sizeKb + " KB" }),
      ]),
      autoRow(),
      fileRow(),
      h("div", { style: "display:flex;gap:6px;flex-wrap:wrap;margin-top:14px" }, [
        h("button", {
          class: "btn is-primary",
          text: "Download Backup",
          onclick: downloadBackup,
        }),
        h("button", {
          class: "btn",
          text: "Restore From File",
          onclick: function () {

          },
        }),
        sampleCount
          ? h("button", {
              class: "btn",
              text: "Clear " + sampleCount + " Sample Tasks",
              onclick: function () {
                confirmAction({
                  title: "Clear the Sample Tasks?",
                  body:

                    });
                    state.ui.selectedId = null;
                    closeModal();
                    commit(

    modal(

  /* -------------------------------------------------- change history panel */

  /**
   * The history, newest first, grouped by day. Each row is a version rather
   * than a step, because each carries a whole copy of the data, so any point
   * in the list can be returned to directly instead of walking back through
   * everything that happened since.
   */
  function openHistory() {
    var entries = (state.log || []).slice();
    var body = h("div", {});

    body.appendChild(
      h("div", { class: "hint", style: "margin-bottom:12px" }, [
        "Every change is recorded here, newest first, with a copy of the whole schedule as it stood immediately after it. ",
        h("b", { text: "Restore" }),
        " puts that copy back: tasks, projects, people and settings together. A restore is itself recorded, so it can be undone by restoring whatever came before it. The last ",
        h("b", { text: String(LOG_MAX) }),
        " changes are kept.",
      ])
    );

    if (!entries.length) {
      body.appendChild(
        h("div", {
          class: "empty",
          text: "Nothing recorded yet. Your next change starts the history.",
        })
      );
    }

    var dayName = null;
    var group = null;
    entries.forEach(function (e, i) {
      var day = logDayLabel(e.at);
      if (day !== dayName) {
        dayName = day;
        body.appendChild(h("div", { class: "cl-day", text: day }));
        group = h("div", { class: "cl-list" });
        body.appendChild(group);
      }
      group.appendChild(
        h("div", { class: "cl-row" + (i === 0 ? " is-current" : "") }, [
          h("span", { class: "cl-when", text: logStamp(e.at) }),
          h("div", { class: "cl-what" }, [
            h("b", { text: e.label }),
            e.detail ? h("span", { text: e.detail }) : null,
          ]),
          i === 0
            ? h("span", { class: "cl-tag", text: "Current Version" })
            : e.snapshot
            ? h("button", {
                class: "btn",
                text: "Restore",
                title: "Put the schedule back to how it was after this change",
                onclick: function () {
                  restoreVersion(e.id);
                },
              })
            : h("span", { class: "cl-tag", text: "No Copy Kept" }),
        ])
      );
    });

    modal(
      "changehistory",
      "Change History",
      body,
      [
        h("div", { class: "grow" }),
        h("button", { class: "btn is-primary", text: "Close", onclick: closeModal }),
      ],
      true
    );
  }

  /* ------------------------------------------------------------- undo */

  /**
   * Ctrl/Cmd-Z, built on the same snapshot log the Change History panel
   * reads. Locking and unlocking a task is deliberately excluded: those
   * entries are skipped when picking the undo target, so Ctrl-Z always
   * lands on the last thing that actually changed the work. Nothing new
   * is written to the log while undoing, so pressing it repeatedly keeps
   * walking further back instead of undoing its own undo.
   */
  function undoableLogEntries() {
    return (state.log || []).filter(function (e) {
      return e.label !== "Task Locked" && e.label !== "Task Unlocked";
    });
  }

  function performUndo() {
    if (openModalName) closeModal();
    $("#menuRoot").textContent = "";
    var list = undoableLogEntries();
    var targetIdx = undoCursor + 1;
    if (!list.length || targetIdx >= list.length) {
      toast("Nothing further back to undo");
      return;
    }
    var entry = list[targetIdx];
    if (!entry.snapshot) {
      toast("That change is too old to undo");
      return;
    }
    /* The action being reversed is list[undoCursor] (the most recent
     * undoable entry so far), not list[targetIdx]: that later entry is
     * only the destination snapshot we're restoring state to. Capture
     * its label before undoCursor moves on, so the toast names what was
     * actually undone. */
    var undoneEntry = list[undoCursor];
    var copy = JSON.parse(JSON.stringify(entry.snapshot));
    var restored = migrate(copy);
    state.version = restored.version;
    state.projects = restored.projects;
    state.people = restored.people;
    state.tasks = restored.tasks;
    state.settings = restored.settings;
    state.ui.selectedId = null;
    detailEdit = null;
    noteEdit = null;
    if (
      !state.projects.some(function (p) {
        return p.id === state.ui.projectFilter;
      })
    ) {
      state.ui.projectFilter = null;
    }
    if (
      !state.people.some(function (p) {
        return p.id === state.ui.personFilter;
      })
    ) {
      state.ui.personFilter = null;
    }
    undoCursor = targetIdx;
    recompute(null);
    toast("Undid: " + undoneEntry.label);
    save();
    render();
  }

  function restoreVersion(entryId) {
    var e = null;
    (state.log || []).forEach(function (x) {
      if (x.id === entryId) e = x;
    });
    if (!e) return;
    if (!e.snapshot) {
      noticeAction({
        title: "No Copy Kept",
        body:
          "This change is still on the record, but its copy of the schedule was let go to keep within the browser's storage limit.",
        detail: "Only the more recent changes keep a copy that can be restored.",
      });
      return;
    }
    var snap = e.snapshot;
    var when = logStamp(e.at) + " " + logDayLabel(e.at).toLowerCase();
    confirmAction({
      title: "Restore This Version?",
      body: "Put the schedule back to how it looked right after " + e.label + ", " + when + "?",
      detail:
        "Your current " +
        state.tasks.length +
        (state.tasks.length === 1 ? " task" : " tasks") +
        ", projects, people and settings are replaced by the " +
        snap.tasks.length +
        (snap.tasks.length === 1 ? " task" : " tasks") +
        " in that version. This restore is added to the log, so it can be undone.",
      confirmLabel: "Restore This Version",
      danger: false,
      onConfirm: function () {
        var copy = JSON.parse(JSON.stringify(snap));
        var restored = migrate(copy);
        state.version = restored.version;
        state.projects = restored.projects;
        state.people = restored.people;
        state.tasks = restored.tasks;
        state.settings = restored.settings;
        /* the view may have been pointing at something that version does not
           contain, so anything that names an id is cleared or checked */
        state.ui.selectedId = null;
        detailEdit = null;
        noteEdit = null;
        if (
          !state.projects.some(function (p) {
            return p.id === state.ui.projectFilter;
          })
        ) {
          state.ui.projectFilter = null;
        }
        if (
          !state.people.some(function (p) {
            return p.id === state.ui.personFilter;
          })
        ) {
          state.ui.personFilter = null;
        }
        closeModal();
        commit(null, "Version restored", "Version Restored|Back to " + e.label + ", " + when);
      },
    });
  }


  /* ------------------------------------------------------------ dragging */

  var drag = null;

  function pointerDown(ev) {
    if (ev.button != null && ev.button !== 0) return;
    var handle = ev.target.closest ? ev.target.closest("[data-drag]") : null;
    if (!handle) return;
    var mode = handle.getAttribute("data-drag");
    var id = handle.getAttribute("data-id");
    if (!id) return;
    var task = taskById(id);
    if (!task) return;

    if (mode === "select") {
      selectTask(id);
      return;
    }

    if (isViewOnly()) {
      toast("View only \u2014 ask an editor for a write-access token to make changes");
      return;
    }

    var host = handle.closest(".block");
    var grabOffsetMin = 0;
    if (mode === "move" && host) {
      var part = +host.getAttribute("data-part") || 0;
      var pl = sched.placements[id];
      var before = 0;
      for (var i = 0; i < part && pl; i++) before += pl.blocks[i].minutes;
      var r = host.getBoundingClientRect();
      grabOffsetMin = before + ((ev.clientY - r.top) / HOUR) * 60;
    }

    drag = {
      mode: mode,
      id: id,
      task: task,
      startX: ev.clientX,
      startY: ev.clientY,
      active: false,
      grabOffsetMin: grabOffsetMin,
      el: host || handle,
      target: null,
      newDur: task.durationMin,
    };
    try {
      handle.setPointerCapture(ev.pointerId);
    } catch (err) {
      /* not fatal */
    }
    ev.preventDefault();
  }

  function pointerMove(ev) {
    if (!drag) return;
    if (!drag.active) {
      if (Math.abs(ev.clientX - drag.startX) < 4 && Math.abs(ev.clientY - drag.startY) < 4) return;
      activateDrag();
    }
    if (drag.mode === "resize") updateResize(ev);
    else updateMove(ev);
    autoScroll(ev);
  }

  function activateDrag() {
    drag.active = true;
    document.body.classList.add("is-dragging");
    var p = projectById(drag.task.projectId);
    if (drag.mode !== "resize") {
      drag.ghost = h("div", { class: "ghost", style: projVars(p) + ";width:190px" }, [
        h("div", { class: "block-title", text: drag.task.name }),
        h("div", {
          class: "block-meta",
          id: "ghostMeta",
          text: E.fmtDuration(drag.task.durationMin),
        }),
      ]);
      document.body.appendChild(drag.ghost);
      if (drag.mode === "move" && drag.el) drag.el.classList.add("is-ghosted");
    } else {
      drag.readout = h(
        "div",
        { class: "ghost", style: projVars(p) + ";padding:4px 9px" },
        h("div", { class: "block-meta", text: E.fmtDuration(drag.task.durationMin) })
      );
      document.body.appendChild(drag.readout);
    }
  }

  function clearPreview() {
    Array.prototype.forEach.call(document.querySelectorAll(".drop-preview,.month-cell.is-drop"), function (n) {
      if (n.classList.contains("month-cell")) n.classList.remove("is-drop");
      else if (n.parentNode) n.parentNode.removeChild(n);
    });
  }

  function updateMove(ev) {
    if (drag.ghost) {
      drag.ghost.style.left = ev.clientX + 12 + "px";
      drag.ghost.style.top = ev.clientY - 12 + "px";
    }
    clearPreview();
    drag.target = null;

    var el = document.elementFromPoint(ev.clientX, ev.clientY);
    if (!el || !el.closest) return;

    /* month view: a coarse "put this on that day" gesture */
    var cell = el.closest(".month-cell");
    if (cell) {
      if (cell.getAttribute("data-off")) return;
      cell.classList.add("is-drop");
      drag.target = { dateKey: cell.getAttribute("data-date"), min: null, month: true };
      if (drag.ghost) {
        var gm = drag.ghost.querySelector("#ghostMeta");
        if (gm) gm.textContent = "Earliest free slot on " + cell.getAttribute("data-date");
      }
      return;
    }

    var col = el.closest(".col");
    if (!col || col.getAttribute("data-off")) return;

    var dayIndex = +col.getAttribute("data-day");
    var win = viewClock().window(dayIndex);
    if (!win) return;
    var range = gridRange();
    var rect = col.getBoundingClientRect();
    var snap = state.settings.snapMin || DEFAULT_SNAP;
    var raw = range.start + ((ev.clientY - rect.top) / HOUR) * 60 - drag.grabOffsetMin;
    var min = Math.round(raw / snap) * snap;
    min = Math.max(win.start, Math.min(win.end - snap, min));

    drag.target = { dateKey: col.getAttribute("data-date"), min: min, dayIndex: dayIndex };

    /* preview what the engine will actually do with this drop, breaks and all */
    var startW = viewClock().toW({ d: dayIndex, m: min });
    if (startW === null) return;
    var blocks = viewClock().expand(startW, drag.task.durationMin);
    var shown = blocks.filter(function (b) {
      return b.dateKey === col.getAttribute("data-date");
    });
    var elsewhere = blocks.length - shown.length;
    shown.forEach(function (b, i) {
      col.appendChild(
        h(
          "div",
          {
            class: "drop-preview",
            style:
              "top:" +
              ((b.startMin - range.start) / 60) * HOUR +
              "px;height:" +
              Math.max(14, (b.minutes / 60) * HOUR - 2) +
              "px",
          },
          i === 0
            ? h("b", {
                text:
                  E.fmtClock(b.startMin) +
                  " to " +
                  E.fmtClock(b.endMin) +
                  (elsewhere ? "  +" + elsewhere + " more" : ""),
              })
            : null
        )
      );
    });
    if (drag.ghost) {
      var meta = drag.ghost.querySelector("#ghostMeta");
      if (meta) {
        meta.textContent =
          DOW[E.weekdayFromDayIndex(dayIndex)] +
          " " +
          E.fmtClock(min) +
          "  ·  " +
          E.fmtDuration(drag.task.durationMin);
      }
    }
  }

  function updateResize(ev) {
    var pl = sched.placements[drag.id];
    if (!pl) return;
    var el = document.elementFromPoint(ev.clientX, ev.clientY);
    var col = el && el.closest ? el.closest(".col") : null;
    var range = gridRange();
    var snap = state.settings.snapMin || DEFAULT_SNAP;
    var newDur = drag.newDur;

    if (col && !col.getAttribute("data-off")) {
      var dayIndex = +col.getAttribute("data-day");
      var rect = col.getBoundingClientRect();
      var min = range.start + ((ev.clientY - rect.top) / HOUR) * 60;
      var w = viewClock().toW({ d: dayIndex, m: Math.round(min) });
      if (w !== null) newDur = Math.max(snap, Math.round((w - pl.w) / snap) * snap);
    }
    drag.newDur = newDur;

    if (drag.readout) {
      drag.readout.style.left = ev.clientX + 14 + "px";
      drag.readout.style.top = ev.clientY + 8 + "px";
      drag.readout.textContent = "";
      drag.readout.appendChild(h("div", { class: "block-meta", text: E.fmtDuration(newDur) }));
    }
    if (drag.el) {
      var lastB = pl.blocks[pl.blocks.length - 1];
      var seg = viewClock().segmentAt(lastB.d, lastB.startMin);
      var beforeLast = pl.dur - lastB.minutes;
      var shown = Math.min(newDur - beforeLast, seg ? seg.end - lastB.startMin : lastB.minutes);
      drag.el.style.height = Math.max(15, (Math.max(snap, shown) / 60) * HOUR - 2) + "px";
    }
  }

  function autoScroll(ev) {
    var body = $("#calBody");
    var r = body.getBoundingClientRect();
    if (ev.clientY < r.top + 44) body.scrollTop -= 10;
    else if (ev.clientY > r.bottom - 44) body.scrollTop += 10;
  }

  function pointerUp() {
    if (!drag) return;
    var d = drag;
    drag = null;
    document.body.classList.remove("is-dragging");
    clearPreview();
    if (d.ghost && d.ghost.parentNode) d.ghost.parentNode.removeChild(d.ghost);
    if (d.readout && d.readout.parentNode) d.readout.parentNode.removeChild(d.readout);
    if (d.el) d.el.classList.remove("is-ghosted");

    if (!d.active) {
      selectTask(d.id);
      return;
    }
    if (d.mode === "resize") {
      if (d.newDur !== d.task.durationMin) resizeTask(d.id, d.newDur);
      else render();
      return;
    }
    if (d.target && d.target.month) {
      dropOnDay(d.id, d.target.dateKey);
      return;
    }
    if (d.target) {
      state.ui.selectedId = d.id;
      placeTask(d.id, d.target.dateKey, d.target.min);
    } else {
      render();
    }
  }

  /**
   * Month-view drop: land the task in the earliest free slot on that day for
   * whoever owns it, rather than shoving the day's existing work forward.
   */
  function dropOnDay(id, dateKey) {
    var t = taskById(id);
    if (!t) return;
    var dayIndex = E.dayIndexFromKey(dateKey);
    var win = viewClock().window(dayIndex);
    if (!win) return;
    var patch = E.fillGaps(
      effectiveTasks()
        .filter(function (x) {
          return x.id !== id;
        })
        .concat([
          {
            id: id,
            durationMin: t.durationMin,
            assigneeId: primaryAssigneeId(t),
            assigneeIds: taskAssigneeIds(t),
            status: "todo",
            startDate: null,
          },
        ]),
      state.settings,
      [id],
      { d: dayIndex, m: win.start }
    );
    state.ui.selectedId = id;
    if (patch[id]) {
      t.startDate = patch[id].startDate;
      t.startMin = patch[id].startMin;
      commit(
        null,
        patch[id].startDate === dateKey
          ? null
          : "No room left that day, moved to the next opening",
        "Task Moved|" +
          t.name +
          " to the earliest free slot on " +
          shortDate(patch[id].startDate) +
          ", " +
          E.fmtClock(patch[id].startMin)
      );
    } else {
      placeTask(id, dateKey, win.start);
    }
  }

  function cancelDrag() {
    if (!drag) return;
    var d = drag;
    drag = null;
    document.body.classList.remove("is-dragging");
    clearPreview();
    if (d.ghost && d.ghost.parentNode) d.ghost.parentNode.removeChild(d.ghost);
    if (d.readout && d.readout.parentNode) d.readout.parentNode.removeChild(d.readout);
    render();
  }

  function selectTask(id) {
    state.ui.selectedId = state.ui.selectedId === id ? null : id;
    noteEdit = null;
    detailEdit = null;
    save();
    render();
  }

  /* --------------------------------------------------------------- events */

  function wire() {
    var ghEl = $("#ghStatus");
    if (ghEl) ghEl.addEventListener("click", ghConnectFlow);
    startGhPolling();
    document.addEventListener("pointerdown", pointerDown, true);
    document.addEventListener("pointermove", pointerMove);
    document.addEventListener("pointerup", pointerUp);
    document.addEventListener("pointercancel", cancelDrag);
    document.addEventListener("pointerdown", function (ev) {
      if (!ev.target.closest || !ev.target.closest(".menu")) $("#menuRoot").textContent = "";
    });

    /* click an empty slot to create a task there */
    $("#calBody").addEventListener("click", function (ev) {
      if (drag) return;
      if (isViewOnly()) {
        var offTarget = ev.target.closest ? ev.target.closest(".col, .month-cell") : null;
        if (offTarget) return;
      }
      var col = ev.target.closest ? ev.target.closest(".col") : null;
      if (col && ev.target === col) {
        if (col.getAttribute("data-off")) {
          toast(DOW_FULL[E.weekdayFromDayIndex(+col.getAttribute("data-day"))] + " is a non-working day");
          return;
        }
        var dayIndex = +col.getAttribute("data-day");
        var win = viewClock().window(dayIndex);
        var range = gridRange();
        var rect = col.getBoundingClientRect();
        var snap = state.settings.snapMin || DEFAULT_SNAP;
        var min = Math.round((range.start + ((ev.clientY - rect.top) / HOUR) * 60) / snap) * snap;
        min = Math.max(win.start, Math.min(win.end - snap, min));
        openTask(null, { startDate: col.getAttribute("data-date"), startMin: min });
        return;
      }
      var cell = ev.target.closest ? ev.target.closest(".month-cell") : null;
      if (cell && (ev.target === cell || ev.target.classList.contains("month-pills"))) {
        if (cell.getAttribute("data-off")) {
          toast(DOW_FULL[E.weekdayFromDayIndex(+cell.getAttribute("data-day"))] + " is a non-working day");
          return;
        }
        var d2 = +cell.getAttribute("data-day");
        openTask(null, {
          startDate: cell.getAttribute("data-date"),
          startMin: viewClock().window(d2).start,
        });
      }
    });

    /* Escape closes whatever is open. Ctrl/Cmd-Z undoes the last real change,
       skipping past any input, textarea or other editable field so browser
       and OS text-undo inside those fields keeps working as normal. */
    document.addEventListener("keydown", function (ev) {
      if ((ev.key === "z" || ev.key === "Z") && (ev.ctrlKey || ev.metaKey) && !ev.shiftKey && !ev.altKey) {
        var target = ev.target;
        var editable =
          target &&
          (target.tagName === "INPUT" ||
            target.tagName === "TEXTAREA" ||
            target.tagName === "SELECT" ||
            target.isContentEditable);
        if (!editable) {
          ev.preventDefault();
          performUndo();
        }
        return;
      }
      if (ev.key !== "Escape") return;
      if (drag) return cancelDrag();
      $("#menuRoot").textContent = "";
      if (confirmOpen) return closeConfirm();
      if (openModalName) return closeModal();
      if (noteEdit) {
        noteEdit = null;
        return renderDetails();
      }
      if (detailEdit) {
        detailEdit = null;
        return renderDetails();
      }
      if (state.ui.selectedId) {
        state.ui.selectedId = null;
        render();
      }
      document.body.classList.remove("side-open");
    });

    /* Leaving the tab is the moment a backup matters most, so anything still
       waiting on its timer is written out now. */
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") flushBackups();
    });
    window.addEventListener("pagehide", flushBackups);

    var resizeTimer = null;
    window.addEventListener("resize", function () {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        resizeTimer = null;
        if (!drag) renderCalendar();
      }, 120);
    });

    setInterval(function () {
      if (drag) return;
      recompute(null);
      var changed = syncAutomaticDelayedStatuses();
      if (changed) {
        recompute(null);
        record("Automatic Status Update", changed + (changed === 1 ? " task changed" : " tasks changed"));
        save();
        render();
      } else if (!openModalName && state.ui.view !== "month") {
        renderTop();
        renderCalendar();
        renderDetails();
      }
    }, 60000);
  }

  /* ----------------------------------------------------------------- boot */

  /* A private repo answers unauthenticated requests with nothing (not
     even "file not found" - it just declines), so once the repo is
     private every viewer, not only editors, needs a token before the app
     can load anything real. This gate runs first, verifies the token
     actually has access, and only then hands off to the normal boot. */
  function ghShowGate(bootFn, message) {
    var overlay = document.createElement("div");
    overlay.id = "ghGate";
    overlay.style.cssText =
      "position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;" +
      "background:#0f172a;color:#f8fafc;font-family:system-ui,sans-serif;text-align:center;padding:24px;";
    overlay.innerHTML =
      '<div style="max-width:360px;">' +
      (message ? '<p style="color:#e0737d;margin-bottom:12px;">' + message + "</p>" : "") +
      '<p style="margin-bottom:16px;line-height:1.5;">This schedule is private. Paste a GitHub personal ' +
      "access token (read access is enough just to view) for <b>" +
      GITHUB_OWNER +
      "/" +
      GITHUB_REPO +
      '</b>.</p>' +
      '<button id="ghGateBtn" style="padding:10px 18px;border-radius:6px;border:0;background:#2563eb;' +
      'color:#fff;cursor:pointer;font-size:13px;">Connect GitHub</button>' +
      "</div>";
    document.body.appendChild(overlay);
    $("#ghGateBtn").addEventListener("click", function () {
      var entered = window.prompt("Paste your GitHub personal access token:");
      if (!entered) return;
      ghSetToken(entered.trim());
      GithubStore.load().then(
        function () {
          overlay.parentNode.removeChild(overlay);
          bootFn();
        },
        function () {
          ghSetToken("");
          overlay.parentNode.removeChild(overlay);
          ghShowGate(bootFn, "That token didn't work \u2014 check it has access to this repo and try again.");
        }
      );
    });
  }

  function ghRequireTokenThenBoot(bootFn) {
    if (!GITHUB_CONFIGURED) return bootFn();
    if (!ghGetToken()) return ghShowGate(bootFn, null);
    /* A token is already saved from a previous visit - confirm it still
       works before committing to it, rather than discovering that mid-use. */
    GithubStore.load().then(
      function () {
        bootFn();
      },
      function () {
        ghSetToken("");
        ghShowGate(bootFn, "That saved token no longer works. Reconnect below.");
      }
    );
  }

  function boot() {
    Store.load().then(function (raw) {
    state = migrate(raw);

    /* what the automatic backups already know, so the panel can say so
       before anything has changed in this session */
    var held = readAutoBackup();
    if (held) {
      autoBackup = {
        at: held.at || 0,
        prevAt: held.previous ? held.previous.at || 0 : 0,
        tasks: held.tasks || 0,
        full: false,
      };
    }
    resumeBackupFile();

    if (!Array.isArray(state.log)) state.log = [];
    /* The history needs a floor, so the first thing it records is where it
       started. Without it the oldest change would have nothing behind it to
       go back to. */
    if (!state.log.length) {
      record(
        raw ? "History Started" : "Fresh Start",
        raw
          ? "Everything already in the schedule at this point"
          : "An empty calendar, ready for its first task"
      );
    }
    recompute(null);
    var delayedOnLoad = syncAutomaticDelayedStatuses();
    if (delayedOnLoad) {
      recompute(null);
      record(
        "Automatic Status Update",
        delayedOnLoad + (delayedOnLoad === 1 ? " task changed on load" : " tasks changed on load")
      );
    }
    save();
    wire();
    renderGhStatus();
    $("#menuRoot").textContent = "";
    render();
    var body = $("#calBody");
    var range = gridRange();
    var now = new Date();
    var nowMin = now.getHours() * 60 + now.getMinutes();
    if (nowMin > range.start && state.ui.view !== "month") {
      body.scrollTop = Math.max(0, ((nowMin - range.start) / 60) * HOUR - 120);
    }
    });
  }

  ghRequireTokenThenBoot(boot);
})();
</script>
</body>
</html>
